[package]
name = "burin-ci-checks"
version = "0.1.0"
description = "Workflow-derived local check planning for Burin Labs repositories."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/.github"
harn = ">=0.10.166,<0.11"
docs_url = "docs/local-workflow-checks.md"

[exports]
local_checks = "scripts/local-checks/lib.harn"
local_checks_cli = "scripts/local-checks/cli.harn"
ci_runtime_evidence = "scripts/ci-runtime-evidence/collector.harn"
candidate_manifest = "scripts/release-promotion/manifest.harn"
ci_latency = "scripts/ci-latency/lib.harn"
ci_job_proof = "scripts/ci-job-proof/lib.harn"
release_asset = "scripts/release-asset/download.harn"
review_admission = "scripts/smart-ship/review-admission.harn"

[dependencies]
harn-github-connector = { git = "https://github.com/burin-labs/harn-github-connector", tag = "v0.19.0" }
