name: Check Harn repository policy
description: Enforce organization-owned repository projections before package verification.

inputs:
  package-path:
    description: Repository-relative Harn package directory.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Check managed agent contract
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        manifest="$PACKAGE_PATH/harn.toml"

        if [[ ! -f AGENTS.md ]]; then
          echo "::error file=AGENTS.md::Harn package repositories must project the fleet agent contract"
          exit 1
        fi

        begin='<!-- BEGIN HARN SHARED AGENT CONTRACT: managed by harn-bump-fleet -->'
        end='<!-- END HARN SHARED AGENT CONTRACT -->'
        for marker in "$begin" "$end"; do
          count="$(grep -Fxc "$marker" AGENTS.md || true)"
          if [[ "$count" != 1 ]]; then
            echo "::error file=AGENTS.md::expected exactly one managed agent-contract marker: $marker"
            exit 1
          fi
        done

        if [[ ! -L CLAUDE.md || "$(readlink CLAUDE.md)" != AGENTS.md ]]; then
          echo "::error file=CLAUDE.md::CLAUDE.md must be a symlink to AGENTS.md"
          exit 1
        fi

        dependabot=".github/dependabot.yml"
        canonical_dependabot="${GITHUB_ACTION_PATH}/../../../templates/dependabot.yml"
        canonical_bytes="$(wc -c < "$canonical_dependabot" | tr -d '[:space:]')"
        if [[ ! -f "$dependabot" ]]; then
          echo "::error file=${dependabot}::Harn package repositories must project templates/dependabot.yml"
          exit 1
        fi
        if ! cmp -s -n "$canonical_bytes" "$canonical_dependabot" "$dependabot"; then
          echo "::error file=${dependabot}::the GitHub Actions Dependabot block must be the byte-for-byte templates/dependabot.yml prefix"
          diff -u "$canonical_dependabot" <(head -c "$canonical_bytes" "$dependabot") || true
          exit 1
        fi

        workflow=".github/workflows/ci.yml"
        if [[ ! -f "$workflow" ]]; then
          echo "::error file=${workflow}::Harn packages must expose the canonical CI workflow"
          exit 1
        fi
        if ! ruby "$GITHUB_ACTION_PATH/check-workflow.rb" "$workflow"; then
          echo "::error file=${workflow}::package CI must use the immutable organization workflow, merge queue trigger, and CI status roll-up"
          exit 1
        fi

        if grep -Eq '^[[:space:]]*\[\[providers\]\][[:space:]]*$' "$manifest"; then
          if ! grep -Eq 'docs/src/connectors/authoring\.md|docs\.harnlang\.com/connectors/authoring\.html' AGENTS.md; then
            echo "::error file=AGENTS.md::connector guidance must link to Harn's canonical authoring guide"
            exit 1
          fi
          if ! grep -Eiq '^## Provider notes$' AGENTS.md; then
            echo "::error file=AGENTS.md::connector-local guidance belongs under '## Provider notes'"
            exit 1
          fi
          copied_guidance='(^## (Quick repo conventions|How to test|Reference Rust impl|Upstream conventions|Harn module connectors|Connector package gate|Rust connectors|Testing|Development)$|File extension:|Entry point:|Tests live under|Run targeted checks|Run checks|cargo install harn-cli|harn --version|harn install|harn (check|lint|fmt|connector (check|test))|for test in tests/\*\.harn)'
          if grep -Eiq "$copied_guidance" AGENTS.md; then
            echo "::error file=AGENTS.md::connector repository is copying Harn-owned authoring guidance"
            exit 1
          fi
        fi
