name: Check Harn repository policy
description: Enforce organization-owned repository projections before package verification.

inputs:
  package-path:
    description: Repository-relative Harn package directory.
    required: false
    default: .
  token:
    description: Token used to read the repository's tags and releases.
    required: false
    default: ${{ github.token }}
  release-integrity-grace-seconds:
    description: How long a freshly pushed tag may go unpublished before it counts as stranded.
    required: false
    default: "3600"

runs:
  using: composite
  steps:
    - name: Check managed agent contract
      shell: bash
      env:
        PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        manifest="$PACKAGE_PATH/harn.toml"

        if [[ ! -f AGENTS.md ]]; then
          echo "::error file=AGENTS.md::Harn package repositories must project the fleet agent contract"
          exit 1
        fi

        begin='<!-- BEGIN HARN SHARED AGENT CONTRACT: managed by harn-bump-fleet -->'
        end='<!-- END HARN SHARED AGENT CONTRACT -->'
        for marker in "$begin" "$end"; do
          count="$(grep -Fxc "$marker" AGENTS.md || true)"
          if [[ "$count" != 1 ]]; then
            echo "::error file=AGENTS.md::expected exactly one managed agent-contract marker: $marker"
            exit 1
          fi
        done

        if [[ ! -L CLAUDE.md || "$(readlink CLAUDE.md)" != AGENTS.md ]]; then
          echo "::error file=CLAUDE.md::CLAUDE.md must be a symlink to AGENTS.md"
          exit 1
        fi

        dependabot=".github/dependabot.yml"
        canonical_dependabot="${GITHUB_ACTION_PATH}/../../../templates/dependabot.yml"
        canonical_bytes="$(wc -c < "$canonical_dependabot" | tr -d '[:space:]')"
        if [[ ! -f "$dependabot" ]]; then
          echo "::error file=${dependabot}::Harn package repositories must project templates/dependabot.yml"
          exit 1
        fi
        if ! cmp -s -n "$canonical_bytes" "$canonical_dependabot" "$dependabot"; then
          echo "::error file=${dependabot}::the GitHub Actions Dependabot block must be the byte-for-byte templates/dependabot.yml prefix"
          diff -u "$canonical_dependabot" <(head -c "$canonical_bytes" "$dependabot") || true
          exit 1
        fi

        workflow=".github/workflows/ci.yml"
        if [[ ! -f "$workflow" ]]; then
          echo "::error file=${workflow}::Harn packages must expose the canonical CI workflow"
          exit 1
        fi
        if ! ruby "$GITHUB_ACTION_PATH/check-workflow.rb" "$workflow"; then
          echo "::error file=${workflow}::package CI must use the immutable organization workflow, merge queue trigger, and CI status roll-up"
          exit 1
        fi

        if grep -Eq '^[[:space:]]*\[\[providers\]\][[:space:]]*$' "$manifest"; then
          if ! grep -Eq 'docs/src/connectors/authoring\.md|docs\.harnlang\.com/connectors/authoring\.html' AGENTS.md; then
            echo "::error file=AGENTS.md::connector guidance must link to Harn's canonical authoring guide"
            exit 1
          fi
          if ! grep -Eiq '^## Provider notes$' AGENTS.md; then
            echo "::error file=AGENTS.md::connector-local guidance belongs under '## Provider notes'"
            exit 1
          fi
          copied_guidance='(^## (Quick repo conventions|How to test|Reference Rust impl|Upstream conventions|Harn module connectors|Connector package gate|Rust connectors|Testing|Development)$|File extension:|Entry point:|Tests live under|Run targeted checks|Run checks|cargo install harn-cli|harn --version|harn install|harn (check|lint|fmt|connector (check|test))|for test in tests/\*\.harn)'
          if grep -Eiq "$copied_guidance" AGENTS.md; then
            echo "::error file=AGENTS.md::connector repository is copying Harn-owned authoring guidance"
            exit 1
          fi
        fi

    # These repositories publish by pushing a tag, so the manifest, changelog,
    # and package gates all run against an object that is already immutable and
    # signed. When one of those gates fails the version is burned and the tag is
    # stranded with nothing behind it -- the state that left v0.6.1 and v0.6.7
    # dangling in harn-github-connector. Nothing noticed either one until someone
    # went looking, so the invariant is asserted here on every package CI run.
    - name: Check release integrity
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        RELEASE_INTEGRITY_GRACE_SECONDS: ${{ inputs.release-integrity-grace-seconds }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"

        # --slurp merges the paginated pages into one array of pages; gh refuses
        # to combine it with --jq, so the flattening happens in a separate pipe.
        tags="$(gh api "repos/${REPO}/tags?per_page=100" --paginate --slurp \
          | jq -c '[.[] | .[] | {name: .name}]')"
        releases="$(gh api "repos/${REPO}/releases?per_page=100" --paginate --slurp \
          | jq -c '[.[] | .[] | {tag_name: .tag_name, draft: .draft}]')"

        # Dating every tag would cost a request per tag on a repository like harn
        # with hundreds of them. Only a tag with no release can be forgiven by the
        # grace window, so only those need a date; normally there are none.
        undated="$(jq -r --argjson releases "$releases" '
          ($releases | map(.tag_name)) as $published
          | map(select(.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
          | map(select(.name as $n | ($published | index($n)) | not))
          | .[].name
        ' <<<"$tags")"

        dated="[]"
        while IFS= read -r tag; do
          [[ -z "$tag" ]] && continue
          ref="$(gh api "repos/${REPO}/git/ref/tags/${tag}" 2>/dev/null || true)"
          date=""
          if [[ -n "$ref" ]]; then
            object_type="$(jq -r '.object.type' <<<"$ref")"
            object_sha="$(jq -r '.object.sha' <<<"$ref")"
            if [[ "$object_type" == "tag" ]]; then
              date="$(gh api "repos/${REPO}/git/tags/${object_sha}" --jq '.tagger.date' 2>/dev/null || true)"
            else
              date="$(gh api "repos/${REPO}/git/commits/${object_sha}" --jq '.committer.date' 2>/dev/null || true)"
            fi
          fi
          dated="$(jq -c --arg name "$tag" --arg date "$date" \
            '. + [{name: $name, date: (if $date == "" then null else $date end)}]' <<<"$dated")"
        done <<<"$undated"

        payload="$(jq -nc --argjson tags "$tags" --argjson dated "$dated" --argjson releases "$releases" '
          ($dated | map({(.name): .date}) | add // {}) as $dates
          | {tags: ($tags | map(. + {date: $dates[.name]})), releases: $releases}
        ')"

        if ! ruby "$GITHUB_ACTION_PATH/check-release-integrity.rb" <<<"$payload"; then
          echo "::error::every vX.Y.Z tag must have a published GitHub release; publish or delete the tags listed above"
          exit 1
        fi
