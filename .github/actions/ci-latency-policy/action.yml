name: Check CI latency policy
description: >-
  Reject undeclared required jobs, invalid SLOs, upward budget drift, and
  observed latency baselines that are absent, tampered, stale, or loosened.

inputs:
  policy:
    description: Repository-relative CI latency policy JSON.
    required: false
    default: .github/ci-latency.json
  workflow:
    description: Repository-relative workflow YAML governed by the policy.
    required: false
    default: .github/workflows/ci.yml
  baseline-sha:
    description: Optional base commit whose policy is the down-only budget baseline.
    required: false
    default: ""
  github-token:
    description: Read-only token used to fetch the policy at baseline-sha.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read the immutable CI latency baseline
      id: baseline
      if: ${{ inputs.baseline-sha != '' }}
      shell: bash
      env:
        BASELINE_SHA: ${{ inputs.baseline-sha }}
        GH_TOKEN: ${{ inputs.github-token }}
        POLICY_PATH: ${{ inputs.policy }}
      run: node "$GITHUB_ACTION_PATH/read-baseline.mjs"

    - name: Check declared CI latency contract
      shell: bash
      env:
        BASELINE_SHA: ${{ inputs.baseline-sha }}
        GH_TOKEN: ${{ inputs.github-token }}
        POLICY_PATH: ${{ inputs.policy }}
        WORKFLOW_PATH: ${{ inputs.workflow }}
        BASELINE_STATE: ${{ steps.baseline.outputs.state }}
        BASELINE_FILE: ${{ steps.baseline.outputs.baseline-path }}
      run: |
        set -euo pipefail
        baseline_args=()
        if [ -n "$BASELINE_SHA" ]; then
          case "$BASELINE_STATE" in
            found)
              if [ -z "$BASELINE_FILE" ] || [ ! -s "$BASELINE_FILE" ]; then
                echo "::error::Measured baseline file is missing; refusing policy validation"
                exit 1
              fi
              baseline_args=(--baseline "$BASELINE_FILE") ;;
            absent)
              echo "::notice::Complete immutable tree confirms no baseline policy at ${BASELINE_SHA}" ;;
            *)
              echo "::error::Baseline decision is unmeasured; refusing policy validation"
              exit 1 ;;
          esac
        fi
        ruby "$GITHUB_ACTION_PATH/check_ci_latency_policy.rb" \
          --policy "$POLICY_PATH" \
          --workflow "$WORKFLOW_PATH" \
          --repository "$GITHUB_REPOSITORY" \
          "${baseline_args[@]}"
