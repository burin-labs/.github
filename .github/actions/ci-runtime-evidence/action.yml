name: Collect CI runtime evidence
description: Collect complete job timing, runner, and cache evidence from GitHub Actions history.

inputs:
  github-token:
    description: Token with Actions read access to the measured repository.
    required: true
  repository:
    description: Repository in owner/name form.
    required: true
  workflow:
    description: Workflow file name or numeric workflow id.
    required: true
  queries-json:
    description: Event quotas as JSON, with optional branch per query and at most 100 runs each.
    required: true
  output:
    description: Path for the versioned JSON evidence record.
    required: false
    default: .harn/ci-runtime-evidence.json

outputs:
  report:
    description: Path to the JSON evidence record.
    value: ${{ steps.collect.outputs.report }}
  measured-runs:
    description: Number of complete workflow runs in the evidence record.
    value: ${{ steps.collect.outputs.measured-runs }}

runs:
  using: composite
  steps:
    - name: Collect complete runtime evidence
      id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CI_RUNTIME_REPOSITORY: ${{ inputs.repository }}
        CI_RUNTIME_WORKFLOW: ${{ inputs.workflow }}
        CI_RUNTIME_QUERIES_JSON: ${{ inputs.queries-json }}
        CI_RUNTIME_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "${CI_RUNTIME_OUTPUT}")"
        ruby "${GITHUB_ACTION_PATH}/collect.rb"
        measured="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("measuredRuns")' "${CI_RUNTIME_OUTPUT}")"
        printf 'report=%s\n' "${CI_RUNTIME_OUTPUT}" >> "${GITHUB_OUTPUT}"
        printf 'measured-runs=%s\n' "${measured}" >> "${GITHUB_OUTPUT}"
