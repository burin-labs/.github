name: Capture CI comparison commits
description: Resolve one exact merge base and candidate from local Git history.

inputs:
  base-ref:
    description: Fetched target ref, such as refs/remotes/origin/main.
    required: true
  head-ref:
    description: Candidate ref. HEAD selects the checked-out tree.
    required: false
    default: HEAD
  harn-version:
    description: Exact released Harn runtime.
    required: false
    default: "0.10.174"
  skip-harn-setup:
    description: Use the Harn already on PATH.
    required: false
    default: "false"

outputs:
  base-sha:
    description: The single merge base of the target and candidate.
    value: ${{ steps.comparison.outputs.base-sha }}
  base-tip-sha:
    description: Captured target commit.
    value: ${{ steps.comparison.outputs.base-tip-sha }}
  head-sha:
    description: Captured candidate commit.
    value: ${{ steps.comparison.outputs.head-sha }}

runs:
  using: composite
  steps:
    - name: Set up exact Harn release
      if: ${{ inputs.skip-harn-setup != 'true' }}
      uses: burin-labs/harn/.github/actions/setup-harn@389a3aeb579e70d73999d7af6eac7b22a30c7808
      with:
        version: ${{ inputs.harn-version }}
    - name: Capture comparison
      id: comparison
      shell: bash
      env:
        CI_COMPARISON_BASE_REF: ${{ inputs.base-ref }}
        CI_COMPARISON_HEAD_REF: ${{ inputs.head-ref }}
      run: |
        harn run --standalone \
          --grant workspace=env:GITHUB_WORKSPACE,expose=CI_COMPARISON_WORKSPACE \
          --grant base=env:CI_COMPARISON_BASE_REF,expose=CI_COMPARISON_BASE_REF \
          --grant head=env:CI_COMPARISON_HEAD_REF,expose=CI_COMPARISON_HEAD_REF \
          --grant output=env:GITHUB_OUTPUT,expose=GITHUB_OUTPUT \
          --read-only-root "$GITHUB_ACTION_PATH" \
          --read-only-root "$GITHUB_WORKSPACE" \
          --write-root "$(dirname "$GITHUB_OUTPUT")" \
          "$GITHUB_ACTION_PATH/cli.harn"
