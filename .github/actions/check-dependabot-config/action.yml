name: Check Dependabot config
description: >
  Fail when Dependabot cannot act — missing catch-alls, uncovered lockfiles,
  Cargo scope escapes, frozen exact pnpm overrides, or manifest upper bounds
  without a matching ignore. Parses manifests structurally with Harn.

inputs:
  harn-version:
    description: Published runtime used by the configuration checker
    required: false
    default: "0.10.170"
  skip-harn-setup:
    description: Reuse an already installed compatible Harn runtime
    required: false
    default: "false"
  repo-root:
    description: Repository root that contains .github/dependabot.yml
    required: false
    default: ${{ github.workspace }}
  require-lockfiles:
    description: >
      Fail if the scanner finds zero committed lockfiles. Enable in repos that
      always ship lockfiles (anti-vacuity). Leave off for actions-only package
      repos.
    required: false
    default: "false"
  require-overrides:
    description: >
      Fail if the scanner reads zero pnpm overrides. Enable in repos that always
      declare pnpm-workspace.yaml overrides (anti-vacuity).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install checker runtime
      id: runtime
      if: ${{ inputs.skip-harn-setup != 'true' }}
      uses: burin-labs/harn/.github/actions/setup-harn@389a3aeb579e70d73999d7af6eac7b22a30c7808
      with:
        version: ${{ inputs.harn-version }}
        install-dir: ${{ runner.temp }}/dependabot-config-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Check Dependabot config
      shell: bash
      env:
        DEPENDABOT_CHECK_ROOT: ${{ inputs.repo-root }}
        DEPENDABOT_CHECK_REQUIRE_LOCKFILES: ${{ inputs.require-lockfiles == 'true' && '1' || '0' }}
        DEPENDABOT_CHECK_REQUIRE_OVERRIDES: ${{ inputs.require-overrides == 'true' && '1' || '0' }}
        DEPENDABOT_CHECK_HARN_BINARY: ${{ steps.runtime.outputs.path }}
        DEPENDABOT_CHECK_OWNS_RUNTIME: ${{ inputs.skip-harn-setup != 'true' && '1' || '0' }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
