name: Merge override verdict
description: >-
  For a `CI status` aggregator whose dependencies failed: succeeds only when an
  admin merge override authorized this pull request's head, read from a
  pull_request_target run of main's merge-override-dispatch.yml. Never reads
  check runs, which any workflow with `checks: write` can create.

inputs:
  token:
    description: "Token with actions read access on this repository, normally the job's GITHUB_TOKEN."
    required: true

outputs:
  authorized:
    description: URL of the override run that authorized the head.
    value: ${{ steps.verdict.outputs.authorized }}

runs:
  using: composite
  steps:
    - name: Set up exact Harn release
      uses: burin-labs/harn/.github/actions/setup-harn@68ab397be4c1b7eece1743e0f8824840e05c2fa2 # bounded release-asset retries
      with:
        version: 0.10.133

    - name: Read the merge override verdict
      id: verdict
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OVERRIDE_REPOSITORY: ${{ github.repository }}
        OVERRIDE_PR: ${{ github.event.pull_request.number }}
        OVERRIDE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "${GITHUB_ACTION_PATH}/../../../scripts/merge-override/run.sh" verdict
