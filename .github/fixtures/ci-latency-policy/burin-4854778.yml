name: CI

# The main gate. Builds and tests everything that changed on every pull request,
# every push to main, and every merge-queue entry, then reports one "CI status"
# check that branch protection requires before a pull request can merge.
#
# The name must stay exactly "CI": deploy.yml waits on a workflow named "CI"
# finishing successfully on main, and that reference matches by name, not path.
on:
  push:
    branches: [main, develop]
    # Docs-only / accountability-log / meter-ledger pushes to main must not burn
    # CI minutes (private repo). A commit that touches ANY non-doc path still runs CI.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "scripts/meter-records/**"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  schedule:
    # Full cross-surface backstop for interactions that path-scoped PR/push
    # runs cannot see. Staggered away from the other daily audits.
    - cron: "31 11 * * *"
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run every job regardless of the paths filter"
        type: boolean
        default: true
      macos_route:
        description: "Probe from main only: run the long macOS jobs on this paid route instead of the minis (not counted against the spill cap; cost is on each job's summary)"
        type: choice
        options: [auto, blacksmith, github]
        default: auto

permissions:
  actions: read
  contents: read
  issues: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Run-scoped, immutable transfer from harn-prewarm to every Linux consumer.
  # The manifest inside independently binds checkout, runtime, compiler
  # contract, source graph, and payload; the name is routing, not authority.
  # The attempt is deliberately NOT in the name: `Re-run failed jobs` starts
  # a new attempt without re-running a green harn-prewarm, so an attempt-keyed
  # name left every rerun consumer with "Artifact not found" (bc#7803 attempt
  # 2). Artifacts are per run, so the attempt-1 upload is found; a full rerun
  # re-publishes the same content under the same name with `overwrite`.
  BURIN_HARN_BYTECODE_HANDOFF_NAME: harn-bytecode-${{ github.run_id }}-${{ github.sha }}
  # The commit a comparing gate (the Harn file-length ratchet) judges this run
  # against: the merge group's base in the queue, the pull request's base on a
  # pull request. Empty on a push to main, where the integrated commit is
  # judged against its first parent. A merge-queue checkout has no origin/main,
  # and its HEAD^1 is the previous queue entry rather than main, so this is the
  # only base authority there. A job that runs such a gate on a shallow
  # checkout fetches this commit before the gate runs.
  BURIN_COMPARISON_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || '' }}

concurrency:
  # Main pushes share one group keyed by ref. Merge trains can create dozens
  # of commits before the first run gets a runner; keeping one run per SHA
  # spent the full CI budget on obsolete trees. PR runs share a group by PR
  # number, and merge-group runs keep their own queue ref.
  #
  # Only a pull request run is cancelled when a newer one starts: its old head
  # is dead. A running main run is never cancelled. GitHub keeps at most one
  # running and one pending run per group, and a newer pending run replaces
  # the older pending one, so a merge train still costs about two runs and
  # each running run finishes. When a new merge cancelled the running main
  # run, busy runners meant no main run ever finished: on 2026-09-26 main had
  # no completed verdict for 4 hours, PRs inherited stale reds, and
  # `deploy.yml`, which waits for a finished main run, deployed nothing.
  # A merge-group run is not cancelled either: each queue entry has its own
  # ref and so its own group, and cancelling it would only fail that entry.
  #
  # The event is part of the key because a `schedule` run is on `refs/heads/main`
  # at the same tip SHA as the push run for that commit, so without it the
  # nightly backstop lands in the push run's group and cancels the verdict it
  # exists to double-check. It did: on 2026-09-22 the 11:31 cron cancelled
  # eight jobs of the push run for 34cfec6ce6, main read red, and `deploy.yml`
  # requires `workflow_run.event == 'push'`, so that commit could not deploy at
  # all. A backstop must never be able to cancel the thing it backs up, and the
  # same reasoning covers `workflow_dispatch`.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detection of idle self-hosted runners lives in the org reusable workflow so
  # Burin/Harn CI share one source of truth. Jobs that can actually use a
  # self-hosted runner gate `runs-on` on
  # `needs.runner-availability.outputs.{linux,windows,macos}`; pure
  # GitHub-hosted jobs deliberately do not wait for this probe. Jobs that start
  # later read a later re-read instead (`late-runner-availability` below).
  runner-availability:
    uses: burin-labs/.github/.github/workflows/runner-availability.yml@472ebb6b0f058d3b57c1c83a715c3621d01e761c
    with:
      minimum_online: 3
      minimum_online_by_pool: '{"macos":2}'
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Where the macOS jobs run, decided once (bc#8947).
  #
  # Named "mac-runner-placement" rather than anything starting with "macos-":
  # the runner-routing contract scans `runs-on` text for hosted runner
  # literals, and a job name of that shape reads as one, so the projections
  # below would refuse against the policy registry.
  #
  # The probe prints the same pool in two vocabularies and they answer
  # different questions: `macos=false (0 idle of 4 online)` means no job can
  # land now, while `capacity.macos.eligible` means the pool exists and meets
  # its online minimum, which the shared workflow documents as being for
  # deliberate queueing "regardless of idle capacity". Routing read `eligible`
  # and queued onto a starved pool; the job waited 36 minutes, never acquired
  # a runner, and GitHub cancelled it with no steps, so main read red.
  #
  # `idle > 0` per job is not enough either, because three jobs decide from one
  # reading: two that both see a single idle runner both queue. Each job takes
  # a fixed rank instead and asks for its own share, so rank k uses the pool
  # only when at least k runners are idle. The table and the rule live in
  # scripts/lib/macos-runner-routing.ts; the three jobs below are projections
  # of this one output and must not re-derive it.
  #
  # With `vars.BURIN_CI_MACOS_SPILL` set to `github` or `blacksmith`, a queueing
  # job the pool cannot start waits until the run is 15 minutes old for a mini,
  # and otherwise spills to that paid macOS target under a hard daily cap
  # (bc#9569). The cap is a ledger of git refs. This job runs checked-out code,
  # so its own token stays read-only; the app token that can write the ledger
  # and read the org's runner list is minted only when that code is main or
  # the merge-queue tree built on main (push to main, merge_group, schedule).
  # A pull request or a manual dispatch never spills: it queues on the minis.
  mac-runner-placement:
    name: Resolve macOS runner placement
    needs: [runner-availability]
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    outputs:
      swift: ${{ steps.resolve.outputs.swift }}
      swift_spilled: ${{ steps.resolve.outputs.swift_spilled }}
      rust_tui_macos: ${{ steps.resolve.outputs.rust_tui_macos }}
      rust_tui_macos_spilled: ${{ steps.resolve.outputs.rust_tui_macos_spilled }}
      cli_check_macos: ${{ steps.resolve.outputs.cli_check_macos }}
      swift_usd_per_minute: ${{ steps.resolve.outputs.swift_usd_per_minute }}
      rust_tui_macos_usd_per_minute: ${{ steps.resolve.outputs.rust_tui_macos_usd_per_minute }}
      cli_check_macos_usd_per_minute: ${{ steps.resolve.outputs.cli_check_macos_usd_per_minute }}
    steps:
      - id: spill-token
        # Only code already on main, or the approved merge-queue tree built on
        # main, may hold this token: never a pull request, and never a manual
        # dispatch, which can name any branch. test-resolve-macos-runs-on
        # evaluates this condition for every event and ref.
        if: >-
          vars.BURIN_CI_MACOS_SPILL != '' && (
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
            || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main')
            || (github.event_name == 'schedule' && github.ref == 'refs/heads/main'))
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-organization-self-hosted-runners: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - id: resolve
        env:
          BURIN_RUNNER_CAPACITY: ${{ needs.runner-availability.outputs.capacity }}
          BURIN_CI_MACOS_SPILL: ${{ vars.BURIN_CI_MACOS_SPILL }}
          BURIN_MACOS_ROUTE_PROBE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.macos_route || '' }}
          BURIN_SPILL_TOKEN: ${{ steps.spill-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings scripts/lib/macos-runner-routing.ts

  # The same org-owned detector, read again once a job's own prerequisites are
  # done. An idle-runner count is a fact about one instant, and most Linux
  # jobs here do not start at the instant `runner-availability` measured: they
  # wait for `harn-prewarm` (about 14 minutes) and the review replay also waits
  # for the harn-linked build (about 27). On run 36253942270 the probe read the
  # pool at 16:01Z and the review replay routed to a paid hosted runner at
  # 16:28Z on that reading, while 4 of 5 tornadough runners sat idle.
  #
  # Each re-read `needs` exactly the job whose completion releases its readers,
  # so it runs when they can run and is skipped when they are. A job reads the
  # latest re-read its own `needs` already wait for;
  # `check_runner_availability_freshness` refuses an older one. The re-reads are
  # in `ci-status` needs because a failed probe leaves its readers `skipped`,
  # and `skipped` alone would read as a pass.
  #
  # `linux_runner_tag` names the rung the Rust TUI lanes request, so the count
  # measures the set they would queue on. It is the detector's default today;
  # the capacity contract holds the two together.
  late-runner-availability:
    needs: [harn-prewarm]
    uses: burin-labs/.github/.github/workflows/runner-availability.yml@472ebb6b0f058d3b57c1c83a715c3621d01e761c
    with:
      minimum_online: 3
      minimum_online_by_pool: '{"macos":2,"linux_probe":1}'
      linux_runner_tag: harn-ci-stable
      linux_probe_runner_tag: harn-ci-big-a
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # The linked re-read runs even when the harn-linked build is skipped, which it
  # is on every pull request. The inherited-red gate reports a skipped job main
  # has never run as unmeasured, so a new probe skipped on its own pull request
  # could never land (#9489). A skipped build releases the reading at once, and
  # a pull request has no reader for it; the cost is one probe per run.
  linked-runner-availability:
    needs: [rust-tui-harn-linked]
    if: ${{ !cancelled() }}
    uses: burin-labs/.github/.github/workflows/runner-availability.yml@472ebb6b0f058d3b57c1c83a715c3621d01e761c
    with:
      minimum_online: 3
      minimum_online_by_pool: '{"macos":2}'
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Detect which areas of the codebase changed so downstream jobs can skip.
  #
  # SAFETY PRINCIPLE — prune for PR fast feedback, run comprehensive on the
  # speculative merge commit (#1461). Coarse path-filtering is sound for
  # `pull_request` events (the surfaces are independent build/test graphs and
  # skipping untouched ones saves the expensive macOS 10x + self-hosted Harn-
  # pool minutes). Merge queues and unproven main pushes run every surface so
  # merged commits cannot hide deterministic failures behind a path filter;
  # the heavy tier runs only there (bc#9277).
  # Do not wire downstream `if:`s back to
  # the raw `steps.filter.outputs.*`.
  changes:
    name: Detect changes
    # Not ubuntu-slim: the Rust impact plan runs `cargo metadata`, and slim has
    # no Rust toolchain (bc#9618, PR run 36315481669's `spawnSync cargo ENOENT`).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      # Machine-readable inventory of the boolean path surfaces below. The
      # force resolver and CI status gate consume this same list, and the gate
      # fails closed when any inventoried surface lacks a result contract.
      path_surfaces: ${{ steps.force.outputs.path_surfaces }}
      swift: ${{ steps.force.outputs.swift }}
      swift-macos: ${{ steps.force.outputs.swift-macos }}
      # Narrow PR-time BurinApp/tree-sitter link compile (#5303). Distinct from
      # the broad `swift-macos` surface, which still gates the full (expensive)
      # macOS Swift suite on merge_group/push only.
      swift-burinapp: ${{ steps.force.outputs.swift-burinapp }}
      # Test-only BurinApp changes need a PR-time macOS execution path; Linux
      # excludes this target and the full macOS suite is post-merge-only.
      swift-burinapp-tests: ${{ steps.force.outputs.swift-burinapp-tests }}
      # The code the subprocess integration lane actually reads (#5736). Narrow
      # enough that paying for a hosted Mac on it is affordable; see the
      # `swift-integration` job for the arithmetic.
      swift-subprocess: ${{ steps.force.outputs.swift-subprocess }}
      # One selection decision feeds each macOS phase and its required result.
      #
      # A pull request that touches Darwin-capable Swift runs the full suite
      # (#8850). It used to run only after the merge, so a macOS-only Swift
      # regression was first seen on the default branch, where it reddens every
      # later pull request
      # through the inherited-failure gate until someone fixes it forward and
      # an admin merges the fix past a gate that cannot clear. That is how the
      # watcher regression in #8811 was found, and #8860 fixed a Swift test
      # while its own pull request never executed the suite.
      #
      # This is the expensive arm. The checked platform registry selects it
      # for native and shared Swift paths, while Linux owns portable paths.
      swift_full_selected: >-
        ${{ (steps.platform.outputs.swift_macos == 'true' &&
          (github.event_name == 'merge_group' || github.event_name == 'push' ||
          github.event_name == 'pull_request')) ||
          (github.event_name == 'pull_request' && steps.filter.outputs.harn_pin == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.run_all) }}
      swift_app_selected: >-
        ${{ (steps.force.outputs.swift-burinapp == 'true' &&
          (github.event_name == 'pull_request' || github.event_name == 'push')) ||
          (github.event_name == 'workflow_dispatch' && inputs.run_all) }}
      swift_app_tests_selected: >-
        ${{ (steps.force.outputs.swift-burinapp-tests == 'true' &&
          (github.event_name == 'pull_request' || github.event_name == 'push')) ||
          (github.event_name == 'workflow_dispatch' && inputs.run_all) }}
      swift_integration_selected: >-
        ${{ (github.event_name == 'pull_request' && steps.filter.outputs.harn_pin == 'true') ||
          (steps.force.outputs.swift-subprocess == 'true' && github.event_name != 'pull_request') ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_all) }}
      harn: ${{ steps.force.outputs.harn }}
      # Repository state, not a changed-path signal. The exact runtime cache
      # primer needs a runner without the Blacksmith job-lifetime ceiling for
      # as long as an integration revision exists in the checked-out tree.
      harn_pin: ${{ steps.filter.outputs.harn_pin }}
      harn_source_revision: ${{ steps.force.outputs.harn_source_revision }}
      harn_env_namespace: ${{ steps.force.outputs.harn_env_namespace }}
      harn_pipeline_tests: ${{ steps.force.outputs.harn_pipeline_tests }}
      harn_pipeline_affected_from: ${{ steps.force.outputs.harn_pipeline_affected_from }}
      ts: ${{ steps.force.outputs.ts }}
      scripts_ts: ${{ steps.force.outputs.scripts_ts }}
      server: ${{ steps.force.outputs.server }}
      site: ${{ steps.force.outputs.site }}
      rust-tui: ${{ steps.force.outputs.rust-tui }}
      rust_tui_supply_chain: ${{ steps.force.outputs.rust_tui_supply_chain }}
      rust_tui_impact_mode: ${{ steps.rust-impact.outputs.mode }}
      rust_tui_impact_packages: ${{ steps.rust-impact.outputs.packages }}
      reuse_rust_proof: ${{ steps.rust-proof.outputs.reuse }}
      # Job eligibility derived from the Rust impact plan has one owner here.
      # Jobs and CI status consume these booleans instead of rebuilding the
      # same condition independently.
      # A proven push still runs the fast lane when the Rust supply chain moved:
      # its cache saves only on main, and pull requests restore from there.
      rust_tui_fast_selected: >-
        ${{ (github.event_name == 'push' && (steps.proven.outputs.proven != 'true'
          || steps.filter.outputs.rust_tui_supply_chain == 'true'))
          || (steps.rust-proof.outputs.reuse != 'true'
          && steps.force.outputs.rust-tui == 'true') }}
      rust_tui_macos_selected: >-
        ${{ (steps.platform.outputs.rust_tui_macos == 'true'
          && (github.event_name == 'merge_group' || github.event_name == 'push'))
          || (steps.platform.outputs.rust_tui_pr_proof == 'true'
          && github.event_name == 'pull_request')
          || (github.event_name == 'workflow_dispatch' && inputs.run_all) }}
      # Also selected whenever the calibration replay runs. That job consumes
      # this job's `burin-linux` artifact instead of building its own binary,
      # so this job is the sole producer of the reviewer under review and has
      # to be selected wherever the replay is. Deriving it here rather than in
      # the job's own `if:` keeps the CI status projection agreeing with what
      # actually runs.
      # Heavy tier (bc#9277): prove affected TUI pull requests and merge
      # groups before any merge path, including an administrator merge.
      # A proven main push reuses that proof.
      rust_tui_harn_linked_selected: >-
        ${{ (github.event_name == 'pull_request' && steps.filter.outputs.harn_pin == 'true') ||
          (steps.force.outputs.heavy == 'true'
          && (github.event_name == 'push'
          || (steps.force.outputs.rust-tui == 'true'
          && steps.rust-proof.outputs.reuse != 'true'
          && (steps.rust-impact.outputs.mode == 'full'
          || contains(fromJSON(steps.rust-impact.outputs.packages), 'burin-tui-engine')
          || contains(fromJSON(steps.rust-impact.outputs.packages), 'burin-tui-app')
          || contains(fromJSON(steps.rust-impact.outputs.packages), 'burin-tui-headless')))
          || steps.force.outputs.review_calibration == 'true')) }}
      cli: ${{ steps.force.outputs.cli }}
      cli_platform: ${{ steps.force.outputs.cli_platform }}
      cli_platform_macos_selected: >-
        ${{ (steps.force.outputs.cli_platform == 'true'
          && (github.event_name == 'merge_group' || github.event_name == 'push'
          || github.event_name == 'schedule'))
          || (github.event_name == 'workflow_dispatch' && inputs.run_all) }}
      cli_platform_windows_selected: >-
        ${{ (steps.force.outputs.cli_platform == 'true'
          && (github.event_name == 'merge_group' || github.event_name == 'push'
          || github.event_name == 'schedule'))
          || (github.event_name == 'workflow_dispatch' && inputs.run_all) }}
      editor_extension: ${{ steps.force.outputs.editor_extension }}
      eval: ${{ steps.force.outputs.eval }}
      eval_scripts: ${{ steps.force.outputs.eval_scripts }}
      # The reviewer and its calibration corpus. Only this surface runs the
      # corpus replay, which is the one thing that exercises the real reviewer
      # over labelled heads rather than the library that scores it.
      review_calibration: ${{ steps.force.outputs.review_calibration }}
      # Preserve the path filter's direct signal separately from comprehensive
      # CI forcing. The trial-resume runtime planner needs to distinguish a real
      # eval-source edit from a workflow-only request to exercise every gate.
      eval_scripts_direct: ${{ steps.filter.outputs.eval_scripts }}
      eval_catalog: ${{ steps.force.outputs.eval_catalog }}
      # What the golden replay reads or runs (bc#9505). It also selects the
      # replay, so a change the replay exercises outside the catalog reaches
      # it, and the replay workflow runs its macOS cells on a merge group only
      # when this is true.
      golden_replay: ${{ steps.force.outputs.golden_replay }}
      eval_golden_selftest_selected: >-
        ${{ ((steps.force.outputs.eval_catalog == 'true'
          || steps.force.outputs.golden_replay == 'true')
          && github.event_name != 'pull_request')
          || (github.event_name == 'workflow_dispatch' && inputs.run_all) }}
      document_artifacts: ${{ steps.force.outputs.document_artifacts }}
      experiment_engine: ${{ steps.force.outputs.experiment_engine }}
      bench: ${{ steps.force.outputs.bench }}
      docs: ${{ steps.force.outputs.docs }}
      # False only on a push to main that its merge_group run already proved
      # (`proven`); argued where it is set.
      heavy: ${{ steps.force.outputs.heavy }}
      proven: ${{ steps.proven.outputs.proven }}
      # The heavy tier (bc#9277), one named decision per job family. The
      # Harn-linked and sandbox Rust proofs also run on affected TUI pull
      # requests, so an administrator merge has exact-head evidence. The
      # other costly suites still run on merge groups and main pushes. The
      # inherited-red gate reads each selection decision separately.
      harn_pipeline_heavy_selected: >-
        ${{ github.event_name != 'pull_request' && steps.force.outputs.heavy == 'true'
          && steps.force.outputs.harn_pipeline_tests == 'true' }}
      harn_suites_heavy_selected: >-
        ${{ github.event_name != 'pull_request' && steps.force.outputs.heavy == 'true'
          && steps.force.outputs.harn == 'true' }}
      swift_linux_selected: >-
        ${{ github.event_name != 'pull_request' && steps.force.outputs.heavy == 'true'
          && steps.force.outputs.swift == 'true' }}
      bench_selected: >-
        ${{ github.event_name != 'pull_request' && steps.force.outputs.heavy == 'true'
          && steps.force.outputs.bench == 'true' }}
      eval_catalog_shards_selected: >-
        ${{ github.event_name != 'pull_request' && steps.force.outputs.heavy == 'true'
          && steps.force.outputs.eval_catalog == 'true' }}
      document_artifacts_selected: >-
        ${{ github.event_name != 'pull_request' && steps.force.outputs.heavy == 'true'
          && steps.force.outputs.document_artifacts == 'true' }}
      eval_script_tests_selected: >-
        ${{ (github.event_name == 'pull_request' && steps.filter.outputs.harn_pin == 'true') ||
          (github.event_name != 'pull_request' && steps.force.outputs.heavy == 'true'
          && steps.force.outputs.eval_scripts == 'true') }}
      review_calibration_selected: >-
        ${{ github.event_name != 'pull_request' && steps.force.outputs.heavy == 'true'
          && steps.force.outputs.review_calibration == 'true' }}
      # The expensive post-review checks run on the merge tree and an unproven
      # main push, and also on a pull request whose diff touches what they
      # judge (bc#9444). Queue-only, a violation a pull request introduced
      # surfaced about 44 minutes into a queue run and failed every group built
      # behind it: 20 of 36 failed merge-group runs on 2026-09-25/26. One output
      # per check; its job and CI status both read it. A manual dispatch runs
      # them all under run_all and honours the filter otherwise, like every
      # other surface. The capacity contract's PATH_SCOPED_JOBS owns the table.
      repository_policies_selected: >-
        ${{ github.event_name == 'merge_group'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.force.outputs.heavy == 'true')
          || (github.event_name == 'workflow_dispatch' && (steps.force.outputs.heavy == 'true' || steps.filter.outputs.repository_policies == 'true'))
          || (github.event_name == 'pull_request' && steps.filter.outputs.repository_policies == 'true') }}
      harn_lint_selected: >-
        ${{ github.event_name == 'merge_group'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.force.outputs.heavy == 'true')
          || (github.event_name == 'workflow_dispatch' && (steps.force.outputs.heavy == 'true' || steps.filter.outputs.harn == 'true'))
          || (github.event_name == 'pull_request' && steps.filter.outputs.harn == 'true') }}
      harn_check_scripts_selected: >-
        ${{ github.event_name == 'merge_group'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.force.outputs.heavy == 'true')
          || (github.event_name == 'workflow_dispatch' && (steps.force.outputs.heavy == 'true' || steps.filter.outputs.harn == 'true'))
          || (github.event_name == 'pull_request' && steps.filter.outputs.harn == 'true') }}
      experiment_engine_test_selected: >-
        ${{ github.event_name == 'merge_group'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.force.outputs.heavy == 'true')
          || (github.event_name == 'workflow_dispatch' && (steps.force.outputs.heavy == 'true' || steps.filter.outputs.experiment_engine == 'true'))
          || (github.event_name == 'pull_request' && steps.filter.outputs.experiment_engine == 'true') }}
      workflow_audit_selected: >-
        ${{ github.event_name == 'merge_group'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.force.outputs.heavy == 'true')
          || (github.event_name == 'workflow_dispatch' && (steps.force.outputs.heavy == 'true' || steps.filter.outputs.workflow_audit == 'true'))
          || (github.event_name == 'pull_request' && steps.filter.outputs.workflow_audit == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # paths-filter on push must resolve the pre-push SHA. With
          # persist-credentials: false it cannot `git fetch` that SHA, so the
          # checkout itself must already contain enough history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Check platform file census
        run: node --experimental-strip-types --no-warnings scripts/check-platform-surface.ts
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # The checkout above already contains full history. Force the
          # action's documented local-git path even for pull requests so CI
          # does not depend on GitHub materializing the PR-files diff. That API
          # can return `diff/not_available` under load and used to stop every
          # repository gate before it started (#6552).
          token: ''
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          list-files: json
          filters: .github/ci-path-filters.yml
      - name: Validate merge-group path diff
        id: merge-group-diff
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_FILTER_OUTPUTS_JSON: ${{ toJSON(steps.filter.outputs) }}
        run: node --experimental-strip-types --no-warnings scripts/ci/merge-group-diff-state.ts "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Plan affected Rust TUI packages
        id: rust-impact
        uses: burin-labs/.github/.github/actions/rust-test-impact@06089f56c92e45ae22d9243bd7b81e6fb527b7ea
        with:
          event-name: ${{ github.event_name }}
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          workspace: crates/burin-tui
          # `global-paths` is a block scalar: every line is a path prefix, so a
          # `#` line here would be read as a path, not a comment.
          #
          # `Sources/BurinCore/Resources/pipelines` is here because the
          # harn-linked suites execute the bundled pipelines from that tree
          # (BURIN_PIPELINE_DIR points at it), so a pipelines-only change can
          # flip what they assert. The `rust-tui` paths-filter has listed the
          # tree since #6986, but the planner mapped it to no Cargo package, so
          # the gate resolved `mode: empty` and rust-tui-harn-linked skipped
          # anyway: #7363 landed a deterministic red that main could not see for
          # six commits (#7389). `test_rust_impact_planner_covers_every_gating_
          # filter_glob` now fails on any such filter glob the planner drops.
          #
          # The block below `scripts/tui-cargo.sh` is the same list the
          # trial-resume build identity derives from the source: cargo
          # configuration plus every `include_str!`/`include_bytes!` target that
          # lives outside `crates/burin-tui`. The compiler reads them, so a
          # change to one produces a different `burin` binary and the
          # harn-linked job is the only lane that proves it. Leaving them out
          # here is the #7389 hole again: the `rust-tui` filter would read true,
          # the planner would resolve `mode: empty`, and no new `burin-linux`
          # artifact would exist for the trial-resume canary to reuse.
          global-paths: |
            .harn-version
            .harn-revision
            Sources/BurinCore/Resources/pipelines
            Sources/BurinCore/Resources/provider-catalog
            Sources/BurinCore/Resources/lsp-servers.json
            .github/actions/fetch-harn
            .github/actions/harn-public-git
            .github/actions/clear-harn-git-config
            .github/actions/setup-rustup
            scripts/ci-resource-limits.sh
            scripts/ci-rustc-wrapper.sh
            scripts/verify-public-harn-fetch.harn
            scripts/tui-cargo.sh
            .cargo
            VERSION
            harn.toml
            fixtures/session-timeline-golden.json
            spec/config-schema.json
            spec/cross-surface-feature-matrix.json
            spec/path-segment-vectors.json
            spec/placement-economics-fixture.json
            spec/review-artifact-paths.json
            spec/settings-sync-redaction-vectors.json
            test-fixtures/transcript-compacted-receipt.canonical.json
            Sources/BurinCore/Resources/pipeline-tests/fixtures/tool-batch-dispositions.json
            Sources/BurinCore/Resources/burin-artifact-catalog.json
            Sources/BurinCore/Resources/feature-flag-cache-policy.fixture.json
            Sources/BurinCore/Resources/harn-static-check-capabilities.json
            Sources/BurinCore/Resources/provider-catalog
            Tests/BurinCoreTests/Fixtures/DashboardTriage/value-model-feed.json
            Tests/BurinCoreTests/Fixtures/external-action-policy-cases.json
            Tests/Fixtures/harn-run-view-v1-root-transcript.json
          extra-package-paths: |
            burin-tui-app=spec/cross-surface-acceptance.json
            burin-tui-headless=docs/headless-cli-reference.md
      - name: Resolve exact-tree Rust proof reuse
        id: rust-proof
        uses: burin-labs/.github/.github/actions/exact-tree-ci-proof@98696dbb4d8892aada57d0621948b73ca1492d7e
        with:
          workflow-file: ci.yml
          required-jobs: >-
            ["Rust TUI fast fmt + clippy","Rust TUI fast test","Rust TUI harn-linked clippy, test & build","Rust TUI Linux sandbox proof"]
          cache-refresh-required: ${{ steps.filter.outputs.rust_cache_contract }}
          merge-group-writes-cache: "true"
          event-name: ${{ github.event_name }}
          commit-sha: ${{ github.sha }}
          event-path: ${{ github.event_path }}
          github-token: ${{ github.token }}
      # A push to main that the merge queue already tested (bc#9277). The queue
      # pushes the very commit its merge_group run tested, so a successful run
      # of this workflow on that sha is the full verdict for it. Unreadable or
      # absent reads `false`, and the push runs everything as before.
      - name: Find the merge-queue run that proved this commit
        id: proven
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/merge-queue-proof.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Resolve surface outputs (force comprehensive off the PR path)
        id: force
        # Decide whether to honour the paths filter or force every surface on.
        #
        # `pull_request`: honour the filter for ordinary code changes — per-PR
        #   fast feedback prunes untouched surfaces. Core CI wiring changes are
        #   the exception: they can alter any job's filter, runner, cache, or
        #   command, so they force every surface on in PR CI.
        # `merge_group`: use the batch's base-to-head diff with the same path
        #   registry as pull requests. An empty diff forces all surfaces on;
        #   the validation step fails if either commit is missing or invalid.
        # `schedule`: force all surfaces on as the daily cross-surface backstop.
        # `push`: force the existing broad surface outputs on each merged commit.
        #   The separate platform projection can still skip a Mac when its
        #   changed paths need only Linux, or when the merge queue proved the tree.
        # `workflow_dispatch`: force all surfaces on only when `run_all` is set
        #   (its default), preserving the selective-dispatch path where a
        #   maintainer unticks `run_all` to honour the filter.
        env:
          RUN_ALL: ${{ inputs.run_all }}
          MERGE_GROUP_FORCE_ALL: ${{ steps.merge-group-diff.outputs.force_all }}
          PROVEN: ${{ steps.proven.outputs.proven }}
          F_CI_CONFIG: ${{ steps.filter.outputs.ci_config }}
          # package.json is shared wiring only when an existing entry or a
          # non-script field changes; an added script entry forces nothing
          # (bc#9228). The classifier fails closed to `wiring`.
          F_PACKAGE_MANIFEST: ${{ steps.filter.outputs.package_manifest }}
          PACKAGE_MANIFEST_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          F_SWIFT: ${{ steps.filter.outputs.swift }}
          F_SWIFT_MACOS: ${{ steps.filter.outputs.swift-macos }}
          F_SWIFT_BURINAPP: ${{ steps.filter.outputs.swift-burinapp }}
          F_SWIFT_BURINAPP_TESTS: ${{ steps.filter.outputs.swift-burinapp-tests }}
          F_SWIFT_SUBPROCESS: ${{ steps.filter.outputs.swift-subprocess }}
          F_HARN: ${{ steps.filter.outputs.harn }}
          F_HARN_ENV_NAMESPACE: ${{ steps.filter.outputs.harn_env_namespace }}
          F_HARN_PIPELINE_TESTS: ${{ steps.filter.outputs.harn_pipeline_tests }}
          BURIN_HARN_PIPELINE_AFFECTED_FROM: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          F_TS: ${{ steps.filter.outputs.ts }}
          F_SCRIPTS_TS: ${{ steps.filter.outputs.scripts_ts }}
          F_SERVER: ${{ steps.filter.outputs.server }}
          F_SITE: ${{ steps.filter.outputs.site }}
          F_RUST_TUI: ${{ steps.filter.outputs.rust-tui }}
          F_RUST_TUI_SUPPLY_CHAIN: ${{ steps.filter.outputs.rust_tui_supply_chain }}
          F_CLI: ${{ steps.filter.outputs.cli }}
          F_CLI_PLATFORM: ${{ steps.filter.outputs.cli_platform }}
          F_EDITOR_EXTENSION: ${{ steps.filter.outputs.editor_extension }}
          F_EVAL: ${{ steps.filter.outputs.eval }}
          F_EVAL_SCRIPTS: ${{ steps.filter.outputs.eval_scripts }}
          F_REVIEW_CALIBRATION: ${{ steps.filter.outputs.review_calibration }}
          F_EVAL_CATALOG: ${{ steps.filter.outputs.eval_catalog }}
          F_GOLDEN_REPLAY: ${{ steps.filter.outputs.golden_replay }}
          F_DOCUMENT_ARTIFACTS: ${{ steps.filter.outputs.document_artifacts }}
          F_EXPERIMENT_ENGINE: ${{ steps.filter.outputs.experiment_engine }}
          F_BENCH: ${{ steps.filter.outputs.bench }}
          F_DOCS: ${{ steps.filter.outputs.docs }}
          PATH_SURFACES: >-
            swift swift-macos swift-burinapp swift-burinapp-tests
            swift-subprocess harn harn_env_namespace harn_pipeline_tests ts
            scripts_ts server site rust-tui rust_tui_supply_chain cli
            cli_platform editor_extension eval eval_scripts eval_catalog
            golden_replay document_artifacts experiment_engine bench docs
            review_calibration
          # Surfaces whose jobs run only on macOS and never touch package.json:
          # the `swift` job's app, app-test and subprocess phases and the darwin
          # golden-replay lane. A package wiring change keeps their path-filter
          # value instead of forcing them; CI wiring still forces them.
          # test-select-platform-jobs.ts holds each job to that by census.
          PACKAGE_INSENSITIVE_SURFACES: swift-burinapp swift-burinapp-tests swift-subprocess golden_replay
          # Surfaces CI wiring does not force either; only their own path
          # filter or an unreadable merge diff selects them. `golden_replay`
          # turns on the darwin golden lane, whose filter lists the replay's
          # workflow and the local actions it runs. CI wiring forced that lane
          # in 7 of the 21 merge groups that ran it on 2026-09-30..10-02,
          # against 3 for files the replay reads. Main pushes and the daily
          # schedule still replay every darwin cell (bc#9837, as bc#9524).
          CI_WIRING_INSENSITIVE_SURFACES: golden_replay
        run: |
          set -euo pipefail
          FORCE_ALL=false
          case "$GITHUB_EVENT_NAME" in
            push|schedule) FORCE_ALL=true ;;
            merge_group) FORCE_ALL="${MERGE_GROUP_FORCE_ALL:-true}" ;;
            workflow_dispatch) FORCE_ALL="${RUN_ALL:-false}" ;;
          esac
          echo "path_surfaces=${PATH_SURFACES}" >> "$GITHUB_OUTPUT"
          if [ "${PROVEN:-}" = "true" ]; then
            echo "::notice::changes: push already proven by its merge_group run, every surface off"
            {
              for surface in ${PATH_SURFACES}; do
                echo "${surface}=false"
              done
              echo "harn_source_revision=$([ -s .harn-revision ] && echo true || echo false)"
              echo "harn_pipeline_affected_from=${BURIN_HARN_PIPELINE_AFFECTED_FROM}"
              echo "heavy=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MANIFEST_WIRING=false
          if [ "${F_PACKAGE_MANIFEST}" = "true" ]; then
            manifest_change=wiring
            if [ -n "${PACKAGE_MANIFEST_BASE}" ] \
              && git show "${PACKAGE_MANIFEST_BASE}:package.json" > "${RUNNER_TEMP}/base-package.json" 2>/dev/null; then
              manifest_change="$(scripts/ci/package-manifest-change.sh "${RUNNER_TEMP}/base-package.json" package.json || echo wiring)"
            fi
            echo "::notice::changes: package.json change classified ${manifest_change}"
            if [ "${manifest_change}" != "additive" ]; then
              MANIFEST_WIRING=true
            fi
          fi
          echo "manifest_wiring=${MANIFEST_WIRING}" >> "$GITHUB_OUTPUT"
          if [ "${FORCE_ALL}" = "true" ] || [ "${F_CI_CONFIG}" = "true" ] || [ "${MANIFEST_WIRING}" = "true" ]; then
            if [ "${FORCE_ALL}" = "true" ]; then
              echo "::notice::changes: ${GITHUB_EVENT_NAME} — forcing all surfaces true (comprehensive run against the merge/merged commit)"
            elif [ "${F_CI_CONFIG}" != "true" ]; then
              echo "::notice::changes: package.json wiring changed — forcing all surfaces true so every gate that runs a package script is validated"
            else
              echo "::notice::changes: CI config changed — forcing all surfaces true so CI wiring changes validate every gate"
            fi
            for surface in ${PATH_SURFACES}; do
              value=true
              if [ "${FORCE_ALL}" != "true" ] \
                && { [[ " ${CI_WIRING_INSENSITIVE_SURFACES:-} " == *" ${surface} "* ]] \
                  || { [ "${F_CI_CONFIG}" != "true" ] \
                    && [[ " ${PACKAGE_INSENSITIVE_SURFACES} " == *" ${surface} "* ]]; }; }; then
                filter_name="F_${surface//-/_}"
                filter_name="${filter_name^^}"
                value="${!filter_name}"
              fi
              echo "${surface}=${value}" >> "$GITHUB_OUTPUT"
            done
          else
            echo "::notice::changes: ${GITHUB_EVENT_NAME} — surfaces pruned by paths filter for fast feedback"
            for surface in ${PATH_SURFACES}; do
              filter_name="F_${surface//-/_}"
              filter_name="${filter_name^^}"
              echo "${surface}=${!filter_name}" >> "$GITHUB_OUTPUT"
            done
          fi

          if [ -s .harn-revision ]; then
            echo "harn_source_revision=true" >> "$GITHUB_OUTPUT"
          else
            echo "harn_source_revision=false" >> "$GITHUB_OUTPUT"
          fi

          # The planning job asks Harn for its typed affected-test decision.
          # This job owns only the event's exact base ref; it never guesses
          # whether Harn can safely narrow the suite.
          echo "harn_pipeline_affected_from=${BURIN_HARN_PIPELINE_AFFECTED_FROM}" >> "$GITHUB_OUTPUT"

          # Heavy-tier eligibility (bc#9277). `heavy` is true here; the proven
          # push above is the only place it is false. The shared selected
          # decision runs the Harn-linked and sandbox proofs on affected TUI
          # pull requests and merge groups. CI status requires their result on
          # both paths. This also catches an administrator merge that bypasses
          # the queue: the exact PR head was already tested.
          echo "heavy=true" >> "$GITHUB_OUTPUT"
      - name: Project platform coverage from changed paths
        id: platform
        env:
          CI_SOURCES_FILTER: ${{ steps.filter.outputs.platform_sources }}
          CI_SOURCES_FILES_JSON: ${{ steps.filter.outputs.platform_sources_files }}
          CI_SWIFT_FILTER: ${{ steps.filter.outputs.swift-macos }}
          CI_SWIFT_FILES_JSON: ${{ steps.filter.outputs.swift-macos_files }}
          CI_RUST_FILTER: ${{ steps.filter.outputs.rust-tui }}
          CI_RUST_FILES_JSON: ${{ steps.filter.outputs.rust-tui_files }}
          CI_PROVEN: ${{ steps.proven.outputs.proven || 'false' }}
          # Registry facts decide source paths. CI wiring, an unreadable merge
          # diff, the daily full run, and explicit run-all still exercise both
          # Macs. Package wiring does not: no macOS-bound job installs packages
          # or runs a package script, and test-select-platform-jobs.ts refuses
          # one that starts to. It forced the Macs on most queue runs that
          # selected them (bc#9837).
          CI_PLATFORM_FORCE: >-
            ${{ steps.filter.outputs.ci_config == 'true'
              || (github.event_name == 'merge_group' && steps.merge-group-diff.outputs.force_all == 'true')
              || github.event_name == 'schedule'
              || (github.event_name == 'workflow_dispatch' && inputs.run_all) }}
        run: node --experimental-strip-types --no-warnings scripts/ci/select-platform-jobs.ts
  # The single cold-cache owner for the Harn runtime, and NOTHING else.
  #
  # This used to be the first third of the `actions` hygiene job, and the fusion
  # cost every dependent job the hygiene job's whole duration. `actions/cache`
  # publishes in a POST step, which runs only when the job ends, so the runtime
  # bundle was not visible to the fan-out until the ~15 lint steps after it had
  # also finished. Measured on run 31917320348 (the v0.10.100 repin): `Fetch
  # Harn runtime` completed 7.2 minutes into the job, the job ended at 14.3, and
  # 60 dependent jobs started at 15.0 — so 7 minutes of that wait bought
  # nothing. p50 across twelve heavy PR runs was the same shape: barrier
  # finishes 8.6 min, and every gated job's clock starts there.
  #
  # Splitting keeps the invariant the fusion was protecting — one cold owner,
  # whose post-job save completes before the fan-out, so sixteen jobs never
  # race the same release download through one runner NAT — while paying only
  # the fetch for it. Hygiene now runs BESIDE the fan-out instead of in front
  # of it; nothing downstream consumes a lint result, only `CI status` does.
  harn-prewarm:
    needs: [changes, runner-availability]
    name: Prime Harn runtime cache
    outputs:
      bytecode_handoff_name: ${{ steps.bytecode-handoff-route.outputs.name }}
      # What this job actually did, not merely that it ended. Consumers can read
      # this instead of inferring a warm cache from a green upstream job.
      primed: ${{ steps.primed.outputs.primed }}
    # A cold exact-revision cargo install exhausts the hosted runner lease before
    # the full CLI links. Queue that temporary integration state on the fleet's
    # explicit big-build lane when the fleet is enabled. Do not use idle count: a busy
    # fleet is a reason to queue, not to start an exact-source build on a hosted
    # runner that will be killed before it can publish the runtime cache.
    # Released pins take the paid 4-vCPU rung. An exact source build on a main
    # push takes the eligible big-build queue first. With the fleet disabled,
    # its source fallback takes eight cores instead of the ordinary hosted rung.
    # The existing paid-provider rung stays at its declared size.
    runs-on: >-
      ${{ (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX == 'true'
        && needs.changes.outputs.harn_source_revision != 'false'
        && !(vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request')
        && 'ubuntu-8core')
        || (github.event_name == 'push' && github.ref == 'refs/heads/main'
        && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true'
        && needs.changes.outputs.harn_source_revision != 'false'
        && fromJSON(needs.runner-availability.outputs.capacity).linux_big.eligible
        && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-big"]'))
        || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    # The fleet exception is keyed from checked-out repository state. A normal
    # release pin remains off the shared fleet; a cold .harn-revision queues and
    # primes the exact Linux runtime cache once, and ordinary consumers then
    # restore it in seconds. Cold source builds on self-hosted runners routinely
    # exceed 45 minutes before the cache is warm, so keep the job above the
    # Fetch Harn step budget.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before anything that shells out to node. The fetch action's bundle
      # projection runs node, and a Blacksmith image can ship a node too old for
      # `--experimental-strip-types`, which this repository needs everywhere
      # because it runs TypeScript with no build step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Resolve exact Harn bytecode handoff route
        id: bytecode-handoff-route
        run: printf 'name=%s\n' "${BURIN_HARN_BYTECODE_HANDOFF_NAME}" >> "${GITHUB_OUTPUT}"
      # A source pin can require stdlib APIs newer than the published version.
      - name: Isolate public Harn runtime fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      # This step must stay ungated by event. This job is the cold owner of the
      # Harn runtime cache and pull requests are its principal consumer, so
      # gating the fetch to main-push does not save the work, it moves it into
      # every downstream job at once. Those consumers restore this cache under
      # their own short fuses: `harn-env-namespace` allows ten minutes, and a
      # cold fetch costs nine to eleven, so a skipped prewarm turns a 0.6-minute
      # restore into a guaranteed timeout ten jobs away from the cause. Paying
      # the cold cost once here, under this job's ninety-minute budget, is the
      # whole point of the job.
      - name: Fetch Harn runtime
        id: fetch-runtime
        # Source pins via `.harn-revision` cold-build the CLI; binary tags finish in minutes.
        timeout-minutes: 90
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          consume-bytecode-handoff: "false"
          # This prerequisite owns one bytecode preparation before the
          # Harn/Swift fan-out on the normal released-runtime path. Keep exact
          # source revisions runtime-only here: their cold build can already
          # consume this step's budget, and each compiled module remains
          # content-addressed when dependent jobs restore the fallback cache.
          precompile: ${{ hashFiles('.harn-revision') == '' && 'true' || 'false' }}
          # The code review job compiles fewer source roots than this one, so
          # its cache key differs and would have no publisher at all: every
          # review would recompile, forever, and asking for less would buy
          # nothing. Publishing the same tree under that key here costs one
          # upload of work this job has already done.
          also-publish-roots: pipelines,scripts-lib
      - name: Clear public Harn git isolation
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/clear-harn-git-config
      - name: Pack exact Harn bytecode handoff
        if: hashFiles('.harn-revision') == ''
        run: >-
          ./scripts/ci/harn-bytecode-handoff.sh create
          "${RUNNER_TEMP}/burin-harn-bytecode-handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Publish exact Harn bytecode handoff
        if: hashFiles('.harn-revision') == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bytecode-handoff-route.outputs.name }}
          path: ${{ runner.temp }}/burin-harn-bytecode-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      # Absence must not read as success. Every step above can be turned off by
      # a condition, and a job that skipped its only real work still finishes
      # green in seconds. That happened: a change gated the fetch to main
      # pushes, this job reported success in nine seconds having primed
      # nothing, and because consumers restore this cache under fuses sized for
      # a warm hit, the first symptom was a ten-minute timeout in a different
      # job ten steps away. Nothing downstream could tell an unprimed cache
      # from a warm one.
      #
      # So state the outcome instead of implying it. `primed` says what
      # happened, and this step refuses rather than let a green mean nothing.
      # It runs on `always()` so a skipped fetch is still reported; when the
      # fetch failed outright the job is already red and this only names why.
      - name: Refuse a cache warm-up that cached nothing
        id: primed
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch-runtime.outcome }}
        run: |
          set -euo pipefail
          if [ "${FETCH_OUTCOME}" = "success" ]; then
            printf 'primed=true\n' >> "${GITHUB_OUTPUT}"
            echo "harn-prewarm primed the Harn runtime cache."
            exit 0
          fi
          printf 'primed=false\n' >> "${GITHUB_OUTPUT}"
          echo "::error::harn-prewarm primed nothing: 'Fetch Harn runtime' reported '${FETCH_OUTCOME}'. This job owns the Harn runtime cache and its consumers restore that cache under timeouts sized for a warm hit, so an unprimed cache does not fail here, it times out in a distant job. Refusing at the cause instead." >&2
          exit 1
  actions:
    needs: [changes, runner-availability, harn-prewarm]
    name: CI configuration checks
    # Runs on pull requests, with no path filter. Every refusal this job owns
    # is a policy gate, and a policy gate that runs only after the merge cannot
    # block anything: its one available action is to turn main red, and on a
    # pull request it is indistinguishable from a check that passed. #8733
    # added a package script disabling the Harn sandbox with no reviewed
    # exception row; this job reported `skipping` on the pull request and
    # failed on the next three main commits (#8757). Hosted and about two and a
    # half minutes, so it occupies no self-hosted slot a product build is
    # queuing for, which is what the capacity contract protects. The one
    # expensive post-merge step, zizmor, carries the condition itself below.
    # No longer the cold-cache owner, so no longer eligible for the big-build
    # lane: `harn-prewarm` above did the expensive fetch and this job restores
    # it in seconds. Keeping hygiene on the cheap hosted default also stops a
    # ~8-minute lint job from occupying a scarce `harn-ci-big` self-hosted slot
    # that a Rust or Swift build could be using.
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || 'ubuntu-24.04') }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    env:
      ZIZMOR_IMAGE: "ghcr.io/zizmorcore/zizmor:1.26.1@sha256:d1117e5dbd9ee4970644067b534ab6ab50371f3c6f7f4d05446eb603a6e78f48"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check CI latency policy
        uses: burin-labs/.github/.github/actions/ci-latency-policy@9650d5116b7d5fde63cb71e7039d8ab7252dc38a
        with:
          baseline-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          github-token: ${{ github.token }}
      # FIRST, before any step that shells out to node or npm. This used to sit
      # last in the job, so the fifteen steps above it ran on whatever node the
      # runner image happened to ship. That held only as long as every image we
      # touched shipped node >= 22.6, and it stopped holding the moment a job
      # landed on a Blacksmith image: `Check served debugger MCP surface` died on
      # `node: bad option: --experimental-strip-types` — a flag this repo needs
      # everywhere, because it runs TypeScript with no build step.
      #
      # Keep pnpm setup after Check packageManager pins so that check observes
      # the runner's original package-manager resolution.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Prove the committed Harn revision is on Harn main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings scripts/check-harn-main-ancestry.ts
      - uses: ./.github/actions/run-actionlint
      # Restore-only in practice: `harn-prewarm` already published these exact
      # keys, so this is a cache hit and `actions/cache` skips its post-job
      # save. The inputs deliberately match the prewarm's, because they select
      # the cache key: asking for a different runtime or a different bytecode
      # contract here would miss the cache this job exists downstream of, and
      # `allow-source-revision` must stay on so an exact `.harn-revision` pin
      # is honored rather than silently served a release binary.
      #
      # No step timeout: this is a cache restore and the job's own 30-minute
      # limit is the backstop.
      - name: Fetch Harn runtime
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          precompile: ${{ hashFiles('.harn-revision') == '' && 'true' || 'false' }}
      - name: Check CI scripts
        # npm (not pnpm): this job has no pnpm/action-setup step and the script
        # is a plain shell/harnw indirection that needs no node_modules, so the
        # default npm-on-PATH runs it without paying for a pnpm install.
        # Keep it after the runtime prime: the contract suite itself executes
        # harnw, so placing it earlier makes a cold source pin fetch and compile
        # outside the job's authenticated, cache-owning setup.
        run: npm run check:ci-scripts
      - name: Check environment registry
        # Ungated on purpose. This check reads the 45 source files the registry
        # names and fails when one stops mentioning the variable it is listed
        # for, so the PR shape that breaks it is an edit to a named file — and
        # those files live under `crates/burin-tui/` and `Sources/`, which the
        # Harn lint job's path filter does not select. #7820 renamed a
        # `HARN_LLM_MODEL` read to a constant, selected no job that runs this
        # check, and landed the drift on main.
        #
        # Enumerating the named files in that filter would recreate the same
        # hole one level up: adding a surface to the registry would then need a
        # matching filter edit, and forgetting it would be invisible in exactly
        # the same way. A check that cannot be filtered away cannot go blind.
        # It is a grep-shaped read of about a second and needs no node_modules
        # (#7846).
        run: npm run check:env-registry
      - name: Check SwiftLint pin
        # Guards the one owner of the SwiftLint version: the container tag this
        # workflow pins must be what repo-root `.swiftlint-version` declares,
        # the same file `pnpm run lint:swift` enforces on the local binary.
        # Deterministic, offline, and needs no node_modules, so it belongs on
        # this ungated hygiene job rather than behind the swift path filter — a
        # ci.yml edit that repins the image must be checked even when no Swift
        # source changed (#7392).
        run: npm run check:swiftlint-pin
      - name: Check Harn sandbox exceptions
        run: |
          npm run check:harn-sandbox-exceptions
          npm run test:script:harn-sandbox-exceptions
          npm run test:script:operator-path-boundary
      - name: Check selector-grammar parity
        # The eval harness resolves a model selector by reading the projection
        # the Rust resolver authors, not by re-deciding the grammar. This proves
        # the reader agrees with that artifact on every declared selector and
        # takes the same structural arms for the undeclared ones. Its sibling
        # gate — that the artifact is what the resolver says today — is the Rust
        # test `selector_routes_artifact_is_current` in the Rust TUI job.
        # Offline and a few seconds (#7827).
        run: npm run test:script:model-catalog-parity
      - name: Check context-fragment census classifier
        # The census reports zero prefix breaks across every preserved eval run.
        # A zero is only worth reading if the same code path can report a
        # non-zero, so this asserts each shape directly, including an interior
        # rewrite that differs from the healthy case by one element. Offline and
        # sub-second.
        run: npm run test:script:context-hygiene-census
      - name: Replay tool-call spans
        # Replays real model-emitted tool calls mined from eval archives through the
        # pinned parser and fails when one is neither read nor complained about. It
        # needs no model and no network, so it belongs on a repin's critical path
        # rather than behind a trial: bc#6388 and harn#6770 were both silent-loss
        # defects that cost hours of transcript forensics to find, and both are
        # visible here in under a second.
        run: |
          npm run check:tool-call-spans
          npm run test:script:tool-call-spans
      - name: Check verify-command attribution
        # Parses each eval's verify command to decide which toolchain the
        # preflight must probe for. Unwired, a parser bug survived here until a
        # compound command (`test -f a && zig build test`) probed for a binary
        # literally named `&&` and silently infra-skipped a mechanism-fitness
        # canary (bc#6456). This is the one CI owner for the suite; the
        # environment shard no longer repeats it. Its compiled Rust verifier
        # reached the old 30s per-test default on standard hosted Linux, so the
        # package script carries a 120s correctness bound.
        run: npm run test:script:verify-command
      - name: Check operator status verdicts
        # These two suites pin what the operator report is allowed to claim:
        # that a check with no basis to judge reports itself inapplicable rather
        # than failing, and that an issue with no usable timestamp is never
        # counted as recent. Both were payable in the coverage baseline — cheap,
        # no external dependency — so a regression in either had simply never
        # been observed by CI.
        run: |
          npm run test:script:cooldown-operator-status
          npm run test:script:coordination-doctor
          npm run test:script:coordination-post-message
          npm run test:script:worktree-admission
      - name: Check play-by-play analyzer verdicts
        # The analyzer decides whether a failed trial is INFRA or a genuine
        # capability outcome, so a regression here mislabels evidence rather
        # than breaking a build — nothing else would notice. It was payable in
        # the coverage baseline and reachable from no PR-path job: the root
        # `test` aggregator is the only caller and CI never runs it.
        #
        # Both halves are cheap and dependency-free. The shell half stubs the
        # harn binary outright, and the harn half uses bounded `with_temp_dir`
        # fixtures, so neither needs node_modules or a provider.
        run: npm run test:script:transcript-playbyplay
      - name: Check served debugger MCP surface
        # These are the only tests that exercise the operator/coordination libs
        # THROUGH the served MCP surface, and they used to live behind the
        # `eval_scripts` filter — which no operator lib matches. Exhibit: #5903
        # changed `scripts/lib/cooldown-operator-status.harn`, the eval job
        # skipped, and the surface contract went unjudged on both the PR and
        # main. Perturbing that lib fails this suite (`neverSeenCount` 0 vs 1),
        # so the coverage loss was real, not theoretical.
        #
        # Enumerating the served libs by name has now failed three times (#4149
        # exhibit 3, #4955, #5903) because the surface's transitive import
        # closure is 352 files — no hand-maintained glob list can track it. The
        # suites use bounded local fixtures with no external dependency, so,
        # like the whole-tree gates below, they stop being gated at all.
        env:
          HARNESS_DEBUGGER_MCP_SURFACE_RESPONSE_TIMEOUT_SECONDS: "180"
        timeout-minutes: 10
        run: |
          npm run test:script:harness-debugger-mcp-surface
          npm run test:script:harness-debugger-mcp-wrapper
          npm run test:script:hermetic-tests
          npm run test:script:main-red-watch
          npm run test:script:hermetic-pipeline-tests
          npm run test:script:pretag-candidate-leg
          npm run test:script:repin-rehearsal
          npm run test:script:rehearsal-outcome
          npm run test:script:drained-pool-probe
          npm run test:script:rehearsal-verdicts
          npm run test:script:ci-step-budgets
      - name: Check every CI test is triggered by an edit to itself
        # Derived, not enumerated: cross-references each job's shell against the
        # path filter gating it, so a suite that no longer triggers on its own
        # source fails here instead of reporting green having run nothing. It
        # judges the filter table itself, so it cannot live behind one.
        run: npm run test:script:ci-test-self-trigger
      - name: Check Swift path filter trigger matrix
        # Guards both Swift path filters: asserts a Swift source/test/manifest
        # change still triggers them while a pure Harn/pipeline/resource change
        # skips them. Parses the live globs from ci.yml so the assertion can't
        # drift from the workflow.
        run: |
          ./scripts/harnw test scripts/tests/test_ci_swift_filters_harn.harn
          ./scripts/harnw test scripts/tests/test_ci_repository_policies_selection_harn.harn
          ./scripts/harnw test scripts/tests/test_ci_rust_impact_planner_harn.harn
          ./scripts/harnw test scripts/tests/test_swift_resource_census_harn.harn
      - name: Check job ceilings against declared latency budgets
        # `.github/ci-latency.json` owns how long each required job may take and
        # ci.yml owns the ceiling that cancels it. This asserts the relation
        # between the two files, so a job can never be killed before spending
        # the budget it declares — the bc#8233 failure, where `harn-lint` and
        # its budget were both 300 s and the first full-budget receipt was
        # cancelled with no verdict.
        run: ./scripts/harnw test scripts/tests/test_ci_job_budgets_harn.harn
      - name: Check whole-tree gates
        # Three gates inventory the ENTIRE tracked tree — `git ls-files` with no
        # pathspec, or a walk of every source directory — so no path filter can
        # cover their domain and none can live behind one.
        #
        #   host-alias-fold (#4987) walks Sources, scripts, crates, server,
        #     burin-portal and Tests. The `harn` filter carries `scripts/**` but
        #     NOT `Sources/**/*.swift`, `Tests/**`, `crates/**`, `server/**` or
        #     `burin-portal/**`, so behind that filter a Rust- or Swift-only PR
        #     could add an unobserved `/private` fold and never be judged by the
        #     gate written to catch it. Reproduced, not inferred: matching all 97
        #     `harn` globs with picomatch semantics,
        #     `Sources/BurinApp/Services/Quality/WorkspaceCheckpointStore.swift`
        #     matches NONE — and that file held one of the four real defects
        #     #4987 fixed, so the registry run alone could not have judged the PR
        #     that introduced it. `crates/.../sandbox.rs`,
        #     `crates/.../worktree_prune.rs`, `server/src/services/*` and
        #     `burin-portal/src/server/lib/*` match none either.
        #
        # The first two ran in `harn-lint`, gated on the `harn` filter,
        # which reaches 2,268 of 5,886 tracked files (38.5%); 46 of the last 150
        # merges matched no `harn` glob at all and so could not have been judged
        # by either gate on their own head. Both holes were reproduced, not
        # inferred (#5646):
        #
        #   tracked-file-visibility — appending one line to `.gitignore` flips it
        #     from pass to fail, and `.gitignore` matches no `harn` glob.
        #   generated-artifact-coverage — adding `server/src/generated/<new>.ts`
        #     flips it, and the filter names `server/src/generated/harn-protocol.ts`
        #     individually rather than the directory.
        #
        # This job carries no `if:`, so here they run on every pull request. All
        # are sub-second (0.4s, 0.1s and ~0.6s under `lint:harn`) and import only
        # node builtins plus the Harn runtime fetched above, so none needs the
        # pnpm install this job deliberately skips. They stay wired into
        # `lint:harn` too: that is the local pre-flight, this is the CI backstop.
        #   python-boundary — walks `**/*.py` from the repository ROOT, so its
        #     subject is the whole tree while its trigger was the `harn` filter.
        #     Reproduced the same way (bc#7917): dropping one unlisted
        #     `docs/probe/scratch_probe.py` takes it from exit 0 to exit 1, and
        #     `docs/` matches no `harn` glob, so the pull request that adds a
        #     stray Python file selects no job that runs the gate. It costs
        #     0.3s under `lint:harn`.
        run: |
          ./scripts/harnw run scripts/check-tracked-file-visibility.harn
          node --experimental-strip-types --no-warnings scripts/check-generated-artifact-coverage.ts
          node --experimental-strip-types --no-warnings scripts/check-host-alias-fold.ts
          ./scripts/harnw run scripts/check-python-boundary.harn -- --check
      - name: Check credential argv surface
        # npm: see "Check CI scripts" above — no pnpm setup in this job.
        run: npm run check:secret-argv-surface
      - name: Repository structural gates
        # ABSENCE DOMAIN, and it was a live hole (bc#7759). The root
        # `pnpm run lint` aggregate defines fifteen jobs; NO CI job ran it. Its
        # two sub-package namesakes above run in `editor-extension/` and
        # `burin-portal/`, so six of the fifteen reached CI nowhere:
        # wall-clock-verdicts, durable-writes, loop-boundary, exec-stubs,
        # checkpoint-ownership and outcome-vocabulary. Reproduced, not inferred:
        # on the clean squash of #7778, `pnpm run lint` exited 1 locally while
        # every CI check was green, because the gate that failed had never been
        # wired.
        #
        # These belong here rather than behind a path filter for the same reason
        # the three checks above do: each reads a tree it is not itself named
        # by, so a filter keyed on the gate's own sources cannot judge the PR
        # that breaks it. `wall-clock-verdicts` scans all of `crates/burin-tui`,
        # and the assertion it caught was moved by a PR that touched only a
        # pipeline and a fixture helper.
        #
        # Runtime is ~19s in total, measured, and all six import node builtins
        # or local helpers plus the Harn runtime this job already fetched, so
        # none needs the pnpm install this job deliberately skips. They stay in
        # `pnpm run lint` too: that is the local pre-flight, this is the CI
        # backstop.
        #
        # The two codegen drift checks (bc#7917, ~2s each) are here for a sharper
        # version of the same reason, and they are the only two the audit could
        # PROVE rather than infer. `spec/toolchain-read-roots.toml` and
        # `spec/sandbox-profile-mapping.toml` are each the single owner of a
        # generated Rust table, and neither file is matched by ANY of the 26 path
        # filters in this workflow. Not "matched by the wrong one" — matched by
        # none, so a pull request editing only one of them selects no job at all,
        # and the generated table drifts from its registry with every check green.
        #
        # Proven, not inferred: appending one row to either file takes its drift
        # check from exit 0 to exit 1, while the change itself triggers nothing.
        # The sandbox mapping decides which sandbox profile each product mode
        # resolves to, so a silent drift there is a confinement question rather
        # than a tidiness one.
        #
        # They stay in the `lint:harn` registry too, exactly as
        # `check-call-role-coverage` does: that is the local pre-flight, this is
        # the backstop that cannot be filtered away.
        #
        # `check-call-role-coverage` (bc#7806, ~2s): the census of every LLM
        # call site under the pipelines tree. It also runs in `lint:harn`, but
        # that job's path filter is what let #7780's undeclared call reach main:
        # the check there passed a seam call leaning on its default, and the
        # test asserting the stricter verdict sat in the path-gated eval-scripts
        # job, which the next PR did not trigger. The check and that test now
        # share one verdict, and this always-on placement is the backstop.
        # `check-stop-reason-vocabulary` scans the Rust TUI's mirrored stop
        # list and session-core classifier, which are outside the `harn` filter.
        # Keep its production verdict here so Rust-only edits cannot skip it;
        # its detailed negative fixtures stay in the path-gated Harn test suite.
        # `check-harn-crate-pin` reads every Rust Cargo.toml pin, so Cargo-only
        # edits must also reach its verdict even though they do not select Harn.
        run: |
          node --experimental-strip-types --no-warnings scripts/check-wall-clock-verdicts.ts
          node --experimental-strip-types --no-warnings scripts/check-durable-writes.ts
          node --experimental-strip-types --no-warnings scripts/check-loop-boundary.ts
          node --experimental-strip-types --no-warnings scripts/check-exec-stubs.ts
          node --experimental-strip-types --no-warnings scripts/check-checkpoint-ownership.ts
          node --experimental-strip-types --no-warnings scripts/check-test-env-writes.ts
          ./scripts/harnw run scripts/check-outcome-vocabulary.harn
          ./scripts/harnw run scripts/check-stop-reason-vocabulary.harn
          node --experimental-strip-types --no-warnings scripts/check-harn-crate-pin.ts
          ./scripts/harnw run scripts/check-call-role-coverage.harn
          ./scripts/harnw run scripts/check-harn-sandbox-exceptions.harn
          ./scripts/harnw run scripts/generate-toolchain-read-roots.harn -- --check
          ./scripts/harnw run scripts/generate-sandbox-profile-mapping.harn -- --check
          ./scripts/harnw run scripts/generate-environment-tool-catalog.harn -- --check
      - name: Test wall-clock verdict gate
        # The negative control. A gate reporting zero offenders looks the same
        # whether it scanned a clean tree or scanned nothing, so this forces it
        # to fail on a deliberately duration-based verdict, to pass on an
        # ordering one, and to refuse an empty scan instead of crashing.
        run: npm run test:script:wall-clock-verdicts
      - name: Check packageManager pins
        # This job is always-on and has no pnpm setup, which is exactly what
        # this check wants: it validates the pins that decide which pnpm a
        # nested project resolves, so running it under a pnpm that was itself
        # selected by those pins would be circular. Always-on also matters
        # because CI never reproduces the bug being guarded (bc#5291) — with
        # pnpm on PATH from the root pin, the fall-through cannot happen here.
        run: npm run check:package-manager-pins
      - name: Test packageManager pin check
        run: npm run test:script:package-manager-pins
      - name: Check Dependabot config
        # Always-on delivery-policy gate. Owned by burin-labs/.github so every
        # product repo shares one YAML-parsing implementation (bc#5873, #5934,
        # #5951). Absence-domain: must not sit behind a path filter.
        uses: burin-labs/.github/.github/actions/check-dependabot-config@5dc4bd22107335cb29ccf8b13ca05fc5f2322468
        with:
          require-lockfiles: "true"
          require-overrides: "true"
      - name: Check hosted runner labels
        # Refuses `ubuntu-latest` anywhere in a workflow or composite action:
        # GitHub moves that label to a new image without a commit here. Same
        # org owner and always-on placement as the Dependabot gate above.
        uses: burin-labs/.github/.github/actions/hosted-runner-labels@47b97f48a4862d684f54a0b8ee7aa370d8bfc126
      # Pre-pull the digest-pinned image with backoff so a transient registry
      # timeout does not fail this required job before the audit starts.
      - name: Pre-pull zizmor image (tolerate ghcr.io flakes)
        # The expensive work on this job: a container pull plus two audit
        # passes. It runs on the merge tree, and on a pull request that
        # touches a workflow or action, so a workflow the pull request itself
        # broke is refused there (bc#9444).
        if: needs.changes.outputs.workflow_audit_selected == 'true'
        run: scripts/pull-container-image.sh "${ZIZMOR_IMAGE}"
      - name: Run zizmor with advisory API fallback
        if: needs.changes.outputs.workflow_audit_selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--persona=regular --format=github --min-severity=medium --min-confidence=medium)
          for attempt in 1 2; do
            set +e
            docker run --rm --volume "${GITHUB_WORKSPACE}:/workspace:ro" --workdir /workspace --env GH_TOKEN "${ZIZMOR_IMAGE}" "${args[@]}" -- .github 2>&1 | tee "${RUNNER_TEMP}/zizmor-${attempt}.log"
            status=${PIPESTATUS[0]}
            set -e
            [[ "${status}" -eq 0 ]] && exit 0
            grep -Eq '^::(notice|warning|error) ' "${RUNNER_TEMP}/zizmor-${attempt}.log" && exit "${status}"
            [[ "${status}" -eq 1 ]] || exit "${status}"
            grep -q 'request error while accessing GitHub API' "${RUNNER_TEMP}/zizmor-${attempt}.log" || exit "${status}"
            [[ "${attempt}" -eq 1 ]] && echo "::warning::zizmor advisory API request failed; retrying once"
          done
          echo "::warning::zizmor advisory API unavailable after retry; running offline audits"
          docker run --rm --volume "${GITHUB_WORKSPACE}:/workspace:ro" --workdir /workspace "${ZIZMOR_IMAGE}" "${args[@]}" --offline -- .github
      - name: Check artifact retention declarations
        # Wall-time's sibling, one resource over: a required job may not be added
        # without stating its minutes, and an artifact may not be uploaded without
        # stating its days. Reads only .github/workflows; no network. ~1s.
        run: node --experimental-strip-types --no-warnings scripts/check-artifact-retention.ts
      - name: Test artifact retention checker
        # Drives the checker's failing paths (absent, computed, over-ceiling, and
        # the vacuous empty scan) against fixture workflows. ~2s.
        run: ./scripts/tests/test_artifact_retention_sh.sh
      - name: Test UI smoke build log retention
        # A failed app bundle build must leave its own output in the artifact
        # directory; the stub build writes a marker that can only arrive by the
        # path under test, and a passing control proves it is not retained
        # unconditionally. No toolchain, no network. ~2s.
        run: ./scripts/tests/test_ui_smoke_build_log_sh.sh
      - name: Test CI toolchain host cache
        # Fixture-backed: root resolution, sha-keyed asset reuse, .ok gating, and
        # rejection of a bad digest — no network. Guards the helper that stopped
        # Harn pipeline shards from re-fetching Zig/Scala on every self-hosted run.
        run: ./scripts/tests/test_ci_toolchain_cache_sh.sh
      - name: Test container image pull retry
        # Proves cache hits, retry/backoff, exhaustion, and invalid-policy
        # rejection using a fake Docker CLI. No daemon or network required.
        run: ./scripts/tests/test_pull_container_image_sh.sh
      - name: Test SwiftPM repository cache repair
        # Synthetic bare repositories prove the preserved self-hosted cache
        # keeps a healthy clone, removes a clone with a missing Git object, and
        # reaches a no-op fixed point. No Swift or network setup is required.
        run: ./scripts/tests/test_repair_swiftpm_repository_cache_sh.sh
      - name: Test Linux Swift shard runner attribution
        # Stub bundles prove a crashed case fails on its own name instead of
        # silently re-running every case in the shard, while a shard body that
        # is actually signalled is still retried. No Swift toolchain needed.
        run: ./scripts/tests/test_run_linux_swift_runtime_tests_sh.sh
      - name: Test CI status path-filter cross-check
        run: npm run test:script:ci-status
      - name: Check merge-group diff fail-closed behavior
        run: ./scripts/tests/test_merge_group_diff_state_sh.sh
      - name: Prove Git fixtures survive a hostile host signing policy
        # Also guards the class: any scripts/tests test that commits into a
        # temporary repository without isolating it from ambient signing.
        run: npm run test:script:git-fixture
      - name: Prove PR issue-subask checker
        run: npm run test:script:pr-issue-subasks
      - name: Set up pnpm for inherited-red fixtures
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install inherited-red fixture dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove the inherited-red decision
        # Pure fixtures, no network: the decision is separated from the Actions
        # API plumbing precisely so its incident case can be replayed here on
        # every pull request. Ungated for the same reason the sibling above is.
        run: npm run test:script:skipped-job-inherited-red
      - name: Check issue references on closed issues
        # Always-on hygiene: rejects the retired `Single-ask: #N` phrase and an
        # `items:` claim on an issue with no enumerated asks. A path filter
        # would miss a Swift-only PR carrying either. No job-level `if:`
        # — this job must stay ungated. Non-PR events write an empty body and
        # the checker treats that as closes-nothing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="${RUNNER_TEMP}/pr-body.md"
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr view "$PR_NUMBER" --json body --jq .body > "$body"
          else
            : > "$body"
          fi
          node --experimental-strip-types --no-warnings scripts/check-pr-issue-subasks.ts --pr-body "$body"

  # Fast SwiftLint on Linux (avoids expensive macOS minutes)
  swift-lint:
    name: SwiftLint
    needs: [changes, runner-availability]
    if: needs.changes.outputs.swift == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_all)
    # SwiftLint runs in the official container and has no self-hosted cache
    # benefit, so use the paid Linux rung for isolated capacity and keep cattrick
    # free for the slow Swift + Harn jobs.
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || 'ubuntu-24.04') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pre-pull SwiftLint image (tolerate ghcr.io flakes)
        # The helper serializes same-image pulls across workers sharing the
        # cattrick Docker daemon and reuses an already verified local image.
        run: scripts/pull-container-image.sh "ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057"
      - name: SwiftLint (strict)
        # Run the official SwiftLint container pinned by digest to the version
        # repo-root `.swiftlint-version` declares. That file is the one owner:
        # `pnpm run lint:swift` refuses to run a local binary of any other
        # version, and `pnpm run check:swiftlint-pin` fails when the tag here
        # drifts from it, so local and CI can no longer disagree about what is a
        # violation (#7392). Bump both together; the digest is the
        # manifest-index digest the ghcr.io manifest API reports for the tag.
        # `--strict` promotes every
        # warning to an error so this job genuinely gates the merge; there is
        # deliberately no `continue-on-error` escape hatch any more.
        run: |
          docker run --rm --entrypoint swiftlint \
            -v "${{ github.workspace }}:/work" -w /work \
            ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057 \
            lint --strict --reporter github-actions-logging

  # Harn pipeline format & lint check
  harn-lint:
    name: Harn lint
    needs: [changes, harn-prewarm, late-runner-availability]
    if: needs.changes.outputs.harn_lint_selected == 'true'
    runs-on: >-
      ${{ (vars.BURIN_CI_LINUX_OWNED_FIRST == 'true' && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_fetch.idle >= 1 && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable", "harn-fetch-ok"]'))
        || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    # The first main-only receipt reached the 5m ceiling while the language
    # scan was still active. Keep the workflow timeout aligned with the typed
    # latency budget so the gate can finish and still reports overruns.
    #
    # #8233 then raised that pair from 5 to 10 minutes for the same symptom,
    # and the scope crossed 10 minutes too: 20 of the 40 main receipts before
    # #8445 were cut at the ceiling, and a job cut by `timeout-minutes` reports
    # `cancelled`, not `failure`, so main looked superseded rather than red and
    # carried no verdict at all. The ceiling was never the defect. The scope is
    # 665 seconds of Harn compilation and the pool gets one slot per core, so
    # two cores of hosted Linux put the floor at 5.5 minutes with perfect
    # packing and no ceiling makes that safe. `check:scripts` alone is 260.5s
    # of it, so it runs as its own job below and this one keeps the remaining
    # ~405 seconds. The split is still the right lever for the WORK; this
    # number is not a target for it.
    #
    # Derived from the registry rather than typed, and deliberately no longer
    # equal to the typed latency budget in `.github/ci-latency.json`. A fuse
    # kills a hang; a latency budget reports a breach. See the sibling
    # `harn-check-scripts` for what sharing one number cost (bc#9009).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Restore warmed Harn runtime
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clear public Harn git isolation
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/clear-harn-git-config
      - name: Check Harn language surfaces
        run: node --experimental-strip-types --no-warnings scripts/lint-harn.ts --scope language-light

  # The other half of the language scope. Which checks land here is the
  # registry's call, not this file's: `scripts/lint-harn.ts` marks a check
  # `heavy`, and `selectLintHarnScope` refuses a registry whose heavy and light
  # halves do not partition the language scope, so a check cannot fall out of
  # CI by belonging to neither job.
  harn-check-scripts:
    name: Harn check scripts
    needs: [changes, harn-prewarm, late-runner-availability]
    if: needs.changes.outputs.harn_check_scripts_selected == 'true'
    runs-on: >-
      ${{ (vars.BURIN_CI_LINUX_OWNED_FIRST == 'true' && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_fetch.idle >= 2 && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable", "harn-fetch-ok"]'))
        || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    # Derived from the registry, not typed: see `jobFuses` in
    # `scripts/config/ci-step-budgets.json` and the gate in
    # `scripts/check-ci-step-budgets.ts`.
    #
    # This is deliberately NOT the typed latency budget in
    # `.github/ci-latency.json`, which it used to equal at 10 minutes. They
    # answer different questions. The latency budget says this job should
    # finish in ten minutes and we want to be told when it does not; the fuse
    # says the job has hung and must be killed. With one number doing both, the
    # service-level breach did not arrive as a warning. It arrived as main run
    # 35585653547 cancelled with no failures, leaving that push no verdict at
    # all (bc#9009). Sized from the slowest tier this job can land on.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Restore warmed Harn runtime
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clear public Harn git isolation
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/clear-harn-git-config
      - name: Check the Harn scripts corpus
        run: node --experimental-strip-types --no-warnings scripts/lint-harn.ts --scope language-heavy

  # A GENERATED PROJECTION CAN ONLY DRIFT ON A TREE NO PULL REQUEST EVER HAD.
  #
  # Two pull requests can each regenerate a derived artifact against their own
  # base, each be green, and leave main holding an artifact neither of them
  # rendered. That is a semantic merge conflict, and no per-pull-request run
  # can see it, because the tree it describes does not exist until the merge.
  # These checks used to run only inside `repository-policies`, which is gated
  # to pushes on main, so the one gate that could refuse such a merge first
  # spoke after it, and the stale artifact then reddened every open pull
  # request through the inherited-failure gate (#8423).
  #
  # It is a separate job from `repository-policies` because of why that one is
  # main-only: cost. The execution contract keeps four jobs off pull requests
  # on their wall times, `repository-policies` at 6m42s among them. The
  # projections scope is not what makes it expensive: all twenty-one checks
  # measured 2.0s together. So the cheap half runs everywhere and the
  # expensive halves stay where the contract put them.
  #
  # No job-level condition, deliberately, exactly like the other cheap hosted
  # refusals: on a merge_group this is the run that sees the merge result, and
  # on a pull request it catches an artifact its own author forgot to
  # regenerate, one merge earlier than before.
  generated-projections:
    name: Generated projections
    needs: [harn-prewarm]
    # One `lint-harn.ts` filter after a Harn fetch: about a minute. The paid
    # 2-vCPU rung is the ubuntu-24.04 shape, $0.002/min on Ubicloud; slim is
    # refused because fetch-harn can fall back to a cargo build (bc#9618).
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-2' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Restore warmed Harn runtime
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clear public Harn git isolation
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/clear-harn-git-config
      - name: Generated projection checks
        # This exact CI-owned command is also the pre-commit subset selected by
        # .github/local-checks.json. A new projection joins the scope at the
        # lint-harn registry, rather than requiring another hook edit.
        run: node --experimental-strip-types --no-warnings scripts/lint-harn.ts --scope projections

  repository-policies:
    name: Repository policies
    env:
      CI_STATUS_ROLE: informational
    # `actions` is the single cold-cache owner for Linux Harn bytecode. Let it
    # save the runtime-keyed cache before Linux consumers restore it instead of
    # compiling the same ~413 modules in parallel after every Harn repin.
    needs: [changes, harn-prewarm, late-runner-availability]
    if: needs.changes.outputs.repository_policies_selected == 'true'
    # Fetch-heavy: prefer self-hosted only when the detector's linux_fetch lane
    # is healthy (capability label `harn-fetch-ok`). Plain `linux` is not enough
    # — a degraded release-asset path can still look idle (burin-code#4199).
    # Unsetting BURIN_CI_PAID_LINUX_PROVIDER moves the paid rung to GitHub-hosted.
    runs-on: >-
      ${{ (vars.BURIN_CI_LINUX_OWNED_FIRST == 'true' && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_fetch.idle >= 3 && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable", "harn-fetch-ok"]'))
        || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    # Cold-cache Harn repins spend minutes on bytecode + action download before
    # the parallel lint pool starts; 8m was razor-thin (~7.3m on a warm tip) and
    # cancelled the gate after a single 100s HttpClient timeout.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Harn's deterministic process sandbox must not inherit checkout's
          # temporary credential-config include. The source-pin action below
          # owns the only Git authentication this read-only job may need.
          persist-credentials: false
          # A push to main judges the integrated commit against HEAD^1.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clear public Harn git isolation
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/clear-harn-git-config
      # The file-length ratchet in the policies scope compares with
      # BURIN_COMPARISON_BASE_SHA, which a depth-2 checkout does not hold once
      # the merge group is deeper than one entry. The token reaches git only
      # through this step's environment, so no later step or Harn sandbox
      # inherits a credential.
      - name: Fetch the comparison base commit
        if: env.BURIN_COMPARISON_BASE_SHA != ''
        env:
          GH_JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BURIN_COMPARISON_BASE_SHA}^{commit}" 2>/dev/null; then
            exit 0
          fi
          basic="$(printf 'x-access-token:%s' "${GH_JOB_TOKEN}" | base64 -w0)"
          echo "::add-mask::${basic}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}" \
            git fetch --no-tags --depth=1 origin "${BURIN_COMPARISON_BASE_SHA}"
          git cat-file -e "${BURIN_COMPARISON_BASE_SHA}^{commit}"
      - name: Repository policy checks
        # The same registry partitions language checks from policy checks.
        # Every policy still runs on main and contributes its real job result
        # to the workflow and main-red watcher, independently of CI status.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types --no-warnings scripts/lint-harn.ts --scope policies-bootstrap
      - name: Set up pnpm for inherited-red report
        if: always()
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install inherited-red report dependencies
        if: always()
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Repository policies requiring Node dependencies
        # The registry partitions the full local policy scope by dependency
        # requirements, so transitive YAML imports cannot run before install.
        if: always()
        run: node --experimental-strip-types --no-warnings scripts/lint-harn.ts --scope policies-installed
      - name: Report inherited main failures
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_HARN_PIN_SELECTED: ${{ needs.changes.outputs.harn_pin }}
        run: |
          node --experimental-strip-types --no-warnings \
            scripts/check-skipped-job-inherited-red.ts --max-runs 8
      - name: Test Harn CI checks
        # The registry above runs each check once; this step runs their focused
        # test suites. Keeping the tests together gives contributors one obvious
        # place to wire coverage without duplicating the check commands. One
        # curated scheduler invocation is load-bearing: every new Harn process
        # prepares the shared import graph before its first case, while
        # several positional test paths keep the same per-test isolation after
        # one compile.
        run: |
          set -euo pipefail
          export HARN=./Sources/BurinCore/Resources/bin/harn
          "$HARN" test \
            scripts/tests/test_check_harn_host_surface_harn.harn \
            scripts/tests/test_tool_surface_descriptions_harn.harn \
            scripts/tests/test_source_scan_harn.harn \
            scripts/tests/test_count_ratchet_harn.harn \
            scripts/tests/test_python_boundary_harn.harn \
            scripts/tests/test_check_secret_argv_surface_harn.harn \
            scripts/tests/test_check_verify_sensitivity_harn.harn \
            scripts/tests/test_git_materialization_harn.harn \
            scripts/tests/test_tui_changelog_harn.harn \
            scripts/tests/test_check_cross_surface_matrix_harn.harn \
            scripts/tests/test_generate_theme_packs_harn.harn \
            scripts/tests/test_generate_transcript_density_harn.harn \
            scripts/tests/test_check_chrome_colors_harn.harn \
            scripts/tests/test_env_registry_harn.harn \
            scripts/tests/test_capability_overlay_field_drops_harn.harn \
            scripts/tests/test_catalog_tool_format_footgun_harn.harn \
            scripts/tests/test_catalog_family_parity_promotion_harn.harn \
            scripts/tests/test_catalog_overlay_cache_tier_pricing_harn.harn \
            scripts/tests/test_overlay_stream_usage_accounting_harn.harn \
            scripts/tests/test_github_pr_status_harn.harn \
            scripts/tests/test_check_pr_merge_state_reader_harn.harn \
            scripts/tests/test_tracked_file_visibility_harn.harn \
            scripts/tests/test_analyze_eval_redaction_harn.harn \
            --timeout 30000
          # Wired here rather than folded into test_analyze_eval_transcripts_harn,
          # whose suite (`test:script:eval-transcript-analyzer`) is baselined as
          # unwired — no workflow runs it — so a case added there would never
          # execute in CI. That file is also exactly at its 3853-line ratchet cap.
          # The fixture suite proves the classifier; the live zero-debt gate is
          # also part of the canonical lint-harn registry above.
          node --experimental-strip-types --no-warnings scripts/tests/test-harn-struct-hotspots.ts
          node --experimental-strip-types --no-warnings scripts/audit-harn-struct-hotspots.ts --check-boundaries
          # bc#7185. The unused `_task` census gate runs in the lint-harn
          # registry above; this is its focused suite so a classifier regression
          # cannot land without a PR-path run.
          node --experimental-strip-types --no-warnings scripts/tests/test-check-unused-pipeline-task.ts
      - name: Test managed inference transport contract
        run: node scripts/tests/test-managed-inference-transport.mjs
      - name: Check matrix tracking-issue state (gh drift check, non-blocking)
        # Networked companion to the offline matrix checker (#2225): verifies
        # every partial/planned tracking-issue ref is still OPEN so the matrix
        # cannot silently rot when its tracking issues get closed. Non-blocking
        # so a closed issue doesn't wedge unrelated PRs; the annotation is the
        # signal to repoint the cells at a live successor.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types --no-warnings scripts/check-matrix-tracking-issues.ts
      - name: Check deferred eval-candidate tracking issues (gh drift check, non-blocking)
        # Companion to scripts/config/deferred-eval-candidates.json (#5686): a
        # candidate deferred for infrastructure must cite an OPEN tracking issue,
        # not a PR-body note. Non-blocking so a closed follow-up does not wedge
        # unrelated PRs; the annotation is the signal to refresh the ledger.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types --no-warnings scripts/check-deferred-eval-candidates.ts
      - name: Check supervision-closeout & lever-roster authority
        # As above: the checks run in the registry step; these are their tests.
        run: |
          set -euo pipefail
          export HARN=./Sources/BurinCore/Resources/bin/harn
          "$HARN" test scripts/tests/test_agent_supervision_closeout_harn.harn --timeout 30000
          "$HARN" test scripts/tests/test_convergence_lever_roster_harn.harn --timeout 30000
          # bc#5683. The check itself runs in the registry step above; this is
          # its falsifier suite, which asserts the check goes RED on each
          # mutation rather than only that the honest tree is green.
          "$HARN" test scripts/tests/test_baseline_model_policy_harn.harn --timeout 30000

  harn-env-namespace:
    name: Harn environment namespace
    needs: [changes, harn-prewarm]
    if: needs.changes.outputs.harn_env_namespace == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_all)
    # One `lint-harn.ts` filter after a Harn fetch: about a minute. The paid
    # 2-vCPU rung is the ubuntu-24.04 shape, $0.002/min on Ubicloud; slim is
    # refused because fetch-harn can fall back to a cargo build (bc#9618).
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-2' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binary
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check product environment names and falsifiers
        run: node --experimental-strip-types --no-warnings scripts/lint-harn.ts --filter harn-env-namespace

  # The ownership registry gate already blocks pull requests, but only through
  # the repin rehearsal, which answers more than thirty minutes after a push and
  # names itself rather than the row to add. Every other caller of
  # `check-harness-ownership.harn` is main-only: `harn-lint`,
  # `harn-check-scripts` and `repository-policies` all carry
  # `github.event_name == 'push'`. So a new `scripts/` file with no row went
  # green on lint and died in the rehearsal (bc#8899, bc#8944).
  #
  # This runs the SAME registry entry through the same driver, filtered to the
  # one check, so the rehearsal gate and this one cannot disagree: there is one
  # implementation and one registration, and both call it. It does not re-add
  # the policy census to pull requests, which is a separate, deliberate choice.
  # The `harn` filter already covers the whole `scripts/` tree, for exactly this
  # reason (see the comment on that entry and #5638).
  harness-ownership:
    name: Harness ownership
    needs: [changes, harn-prewarm]
    if: needs.changes.outputs.harn == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_all)
    # One `lint-harn.ts` filter after a Harn fetch: about a minute. The paid
    # 2-vCPU rung is the ubuntu-24.04 shape, $0.002/min on Ubicloud; slim is
    # refused because fetch-harn can fall back to a cargo build (bc#9618).
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-2' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binary
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check harness ownership rows
        run: node --experimental-strip-types --no-warnings scripts/lint-harn.ts --filter harness-ownership

  harn-helper-tests:
    name: Harn test helpers
    needs: [changes, harn-prewarm]
    if: needs.changes.outputs.harn == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_all)
    # Keep Harn helper tests off the shared self-hosted Linux pool: runner-to-
    # runner variance has caused PR-only child timeouts there. The paid 8-vCPU
    # rung keeps dedicated isolation.
    runs-on: ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-8' || 'ubuntu-8core') }}
    # bc#5977 extracted the previously-unwired 25-suite fan-out into
    # `harn-previously-unwired-suite-tests`. What remains here is fetch + the
    # fan-out helper step + the bounded helper-scripts pool (15m step ceiling).
    timeout-minutes: 25
    env:
      # Resolved runner tier — see ci-policy.toml. Two rungs here; declared so
      # cache steps branch on the tier rather than on `runner.environment`,
      # which reports 'self-hosted' on Ubicloud.
      BURIN_RUNNER_TIER: >-
        ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud' || 'github-hosted') }}
      # These two must satisfy `HARN_CACHE_DIR == $XDG_CACHE_HOME/harn`. Harn
      # resolves its package cache from two paths: `harn install` writes
      # `$HARN_CACHE_DIR/git`, and a nested sandboxed `harn run` reads
      # `$XDG_CACHE_HOME/harn/git`. On a developer machine `scripts/harnw` points
      # HARN_CACHE_DIR at the platform cache, so `$XDG_CACHE_HOME/harn` lands on
      # the same directory and the split is invisible.
      #
      # Pinning HARN_CACHE_DIR to the workspace cache breaks that coincidence. The
      # child then reads `$HOME/.cache/harn` under the sandbox's replaced HOME,
      # empty on every run, misses, and tries to fetch — and the runtime sandbox
      # has no egress, so it surfaces as `Could not resolve host: github.com`
      # naming a package, with nothing pointing at a cache path. Only a package
      # the cache has never held can trigger it, so a pull request that
      # merely ADDS a dependency fails while the existing ones stay green
      # (bc#6375, three connectors). Nesting one level restores the invariant and
      # leaves the cache path and key untouched.
      #
      # Do not collapse these back into one directory. Upstream: harn#6823.
      XDG_CACHE_HOME: ${{ github.workspace }}/.blacksmith/harn-cache
      HARN_CACHE_DIR: ${{ github.workspace }}/.blacksmith/harn-cache/harn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm
        # This job is invoked as `pnpm run test:script:focused-harn-file` and
        # installs with pnpm below, so the binary is required to start the work
        # at all. The focused tests themselves no longer spawn it: a caller
        # inside the run sandbox may only execute programs beneath the
        # workspace, and the package manager resolves to its content-addressed
        # store outside it, so reaching the runner that way died before every
        # assertion body on a Mac that installed it somewhere ungranted
        # (bc#7599). `scripts/test-harn-file.harn` owns the runner's command
        # shape now, and `test:harn:file` is a checked projection of it, so
        # changing the shape here instead of there would fail its pin test. The
        # verdict tests below also need the root YAML parser to exercise the
        # actual workflow.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # runner.temp, NOT runner.tool_cache and not the action's `~/setup-pnpm`
          # default. Both of those are shared by every runner instance on a
          # self-hosted host (they all run as one user), so two jobs landing on
          # the same box race each other through pnpm's self-install:
          #   "Switching pnpm from v11.7.0 to v11.14.0..."
          #   "[ERROR] Worker pnpm#1 exited with code 1"
          # Measured on run 31004592983, cattrick-w1 vs w3, both starting 12:12:41Z.
          # runner.temp lives under each runner's own _work dir, and one runner
          # instance runs one job at a time, so it cannot collide.
          dest: ${{ runner.temp }}/setup-pnpm
          run_install: false
      - name: Install verdict test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove disabled Linux fleet routing
        run: pnpm run test:script:linux-runner-disable
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Harn formatting before merge
        # The full language-lint split is main-only for cost, but formatting is
        # a fast source invariant. Running its canonical owner here prevents an
        # unformatted Harn change from first surfacing on the later main push.
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: HARN=./Sources/BurinCore/Resources/bin/harn ./scripts/check-harn-format.sh
      - name: Test fan-out helper
        # Guards the `run-parallel-checks` helper the next step relies on:
        # fail-fast terminates siblings, timeouts report as hangs, and an
        # all-pass run still emits the per-check notices.
        run: |
          node --experimental-strip-types --no-warnings scripts/tests/test-ci-check-verdict.ts
          node --experimental-strip-types --no-warnings scripts/tests/test-lint-harn-filter.ts
          node --experimental-strip-types --no-warnings scripts/tests/test-run-parallel-checks.ts
          HARN=./Sources/BurinCore/Resources/bin/harn scripts/tests/test_harn_worker_policy.sh
          scripts/tests/test_run_harn_pipeline_budget_margin.sh
          npm run test:script:harn-test-budget-margin
          npm run test:script:agent-gates
          npm run test:script:clone-golden-fixture
          npm run test:script:clone-eval-fixtures
          npm run test:script:harn-packages
          # Nested `harnw run` dogfoods of the ratchet CLI take ~45s under the
          # v0.10.58 pin; the default 30s per-test execute budget is too tight.
          ./Sources/BurinCore/Resources/bin/harn test scripts/tests/test_file_length_ratchet_harn.harn --timeout 120000
          pnpm run test:script:ci-test-script-coverage
          # Hermetic: a fake `gh` on PATH in a temp directory, no network and
          # no repository state. The whole `scripts/` tree is in the `harn`
          # path filter above, so any change to the review helper or its test
          # opens this job.
          npm run test:script:burin-review
          pnpm run test:script:cargo-target-cache-budget
          pnpm run test:script:generated-artifact-coverage
          node --experimental-strip-types --no-warnings scripts/tests/test-check-host-alias-fold.ts
          node --experimental-strip-types --no-warnings scripts/tests/test-check-tracked-flag-live-read.ts
          node --experimental-strip-types --no-warnings scripts/tests/test-check-tracked-flag-doc-gates.ts
          node --experimental-strip-types --no-warnings scripts/tests/test-check-flag-default-agreement.ts
          node --experimental-strip-types --no-warnings scripts/tests/test-check-loop-boundary.ts
          node --experimental-strip-types --no-warnings scripts/tests/test-check-tool-name-references.ts
          node --experimental-strip-types --no-warnings scripts/tests/test-check-swift-integration-xunit.ts
          node --experimental-strip-types --no-warnings scripts/tests/test-check-verdict-proof.ts
          node --experimental-strip-types --no-warnings scripts/tests/test-pre-push-signature-gate.ts
          node scripts/tests/test-lint-staged-config.mjs
          scripts/tests/test_run_shard_groups_sh.sh
          scripts/tests/test_dev_setup_node_only_sh.sh
          scripts/tests/test_dev_setup_build_seed_sh.sh
          scripts/tests/test_build_tree_seed_sh.sh
          scripts/tests/test_package_manifest_change_sh.sh
          npm run test:script:hook-timings
          npm run test:script:reading-level
      - name: Check native resource census before merge
        # The Swift job covers new native consumers; this Harn-selected job
        # also checks edits confined to the census implementation or rules.
        run: ./scripts/harnw test scripts/tests/test_swift_resource_census_harn.harn
      - name: Verdict-proof gate
        # The verdict-integrity ("vacuity") class-kill: fails CI if any verdict
        # producer emits a positive disposition on a path that did not verify the
        # condition (a fail-open affordance beyond baseline, or a positive verdict
        # carrying its own failure flag). Also runs inside `lint:harn`'s registry,
        # but is invoked DIRECTLY here as its own required step so a registry
        # regression can never silently disarm it (the lint:harn-ran-in-no-workflow
        # trap). Static and fast — no harn binary needed.
        run: node --experimental-strip-types --no-warnings scripts/check-verdict-proof.ts
      - name: Test Harn helper scripts
        # These are intentionally outside the pipeline-test shard matrix; they
        # provide separate product coverage and should run once per workflow.
        # lora-corpus-assembly's 8 sequential cases routinely sum past 6 minutes
        # on Linux CI under the v0.10.58 pin even when every individual test
        # passes (5/8 were green at ~303s before the old 360s job budget killed
        # the suite). Keep the step ceiling above that bounded child budget.
        #
        # Deliberately NOT --fail-fast. The children are independent suites. A
        # provisioning fault in harn-app-scripts previously terminated 14
        # siblings as `terminated (a sibling failed first)`, so one install
        # ENOENT read as a broad red and trained people to re-run instead of
        # read. Paying the remaining wall clock buys a run that can be diagnosed.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export HARN=./Sources/BurinCore/Resources/bin/harn
          export HARN_PROVIDERS_CONFIG="$PWD/Sources/BurinCore/Resources/providers.toml"
          node --experimental-strip-types --no-warnings scripts/run-parallel-checks.ts \
            --job qmode-inspect "$HARN test scripts/tests/test_qmode_inspect_harn.harn --timeout 120000" --timeout 300 \
            --job authoritative-checker-coverage "$HARN test scripts/tests/test_authoritative_checker_coverage_harn.harn --timeout 30000" --timeout 120 \
            --job deterministic-syntax-repair "$HARN test scripts/tests/test_deterministic_syntax_repair_harn.harn --timeout 30000" --timeout 120 \
            --job upgrade-pipeline "$HARN test scripts/tests/test_upgrade_pipeline_harn.harn && $HARN test scripts/tests/test_bootstrap_linux_dev_harn.harn" --timeout 120 \
            --job harn-app-scripts "$HARN run scripts/test-harn-app-scripts.harn" --timeout 300 \
            --job lora-tool-regressions "npm run test:script:lora-tool-name-drift && npm run test:script:lora-tool-call-format" --timeout 120 \
            --job review-disk-headroom "npm run test:script:review-disk-headroom" --timeout 120 \
            --job review-reclaim-runtimes "npm run test:script:review-reclaim-runtimes" --timeout 120 \
            --job resolve-macos-runs-on "npm run test:script:resolve-macos-runs-on" --timeout 120 \
            --job check-test-env-writes "npm run test:script:check-test-env-writes" --timeout 120 \
            --job swift-native-coverage "npm run test:script:swift-integration-xunit" --timeout 120 \
            --job settle-policy "npm run test:script:settle-policy" --timeout 120 \
            --job lora-tool-name-check "$HARN run lora-corpus/audit.harn -- --check-tool-names" --timeout 120 \
            --job lora-corpus-assembly "npm run test:script:lora-corpus-assembly" --timeout 600 \
            --job lora-eval-coverage "$HARN run lora-corpus/eval_coverage.harn -- --check --min-covered 98" --timeout 120 \
            --job lora-gemma4-preflight "$HARN run scripts/lora-gemma4-preflight.harn" --timeout 120 \
            --job lora-mlx-train "npm run test:script:lora-mlx-train" --timeout 120 \
            --job lora-mlx-prepare-data "npm run test:script:lora-mlx-prepare-data" --timeout 120 \
            --job lora-mlx-stance-gate "npm run test:script:lora-mlx-stance-gate" \
            --job local-llama-shell "scripts/tests/test_local_llama_qwen36_sh.sh" --timeout 120 \
            --job meter-shard-shell "scripts/tests/test_meter_shard_sh.sh" --timeout 60 \
            --job merge-queue-proof-shell "scripts/tests/test_merge_queue_proof_sh.sh" --timeout 60 \
            --job fleet-hygiene "npm run test:script:fleet-hygiene" \
            --job focused-harn-file "pnpm run test:script:focused-harn-file" --timeout 240 \
            --job local-check-contract "pnpm run test:script:all-checks" --timeout 120 \
            --job fetch-harn-precompile "npm run test:script:fetch-harn-precompile" \
            --job served-source "npm run test:script:served-source" \
            --job harn-smoke-matrix "npm run test:script:harn-smoke-matrix"

  harn-previously-unwired-suite-tests:
    name: Previously unwired Harn suites (${{ matrix.name }})
    needs: [changes, harn-prewarm]
    if: needs.changes.outputs.harn_suites_heavy_selected == 'true'
    # bc#5977 / bc#5703 tranche 2. These suites (25 from the original wiring,
    # plus bc#5986's harn-fetch-health-probe) were first placed in the
    # monolithic `harn-tests` fan-out; on GitHub-hosted fallback that step ran
    # 46m40s as one opaque check (run 31259613177) while every other required
    # job had finished. A 16-wide single-machine fan-out completed in 682s on
    # cattrick but raised per-case latency, so the topology here is isolated
    # serial shards with bounded concurrency across runners — not more
    # PARALLEL_CHECKS_MAX_CONCURRENCY.
    #
    # Deliberately fail-fast: false. Suites are independent; the first failure
    # is not reliably the informative one.
    #
    # Per-suite hang budgets use coreutils `timeout` (not `run-parallel-checks
    # --timeout`) so the duration-limit census stays flat at cap 0 while each
    # child still dies before an opaque outer job ceiling. Budgets are ~1.3x
    # the measured 16-wide cattrick child walls from bc#5977, with a 300s floor
    # for the short supply-chain suites.
    #
    # npm, not pnpm: these suites shell out to harnw and need no node_modules.
    runs-on: ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-8' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-8core') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: supply-chain
            groups:
              - name: supply-chain-core
                command: >-
                  timeout 300 npm run test:script:atomic-write &&
                  timeout 300 npm run test:script:worktree-janitor &&
                  timeout 300 npm run test:script:harnw-flags-isolation &&
                  timeout 300 npm run test:script:harnw-providers-config &&
                  timeout 300 npm run test:script:harnw-release-pin-provenance &&
                  timeout 300 npm run test:script:tracked-flag-ambient-isolation &&
                  timeout 300 npm run test:script:tracked-flag-isolation &&
                  timeout 300 npm run test:script:build-daemons-live &&
                  timeout 300 npm run test:script:protocol-bindings-auth &&
                  timeout 300 npm run test:script:repin-harn &&
                  timeout 300 npm run test:script:harn-crate-pins &&
                  timeout 300 npm run test:script:generate-model-catalog &&
                  timeout 120 npm run test:script:run-codegen &&
                  timeout 300 npm run test:script:slash-command-reference &&
                  timeout 300 npm run test:script:memorization-guard
              - name: supply-chain-release
                command: >-
                  timeout 60 npm run test:script:render-deploy &&
                  timeout 300 npm run test:script:github-pr-agent &&
                  timeout 300 npm run test:script:publish-ci-runtime-report &&
                  timeout 300 npm run test:script:ci-cost-ledger &&
                  timeout 300 npm run test:script:linux-artifact-retention &&
                  timeout 300 npm run test:script:fetch-harn-asset-cache &&
                  timeout 60 npm run test:script:harn-cache-identity &&
                  timeout 60 npm run test:script:harn-bytecode-handoff &&
                  timeout 60 npm run test:script:harn-version-boundary &&
                  timeout 300 npm run test:script:harn-fetch-health-probe &&
                  timeout 120 npm run test:script:runner-label-reachability &&
                  timeout 300 npm run test:script:release-metadata &&
                  timeout 300 npm run test:script:scoop-manifest &&
                  timeout 300 npm run test:script:public-release-gate &&
                  timeout 300 npm run test:script:eval-watchdog &&
                  timeout 300 npm run test:script:eval-watchdog-edit-loop &&
                  timeout 300 npm run test:script:skill-dogfood-report &&
                  timeout 300 npm run test:script:manifest-hook-arity &&
                  timeout 300 npm run test:script:strict-lint-ratchet
          - name: eval-runtime
            groups:
              - name: mechanism
                command: >-
                  timeout 900 npm run test:script:mechanism-liveness
              - name: eval-outcome
                command: >-
                  timeout 780 npm run test:script:eval-outcome
              - name: early-abort
                command: >-
                  timeout 780 npm run test:script:run-eval-early-abort
              # Each of these drives a probe through the bundled harn binary as a
              # subprocess, so they belong on a shard whose setup already fetches
              # that binary. 12.8s measured locally, both files together.
              - name: eval-sandbox
                command: >-
                  timeout 300 npm run test:script:eval-sandbox-surfaces
              - name: telemetry
                command: >-
                  timeout 540 npm run test:script:run-eval-telemetry
              - name: spend
                command: >-
                  timeout 420 npm run test:script:run-eval-cost-killswitch &&
                  timeout 360 npm run test:script:turn-budget-failfast
          - name: verdicts
            groups:
              - name: completion
                command: >-
                  timeout 600 npm run test:script:eval-completion-contract &&
                  timeout 300 npm run test:script:eval-status &&
                  timeout 300 npm run test:script:stop-reason-vocabulary &&
                  timeout 300 npm run test:script:outcome-vocabulary &&
                  timeout 300 npm run test:script:user-facing-prose &&
                  timeout 300 npm run test:script:verify-loop-completion-gate
              - name: calibration
                command: >-
                  timeout 480 npm run test:script:judge-calibration &&
                  timeout 480 npm run test:script:rubric-judge-calibration &&
                  timeout 480 npm run test:script:sweep-health &&
                  timeout 300 npm run test:script:served-response-fact
              - name: verdict-and-corpus
                command: >-
                  timeout 300 npm run test:script:compaction-grader &&
                  timeout 300 npm run test:script:harness-debugger-bulkmine &&
                  timeout 300 npm run test:script:lora-grader-summary &&
                  timeout 300 npm run test:script:lora-role-robustness &&
                  timeout 300 npm run test:script:reexec-snapshot-fitness &&
                  timeout 300 npm run test:script:rubric-harn-authoring
    env:
      BURIN_RUNNER_TIER: >-
        ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && 'self-hosted' || 'github-hosted') }}
      HARN_CACHE_DIR: ${{ github.workspace }}/.blacksmith/harn-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ${{ matrix.name }} shard
        env:
          SHARD_GROUPS: ${{ toJSON(matrix.groups) }}
        run: scripts/ci/run-shard-groups.sh

  harn-capability-migration-tests:
    name: Capability-migrated Harn suites (${{ matrix.name }})
    needs: [changes, harn-prewarm]
    if: needs.changes.outputs.harn_suites_heavy_selected == 'true'
    # bc#5939. One shared four-way local fan-out measured 11m29s and made
    # subprocess-heavy cases hit Harn's default execute ceiling. The first
    # hosted runs then measured the analyzer and model-batch suites as the two
    # dominant serial groups. Isolating both keeps the projected slowest PR
    # shard below the 12-minute target. The paid 8-vCPU rung provides that
    # isolation.
    runs-on: ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-8' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-8core') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: environment-and-analysis
            groups:
              - name: environment
                command: >-
                  npm run test:script:diagnose-env &&
                  npm run test:script:ablation &&
                  npm run test:script:battleground-health &&
                  npm run test:script:enrichment-model-ladder &&
                  npm run test:script:reconcile-trace
              - name: analysis
                command: >-
                  npm run test:script:eval-transcript-analyzer
              - name: model-batch
                command: >-
                  npm run test:script:model-batch-receipts
          - name: artifacts-and-reporting
            groups:
              - name: artifacts
                command: >-
                  npm run test:script:capture-eval-baseline &&
                  npm run test:script:code-exploration-comparison &&
                  npm run test:script:lora-corpus-batch-requests
              - name: selection
                command: >-
                  npm run test:script:run-eval-best-of-n &&
                  npm run test:script:repro-eval &&
                  npm run test:script:meter-shard
              - name: reporting
                command: >-
                  npm run test:script:eval-report &&
                  npm run test:script:cross-provider-veto &&
                  npm run test:script:merge-captain-value-gate &&
                  npm run test:script:repo-hud-path-facts &&
                  npm run test:script:spec-contract &&
                  npm run test:script:staircase-score
    env:
      BURIN_RUNNER_TIER: >-
        ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && 'self-hosted' || 'github-hosted') }}
      HARN_CACHE_DIR: ${{ github.workspace }}/.blacksmith/harn-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm (binary only, no install)
        # repro-eval deliberately dogfoods the real pnpm-to-Harn boundary.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          run_install: false
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ${{ matrix.name }} shard
        env:
          SHARD_GROUPS: ${{ toJSON(matrix.groups) }}
        run: scripts/ci/run-shard-groups.sh

  harn-pipeline-plan:
    name: Plan Harn pipeline tests
    needs: [changes, harn-prewarm]
    if: needs.changes.outputs.harn_pipeline_heavy_selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      affected_from: ${{ steps.plan.outputs.affected_from }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
      shard_indices: ${{ steps.plan.outputs.shard_indices }}
      budget_margin_shard_total: ${{ steps.plan.outputs.budget_margin_shard_total }}
      budget_margin_shard_indices: ${{ steps.plan.outputs.budget_margin_shard_indices }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Harn computes the merge-base diff itself. A complete checkout is
          # required whenever the PR path supplies an affected-from ref.
          fetch-depth: ${{ needs.changes.outputs.harn_pipeline_affected_from != '' && '0' || '1' }}
          persist-credentials: false
      - name: Isolate public Harn source fetch
        if: needs.changes.outputs.harn_pipeline_affected_from != '' && hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch Harn planner
        if: needs.changes.outputs.harn_pipeline_affected_from != ''
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          precompile: "false"
      - name: Verify pinned Harn affected-test contract
        if: needs.changes.outputs.harn_pipeline_affected_from != ''
        env:
          HARN: ./Sources/BurinCore/Resources/bin/harn
        run: scripts/tests/test_plan_harn_pipeline_shards.sh --integration
      - name: Resolve Harn-owned impact and Burin-owned capacity
        id: plan
        env:
          HARN: ./Sources/BurinCore/Resources/bin/harn
          BURIN_HARN_AFFECTED_FROM: ${{ needs.changes.outputs.harn_pipeline_affected_from }}
        run: scripts/plan-harn-pipeline-shards.sh

  harn-pipeline-tests:
    name: Harn pipeline tests (${{ matrix.shard_index }}/${{ needs.harn-pipeline-plan.outputs.shard_total }})
    needs: [changes, harn-prewarm, harn-pipeline-plan, late-runner-availability]
    if: needs.changes.outputs.harn_pipeline_heavy_selected == 'true'
    # Harn owns whether a PR can select its transitive importer closure or must
    # fall back to the complete suite. Burin sizes selected plans up to the
    # policy cap and always gives a full fallback the exhaustive 16 workers.
    #
    # Owned Linux runners take one shard per idle fetch-healthy runner: shard k
    # goes self-hosted only when at least k are idle, so a busy or reclaimed
    # fleet sends the rest to ubuntu-24.04 instead of queueing them. #5990
    # moved the shards off the fleet on the claim that concurrent matrix cells
    # turn deterministic tests into contention failures. #9459 measured it on
    # tornadough: 16 shards x 5 concurrent copies at the runners'
    # HARN_TEST_JOBS=4, beside live CI builds, passed 80/80, while a planted
    # shared-path defect in the same harness failed 3 of 5 copies.
    #
    # This branch originally moved these shards to the 8-vCPU runner, on the
    # stated grounds that they dominate the CI critical path. They did when it
    # was written. They do not now: harn#4815 made per-test package resolution
    # ~5x costlier, and with the fix in v0.10.19 these shards run a p90 of 2.4
    # min against a critical path of ~19 min owned by `swift`. Paying double per
    # minute to speed up a job nobody waits on is the opposite of a cost lever,
    # so main's 4-vCPU routing stands and the upgrade is dropped.
    runs-on: >-
      ${{ (vars.BURIN_CI_LINUX_OWNED_FIRST == 'true' && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_fetch.idle >= matrix.shard_index && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable", "harn-fetch-ok"]'))
        || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        shard_index: ${{ fromJSON(needs.harn-pipeline-plan.outputs.shard_indices) }}
    env:
      # Resolved runner tier — see ci-policy.toml. Must mirror the runs-on
      # ladder so cache steps do not mis-gate on self-hosted.
      # `runner.environment` reports 'self-hosted' on Ubicloud and cannot
      # be used for this.
      BURIN_RUNNER_TIER: >-
        ${{ (vars.BURIN_CI_LINUX_OWNED_FIRST == 'true' && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_fetch.idle >= matrix.shard_index && 'self-hosted')
          || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && 'self-hosted' || 'github-hosted') }}
      HARN_CACHE_DIR: ${{ github.workspace }}/.blacksmith/harn-cache
      # Workspace fallback only. Owned Linux hosts override via
      # BURIN_CI_TOOLCHAIN_CACHE_DIR (runner `.env`) or the fleet shared dirs
      # discovered by scripts/lib/ci-toolchain-cache.sh — see Resolve step.
      CI_TOOLCHAIN_CACHE_DIR: ${{ github.workspace }}/.build/ci-toolchains
      BURIN_HARN_AFFECTED_FROM: ${{ needs.harn-pipeline-plan.outputs.affected_from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The affected-module selector needs the exact PR base. Exhaustive
          # events retain the shallow checkout.
          fetch-depth: ${{ needs.harn-pipeline-plan.outputs.affected_from != '' && '0' || '1' }}
          persist-credentials: false
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Zig and Scala both install through the shared cached-tool step, which
      # resolves the same host-persistent root on tornadough/cattrick (so the
      # 16 shards share one install) and falls back to this job's workspace
      # path on hosted/Ubicloud, where it adds the actions/cache layer
      # itself. Do NOT use runner.tool_cache — that path is host-shared across
      # runner instances and is the race class fixed in #5943.
      #
      # The cache is keyed per tool by checksum rather than by one combined
      # key, so bumping Zig no longer discards Scala's archive.
      - name: Install Zig for authoritative pipeline checks
        timeout-minutes: 5
        uses: ./.github/actions/cached-tool
        with:
          name: zig
          version: "0.16.0"
          sha256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          binary: zig
      - name: Report the Zig build in use
        run: zig version
      # Without scalac the five `deterministic_syntax_repair_scala` cases do not
      # skip loudly — they report PASS having never run. Every shard must
      # therefore fail closed during provisioning; the tests may be assigned to
      # any shard, which is why this install has no fallback and no
      # `continue-on-error`. Scala 3 ships as a JVM launcher; the runner image
      # already has Java.
      - name: Install Scala for authoritative pipeline checks
        timeout-minutes: 5
        uses: ./.github/actions/cached-tool
        with:
          name: scala3
          version: "3.8.4"
          sha256: "cb2f9a358ec449eec417d63efd9b6fc6bd66a13b1347d49c25571eca284857d3"
          url: https://github.com/scala/scala3/releases/download/3.8.4/scala3-3.8.4.tar.gz
          binary: bin/scalac
      - name: Report the Scala build in use
        run: scalac -version
      - name: Test harn pipeline shard
        id: harn_pipeline_shard
        # Sharding is owned by Harn's user-test runner, which discovers the
        # whole suite, filters the selected shard, and balances work with the
        # timing cache. The per-shard timeout is now a regression detector, not
        # the normal way this check completes.
        timeout-minutes: 55
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ needs.harn-pipeline-plan.outputs.shard_total }}
        run: |
          set -euo pipefail
          export HARN=./Sources/BurinCore/Resources/bin/harn
          export HARN_PROVIDERS_CONFIG="$PWD/Sources/BurinCore/Resources/providers.toml"
          export HARN_STATE_DIR=Sources/BurinCore/Resources/pipeline-tests/tests/.harn-state
          export TMPDIR="$PWD/.build/harn-test-tmp"
          export BURIN_HOME="$RUNNER_TEMP/burin-harn-pipeline-tests-$SHARD_INDEX"
          mkdir -p .build/harn-tests "$TMPDIR"
          scripts/run-harn-pipeline-shard.sh \
            --shard-index "$SHARD_INDEX" \
            --shard-total "$SHARD_TOTAL" \
            --junit ".build/harn-tests/pipelines-$SHARD_INDEX.xml" \
            --json-out ".build/harn-tests/pipelines-$SHARD_INDEX.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: always()
        with:
          node-version-file: .node-version
      - name: Classify Harn pipeline shard verdict
        if: always()
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_OUTCOME: ${{ steps.harn_pipeline_shard.outcome }}
        run: |
          node --experimental-strip-types --no-warnings scripts/ci-check-verdict.ts timeout-after-report \
            --check "harn-pipeline-tests-$SHARD_INDEX" \
            --outcome "$SHARD_OUTCOME" \
            --report-json ".build/harn-tests/pipelines-$SHARD_INDEX.json" \
            --summary-json ".build/harn-tests/pipelines-$SHARD_INDEX.verdict.json"
      - name: Record runner-local authoritative checker presence
        # Hosted-image toolchains vary across runners. Keep the expensive
        # functional reporter single-authority below, but record PATH and
        # in-process grammar presence on every shard so that report cannot
        # accidentally speak for fifteen different machines.
        if: always()
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -euo pipefail
          export HARN=./Sources/BurinCore/Resources/bin/harn
          export HARN_PROVIDERS_CONFIG="$PWD/Sources/BurinCore/Resources/providers.toml"
          mkdir -p .build/harn-tests
          "$HARN" run --no-sandbox scripts/authoritative-checker-coverage.harn -- \
            --runner-receipt \
            --json-out ".build/harn-tests/authoritative-presence-$SHARD_INDEX.json" \
            --summary-out ".build/harn-tests/authoritative-presence-$SHARD_INDEX.md"
          cat ".build/harn-tests/authoritative-presence-$SHARD_INDEX.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize authoritative checker coverage
        # Provisioning fails closed on every shard, so one broad live probe is
        # authoritative. Running the same cold compiler probes sixteen times
        # adds paid work without adding coverage.
        if: always() && matrix.shard_index == 1
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          set -euo pipefail
          export HARN=./Sources/BurinCore/Resources/bin/harn
          export HARN_PROVIDERS_CONFIG="$PWD/Sources/BurinCore/Resources/providers.toml"
          mkdir -p .build/harn-tests
          # This reporter shells out to installed toolchains so it can tell us
          # which authoritative cases were real versus skipped. The test shard
          # above remains sandboxed.
          #
          # `--require` is what makes the shard's green meaningful: a case whose
          # toolchain is absent reports PASS without running, and until this check
          # existed that was only ever visible as a number in the step-summary
          # table below. `deterministic_syntax_repair_scala` sat at 5/5 skipped
          # that way while the mechanism it covers was dead in production.
          #
          # Require exactly what this job PROVISIONS: zig and scala (installed by
          # the steps above) plus the two in-process grammars. clang++ and swiftc
          # come from the hosted image, so they are deliberately NOT required —
          # the image is not ours and it churns underneath us (a single run had
          # shards on image 20260705.232.1 and 20260714.240.1, with clang++ present
          # on one and not the other). Their cases warn loudly instead. That is not
          # a free pass: a probe that cannot even establish whether a toolchain is
          # there is still a hard failure, required or not.
          set +e
          "$HARN" run --no-sandbox scripts/authoritative-checker-coverage.harn -- \
            --check --require zig_ast_check,zig_ast_grammar,go_ast_grammar,scalac_parse \
            --json-out ".build/harn-tests/authoritative-coverage-$SHARD_INDEX.json" \
            --summary-out ".build/harn-tests/authoritative-coverage-$SHARD_INDEX.md"
          coverage_status=$?
          set -e
          cat ".build/harn-tests/authoritative-coverage-$SHARD_INDEX.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$coverage_status"
      # ARTIFACT UPLOAD POLICY FOR THIS SHARD, recorded where the job is owned.
      #
      # The artifact intermediary refuses a finalize from time to time, with a
      # non-retryable 403 or a connect timeout. Nothing in the tree causes it,
      # the shard's cases have already finished by then, and until this policy
      # existed the row simply read "Harn pipeline tests (N/16): failure",
      # which is the sentence for a test failure. Every one of those needed a
      # person to open the log, decide it was infrastructure, and authorise a
      # rerun by hand.
      #
      # Three parts, in order:
      #
      #  1. One in-job retry. A transient finalize usually succeeds the second
      #     time and never reaches the row at all. `overwrite` is required
      #     because the first attempt may have created the artifact before
      #     failing to finalize it.
      #  2. Neither attempt decides the job. `continue-on-error` hands that to
      #     the classifier below, which is the step that can tell the two
      #     failures apart.
      #  3. The classifier NAMES the failure; it does not excuse it. A red
      #     stays red. `docs/workflows/ci-verdict-envelopes.md` owns this:
      #     "Required checks should remain red for infrastructure failures."
      #     A passing report whose upload failed both times exits non-zero
      #     with classification `artifact_upload_failure` and the test verdict
      #     in the envelope, so a person or an authorising agent can act on
      #     the name without reading the log. That is what the row was missing,
      #     not a green.
      #
      #     An earlier revision of this block turned that case into a warning
      #     and let the job go green on the report it read off the runner. It
      #     was wrong for a reason worth keeping written down: the shard's
      #     results had not reached anyone, so the green stood for a run whose
      #     evidence no one could open. Naming the red answers the original
      #     complaint, which was that the row said "the tests failed" when
      #     they had not.
      #
      # The verdict JSON lands inside the directory whose upload just failed,
      # so it cannot be the channel for this. The annotation is, and it comes
      # back as structured data from the check-run annotations endpoint.
      - name: Upload Harn pipeline test artifacts
        id: upload_harn_pipeline_artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-pipeline-tests-${{ matrix.shard_index }}
          path: |
            .build/harn-tests/**
            .harn/test-timings.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retry Harn pipeline test artifact upload
        id: retry_harn_pipeline_artifacts
        if: always() && steps.upload_harn_pipeline_artifacts.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-pipeline-tests-${{ matrix.shard_index }}
          path: |
            .build/harn-tests/**
            .harn/test-timings.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - name: Classify Harn artifact upload verdict
        if: always()
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          UPLOAD_OUTCOME: ${{ steps.upload_harn_pipeline_artifacts.outcome }}
          RETRY_OUTCOME: ${{ steps.retry_harn_pipeline_artifacts.outcome }}
        run: |
          node --experimental-strip-types --no-warnings scripts/ci-check-verdict.ts artifact-upload \
            --check "harn-pipeline-artifacts-$SHARD_INDEX" \
            --upload-outcome "$UPLOAD_OUTCOME" \
            --retry-upload-outcome "$RETRY_OUTCOME" \
            --source-summary-json ".build/harn-tests/pipelines-$SHARD_INDEX.verdict.json" \
            --summary-json ".build/harn-tests/pipelines-$SHARD_INDEX.artifact-verdict.json"
  # One macOS workspace shares dependency setup and compilation across phases.
  swift:
    name: macOS build and tests
    needs: [changes, runner-availability, mac-runner-placement]
    # Keep each phase's existing event and path selection. Full tests run
    # wherever Swift changed, pull requests included since #8850, so a
    # macOS-only regression is refused before it reaches main rather than
    # after; a Harn repin selects them too, because generated Swift can break
    # macOS-only code. App checks run on affected PRs, and subprocess
    # integration runs on affected main pushes, Harn pin pull requests, and
    # daily schedules. Placement can route to persistent owned Macs, so fork
    # heads never run here; CI status keeps a selected but skipped phase
    # blocking, as for the linked Rust jobs.
    if: >-
      (needs.changes.outputs.swift_full_selected == 'true' ||
      needs.changes.outputs.swift_app_selected == 'true' ||
      needs.changes.outputs.swift_app_tests_selected == 'true' ||
      needs.changes.outputs.swift_integration_selected == 'true')
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    # Capacity chooses placement, never coverage. Keep the standard hosted
    # fallback when the dedicated Mac mini pool has no available runner.
    # Projection of the one routing owner; see the mac-runner-placement job.
    runs-on: ${{ fromJSON(needs.mac-runner-placement.outputs.swift) }}
    # Individual phases retain their process-group watchdogs. The outer cap
    # covers shared cold setup and all selected phases, and on the mini pool
    # also the wait for a runner: a job's timeout starts when it is queued.
    # Merge-queue waits for a mini measured p90 52.6 min on 2026-09-26, so the
    # cap is wait plus the 15-minute mini run. A spilled run starts at once and
    # its fuse is what the daily spill cap reserves (bc#9569).
    timeout-minutes: ${{ needs.mac-runner-placement.outputs.swift_spilled == 'true' && 40 || 75 }}
    outputs:
      full: ${{ steps.full.outcome }}
      app: ${{ steps.app.outcome }}
      app-tests: ${{ steps.app-tests.outcome }}
      integration: ${{ steps.integration.outcome }}
    steps:
      # Stamped before checkout so the receipt counts the whole job.
      - name: Stamp the job start
        working-directory: .
        run: echo "BURIN_JOB_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Clean workspace
        timeout-minutes: 5
        run: ./scripts/ci-clean-workspace.sh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.0'
      # Xcode 26 and later ship the Metal toolchain as a separate component.
      # A fresh image can lack it (Blacksmith's Xcode 27 RC, 2026-09-27), and
      # then SwiftTerm's Shaders.metal fails CompileMetalFile. Install it only
      # when `metal` cannot run; on a runner that has it this is one probe.
      - name: Ensure the Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || { for attempt in 1 2 3; do xcodebuild -downloadComponent MetalToolchain && exit 0; [ "$attempt" -lt 3 ] && sleep $((attempt * 30)); done; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Check BurinApp test filter against SwiftPM targets
        # The independent swift-macos filter selects this PR job even if the
        # swift-burinapp-tests filter is accidentally narrowed to tests only.
        run: |
          node --experimental-strip-types --no-warnings --test scripts/tests/test-burinapp-test-filter.ts
          node --experimental-strip-types --no-warnings scripts/check-burinapp-test-filter.ts
      - name: Check macOS SQLite package contract
        run: xcrun swift .github/checks/macos-sqlite-linkage.swift
      - name: Cache SwiftPM source dependencies
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-source-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-source-
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # App-only checks never start a VM. Other phases share one precompile.
          precompile: >-
            ${{ (needs.changes.outputs.swift_full_selected == 'true' ||
              needs.changes.outputs.swift_integration_selected == 'true') && 'true' || 'false' }}
      - name: Run macOS-bound Swift tests
        id: full
        if: needs.changes.outputs.swift_full_selected == 'true'
        # `swift test --parallel` does not enforce a per-test wall-clock
        # ceiling, so a wedged subprocess (e.g. a hung `harn` VM spawned by
        # `LightweightPipelineRunner`) can stall the runner indefinitely.
        # `scripts/run-with-watchdog.sh` SIGTERMs then SIGKILLs the whole
        # process group on timeout, which prevents orphan harn/xctest from
        # blocking job teardown. Step `timeout-minutes` is the GitHub-level
        # backstop in case the watchdog itself is wedged. Layering must stay
        # watchdog (seconds) < step timeout < job timeout so the watchdog can
        # clean up process groups before GitHub cancels the job.
        timeout-minutes: 27
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          # Test binaries are rebuilt/ad-hoc signed and must never consume the
          # developer or runner login Keychain. This disables both Burin's
          # credential store and Harn provider-key staging.
          BURIN_SKIP_KEYCHAIN: "1"
        run: |
          set -euo pipefail
          source ./scripts/ci-resource-limits.sh
          mkdir -p .build
          ./scripts/harnw run scripts/check-swift-macos-tests.harn
          selectors="$(ci_policy_string_array swift_macos test_filters)"
          test -n "$selectors"
          filter="($(printf '%s\n' "$selectors" | paste -sd '|' -))"
          ./scripts/run-with-watchdog.sh 1500 \
            ci_resource_limits_swiftpm test \
            --disable-automatic-resolution \
            --parallel \
            --skip UITests \
            --filter "$filter" \
            --xunit-output .build/test-results.xml
          node --experimental-strip-types --no-warnings \
            scripts/check-swift-integration-xunit.ts .build/test-results.xml swift_macos
      - name: Run the first-run gauntlet
        if: steps.full.outcome == 'success'
        # Drives the Swift session-assembly path end to end offline: runtime
        # projection, ACP session/new, a replayed first turn that executes a
        # real tool through CoreToolExecutor, and the failure text a broken run
        # produces. `swift test` does not cover this — AgentPipelineRunner is
        # constructed only by unit tests that never start a VM — and the eval
        # and TUI lanes link Harn in-process, which is a different assembly.
        #
        # `credential_grant` cannot run here: CI has no usable login keychain,
        # so BURIN_SKIP_KEYCHAIN is set and credential projection grants nothing
        # by contract. The gate below allows that one stage to skip for exactly
        # that reason and requires the other five to pass, so the uncovered
        # credential path is declared rather than hidden behind a green check.
        #
        # The hang backstop is the watchdog below, not a step `timeout-minutes`:
        # it SIGTERMs then SIGKILLs the whole process group, which is what
        # actually reaps an orphaned harn VM, and the duration-limit census caps
        # new hand-set limits in this workflow at zero. Sized at 600s against a
        # measured ~25s local run, so it trips only on a wedge.
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          BURIN_SKIP_KEYCHAIN: "1"
          FIRST_RUN_GAUNTLET_REPORT: .build/first-run-gauntlet.json
        run: ./scripts/run-with-watchdog.sh 600 ./scripts/run-first-run-gauntlet.sh
      - name: Upload first-run gauntlet report
        if: always() && steps.full.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-run-gauntlet-report
          path: .build/first-run-gauntlet.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload test results
        if: always() && steps.full.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-test-results
          path: .build/test-results.xml
          retention-days: 7

      - name: Build BurinApp and Burin product (link native dependencies)
        id: app
        if: needs.changes.outputs.swift_app_selected == 'true'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          source ./scripts/ci-resource-limits.sh
          mkdir -p .build
          # Job-level timeout-minutes is the hang backstop; the watchdog is the
          # process-group cleanup so a wedged swiftc cannot strand the runner.
          # Avoid extra step-level timeout-minutes: the duration-limit census
          # forbids growing hand-set limits in ci.yml without a baseline raise.
          #
          # The budget is DERIVED from this step's measured durations on this
          # runner class, not typed here. The 1100s that used to sit inline was
          # comfortable on the Macs, where the step takes 14-236s, and a coin
          # flip on the hosted fallback, where one run was killed 5s past it
          # having compiled 2231 of 2231 files. `none` means nobody has
          # measured this tier, so the job timeout is the only honest cap.
          # The tier is keyed off the runner NAME, for two reasons. It is
          # the same key the recorded samples were bucketed by, so the
          # budget and its evidence cannot drift apart. And an unknown
          # runner falls to the unmeasured tier, which resolves to no
          # watchdog rather than to the tighter of the two budgets.
          case "${RUNNER_NAME}" in
            burin-mac-mini*) tier="macos-mini" ;;
            *) tier="macos-hosted" ;;
          esac
          budget="$(node --experimental-strip-types --no-warnings \
            scripts/ci-step-budget.ts --site burinapp-build --tier "$tier")"
          echo "watchdog budget for ${tier}: ${budget}"
          guard() {
            if [ "$budget" = "none" ]; then
              "$@"
            else
              ./scripts/run-with-watchdog.sh "$budget" "$@"
            fi
          }
          guard ci_resource_limits_swiftpm build \
            --disable-automatic-resolution \
            --target BurinApp
          guard ci_resource_limits_swiftpm build \
            --disable-automatic-resolution \
            --product burin
          xcrun swift .github/checks/macos-sqlite-linkage.swift \
            --binary "$(swift build --show-bin-path)/burin"
      - name: Test BurinApp
        id: app-tests
        if: needs.changes.outputs.swift_app_tests_selected == 'true'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          BURIN_SKIP_KEYCHAIN: "1"
          FULL_RESULT: ${{ steps.full.outcome }}
        run: |
          set -euo pipefail
          if [ "$FULL_RESULT" = success ]; then
            echo "BurinAppTests passed in the macOS-bound Swift suite"
            exit 0
          fi
          source ./scripts/ci-resource-limits.sh
          ./scripts/run-with-watchdog.sh 1500 \
            ci_resource_limits_swiftpm test \
            --disable-automatic-resolution \
            --parallel \
            --skip UITests \
            --filter BurinAppTests

      - name: Run subprocess integration tests
        id: integration
        if: needs.changes.outputs.swift_integration_selected == 'true'
        # Same watchdog backstop as the required job. The opt-in flag unlocks
        # the tests gated by SubprocessIntegrationTestSupport; the shared CI
        # policy registry scopes the run to exactly those tests so this lane
        # stays fast. A structural census rejects unregistered requireOptIn
        # call sites. Run them
        # serially: each case starts real Harn subprocesses, and parallel test
        # execution can starve a child past its own watchdog on the standard
        # four-core hosted Mac. The 608-second cold compile dominates this job,
        # so serial execution is cheaper than rebuilding after a false failure.
        # A bounded
        # retry self-heals a transient harn/harn-lsp SIGBUS or watchdog timeout.
        # Deterministic test failures exit immediately instead of paying for
        # two identical rebuild/test attempts.
        #
        # `--parallel` with SWIFT_TEST_WORKERS=1 keeps that serial execution
        # while routing through SwiftPM's parallel test runner — the only code
        # path that writes the XCTest xunit report. A serial `swift test`
        # accepts `--xunit-output` but writes only the `-swift-testing.xml`
        # variant, so the xunit gate below would ENOENT on every run (bc#7136).
        timeout-minutes: 40
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          BURIN_RUN_HARN_SUBPROCESS_TESTS: "1"
          BURIN_TEST_KEYCHAIN: "1"
          SWIFT_TEST_WORKERS: "1"
          FULL_RESULT: ${{ steps.full.outcome }}
          APP_TEST_RESULT: ${{ steps.app-tests.outcome }}
        run: |
          set -euo pipefail
          source ./scripts/ci-resource-limits.sh
          mkdir -p .build
          filter="($(ci_policy_joined_string_array "|" swift_subprocess_integration test_filters))"
          # Environment opt-ins change execution, not compilation. Reuse the
          # test bundle built above when this run selected a unit-test phase.
          build_args=()
          if [ "$FULL_RESULT" = success ] || [ "$APP_TEST_RESULT" = success ]; then
            build_args+=(--skip-build)
          fi
          attempt=1
          max_attempts=3
          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "::group::swift-integration attempt $attempt/$max_attempts"
            set +e
            ./scripts/run-with-watchdog.sh 2400 \
              ci_resource_limits_swiftpm test \
              --disable-automatic-resolution \
              ${build_args[@]+"${build_args[@]}"} \
              --parallel \
              --filter "$filter" \
              --xunit-output .build/integration-test-results.xml
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "::endgroup::"
              node --experimental-strip-types --no-warnings \
                scripts/check-swift-integration-xunit.ts \
                .build/integration-test-results.xml
              echo "swift-integration passed on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$status" -lt 128 ] && [ "$status" -ne 124 ]; then
              echo "swift-integration failed with deterministic exit $status; not retrying"
              exit "$status"
            fi
            echo "swift-integration attempt $attempt exited $status (timeout or signal); retrying"
            attempt=$((attempt + 1))
          done
          echo "swift-integration failed across all $max_attempts timeout/signal attempts"
          exit 1
      - name: Upload integration test results
        if: always() && steps.integration.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-integration-test-results
          path: .build/integration-test-results.xml
          retention-days: 7
      - name: Record the macOS runner receipt
        if: always()
        uses: ./.github/actions/macos-runner-receipt
        with:
          route: ${{ needs.mac-runner-placement.outputs.swift }}
          usd-per-minute: ${{ needs.mac-runner-placement.outputs.swift_usd_per_minute }}

  swift-linux:
    name: Swift build & tests (Linux)
    needs: [changes, harn-prewarm, late-runner-availability]
    if: needs.changes.outputs.swift_linux_selected == 'true'
    # An idle shared self-hosted runner takes this lane first: hosted, it was
    # about 14 billed minutes of every merge-queue run (2026-09-26). The
    # 16-vCPU opt-in still wins when enabled, and a busy or retired pool falls
    # through to the hosted rung, so a reclaimed host strands nothing.
    runs-on: >-
      ${{ (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.late-runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]'))
        || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-8' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-8core') }}
    # A cache hit keeps the paid path within the measured 15-minute steady-state
    # target. The job timeout is a correctness backstop for the first cache miss:
    # the signed 1.07 GB Swift archive has taken ~21 minutes from swift.org on
    # this runner, so a 15-minute outer fuse made cache population impossible.
    timeout-minutes: 75
    env:
      # Mirrors `runs-on` rung for rung. It is needed even off the shared pool
      # because `runner.environment` reports `self-hosted` on Ubicloud: every
      # `runner.environment == 'github-hosted'` guard below would evaluate FALSE
      # there, silently skipping the SwiftPM caches and forcing a cold build on
      # the paid rung.
      BURIN_RUNNER_TIER: >-
        ${{ (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.late-runner-availability.outputs.linux == 'true' && 'self-hosted')
          || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && 'self-hosted' || 'github-hosted') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Clean workspace
        run: ./scripts/ci-clean-workspace.sh
        env:
          RUNNER_ENVIRONMENT: ${{ env.BURIN_RUNNER_TIER == 'self-hosted' && 'self-hosted' || 'github-hosted' }}
      - name: Cache SwiftPM source dependencies
        if: env.BURIN_RUNNER_TIER != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-swift6.3-swiftpm-source-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift6.3-swiftpm-source-
      - name: Cache Linux SwiftPM build artifacts
        if: env.BURIN_RUNNER_TIER != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swift6.3-swiftpm-build-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-swift6.3-swiftpm-build-${{ hashFiles('Package.swift') }}-
      # Toolchain, its cache and the platform-local SwiftPM resolution. The
      # SwiftPM caches above restore first so resolution starts from them.
      - name: Set up Swift 6.3 on Linux
        uses: ./.github/actions/setup-swift-linux
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check native resource trigger coverage
        # Every Swift source/test edit selects this job, including a new
        # resource consumer whose data path is not in either filter yet.
        # Reuse the fetched runtime before paying for native compilation.
        run: ./scripts/harnw run scripts/check-swift-resource-inputs.harn
      - name: Run cross-platform Swift tests (Linux)
        timeout-minutes: 45
        # Keep the Linux Swift gate focused on cross-platform targets. The
        # Exact-case bundle invocations bound XCTest child-process lifetime
        # without broad SwiftPM test runs that can wedge swift-corelibs on
        # Linux. The macOS job remains the authority for BurinAppTests. Recent
        # CI logs showed the post-build exact-case phase running serially for
        # about three minutes, so use two isolated workers to trim wall clock
        # without changing which cases run.
        env:
          SWIFT_RUNTIME_TEST_WORKERS: "2"
        run: ./scripts/run-linux-swift-runtime-tests.sh

  # Backend type-check & test
  server-check:
    name: Server type check & test
    needs: [changes, runner-availability]
    if: needs.changes.outputs.server == 'true'
    # Pure npm pipeline gated by setup-node cache. Use the paid rung rather than
    # the self-hosted pool so cattrick stays free for slow Swift + Harn work.
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || 'ubuntu-24.04') }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: burin_account_erasure_ci
          POSTGRES_USER: burin_ci
          POSTGRES_PASSWORD: burin_ci_fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U burin_ci -d burin_account_erasure_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint src/
      - run: pnpm run format:check
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - name: Prove account erasure against migrated Postgres
        env:
          ACCOUNT_ERASURE_POSTGRES_TEST: "1"
          DATABASE_URL: >-
            postgresql://burin_ci:burin_ci_fixture@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/burin_account_erasure_ci
        run: |
          pnpm run db:migrate
          pnpm exec vitest run src/services/account-erasure-postgres.test.ts

  # Build AND boot the deployed API image.
  #
  # server/Dockerfile had NO build anywhere in CI: the only thing that ever
  # built it was Render, at deploy time. Combined with `autoDeploy: false` in
  # render.yaml, a break in this file surfaced as a failed deploy nobody was
  # watching — five consecutive deploys failed across two days before anyone
  # noticed, because #5065 deleted `.npmrc` while the Dockerfile still COPYed
  # it. Every check on that PR was green, since none of them touched this file.
  #
  # #5321 fixed the build half. This job now runs the container too (#5327),
  # because "the image assembles" and "the API works" are different claims and
  # only the first was being made. A bad ENTRYPOINT, a module that imports
  # cleanly and throws on boot, a migration that fails against a real database,
  # or a production env contract the server rejects at startup all leave
  # `docker build` perfectly green. The Render deploy is still not verified by
  # CI (#5317), so this job is the last place a runtime break can be caught
  # before it reaches the deployed service.
  #
  # Everything the gate does — which Dockerfile, which context, which health
  # path, which env, which Postgres major — is read out of render.yaml, so it
  # cannot silently stop matching what Render deploys. See the header of
  # scripts/verify-server-image.ts for how each step refuses to pass vacuously.
  server-image:
    name: Server image build & boot
    needs: [changes, runner-availability]
    if: needs.changes.outputs.server == 'true'
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This job reaches three runner classes (see `runs-on` above) and runs node
      # without pinning it, so its node came from whichever image answered. Pin
      # it for the same reason as the `actions` job: `--experimental-strip-types`
      # is not optional here, and an image that predates it fails cryptically.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Fails in seconds if the render.yaml parser has degraded, before paying
      # for a docker build. A parser that quietly returns a partial contract is
      # the one way this gate could go green while checking less than it says.
      # npm (not pnpm): the script imports only node builtins, and this job has
      # no pnpm setup — see "Check CI scripts" in the `actions` job.
      - name: Test deploy-contract parser
        run: npm run test:script:verify-server-image
      - name: Build and boot server image
        run: npm run verify:server-image

  # Static site lint, type-check & build
  site-check:
    name: Site lint, type check & build
    needs: [changes, runner-availability]
    if: needs.changes.outputs.site == 'true'
    # Measured 2026-08-06 over 20 PR runs: tornadough p90 0.7m, cattrick p90
    # 10.6m (n=7) — 15x slower on the shared pool's slower host. Hosted mean
    # 1.5m. Free capacity is not free when it costs wall time on the merge
    # path, so this job keeps the two-rung shape. Sibling short jobs that
    # measured faster self-hosted (on tornadough) kept the three-rung ladder
    # in #5909; #5950 already pulled the other measured losers off.
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint 'src/**/*.{ts,tsx}'
      # Every hedge in the data-handling copy must name an open gap issue. The
      # token is what makes the second half work: without it the check can only
      # prove a marker exists, not that the gap it names is still real, so a
      # landed fix would leave stale copy up. It says so out loud when unset.
      - run: pnpm run check:copy-hedges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run format:check
      - run: pnpm exec tsc -b --noEmit
      # Full build (client + SSR + prerender) — the same `pnpm run build` Render
      # runs, so CI catches any regression in the static-site generation.
      - run: pnpm run build
      - run: pnpm exec vitest run

  # Type check the root `scripts/` TypeScript surface.
  #
  # `scripts/tsconfig.json` and `pnpm run typecheck:scripts` both existed before
  # this job, but NOTHING in CI invoked them: the only `pnpm run typecheck` in
  # this workflow runs inside `burin-portal/` (that package's own script), and
  # the root aggregate — the one that includes `typecheck:scripts` — was never
  # called. All 36 `scripts/**/*.ts` files were therefore type-ungated, and the
  # tree being clean on any given day was luck rather than an invariant. Every
  # fresh worktree rediscovering the same diagnostics (#5697) is the symptom of
  # that gap, not of a broken tsconfig.
  #
  # The preflight in `typecheck:scripts` runs first and fails loudly when
  # `@types/node` is absent, because tsc's own behaviour there is to report
  # TS2688 and silently skip every real error in the project (#5726) — a green
  # that measured nothing is the failure class this repo already refuses
  # elsewhere.
  scripts-typecheck:
    name: Scripts type check
    needs: [changes]
    if: needs.changes.outputs.scripts_ts == 'true'
    # This gate normally finishes in 16–27s on hosted runners. Running it on
    # the shared self-hosted pool adds no useful cache locality: cattrick-w1
    # twice stalled inside setup-node's package-cache restore until the whole
    # 10-minute job budget expired (runs 31298269620 and 31298650300). Keep the
    # cheap gate isolated and let the paid rung own its package cache.
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The root install supplies exactly the two packages this gate needs:
      # `typescript` and `@types/node`.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:scripts
      - name: Test the typecheck preflight
        run: pnpm run test:script:preflight-typecheck

  # Rust TUI (crates/burin-tui) — REQUIRED gates for the #1381 flip.
  #
  # Since the Node `tui/` surface was deleted, the `burin` binary IS the Rust
  # TUI. Split the pure UI crates from the harn-linked crates so cheap feedback
  # stays cheap and the heavy gate gets a budget sized only for the harn runtime
  # link path.
  rust-tui-fast:
    name: Rust TUI fast ${{ matrix.label }}
    needs: [changes]
    if: needs.changes.outputs.rust_tui_fast_selected == 'true'
    # The former serial job spent 7m27 compiling clippy and another 6m49
    # compiling tests on a saturated cattrick worker, then hit its 15m ceiling
    # on the next PR. Its Blacksmith control completed both in 31s. These cheap
    # proofs now run in parallel on paid capacity so eval and release builds do
    # not contend with the merge path. The hosted rung remains the fleet-owned
    # kill switch.
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: clippy
            label: fmt + clippy
            components: --component rustfmt --component clippy
          - check: test
            label: test
            components: ""
    # Hosted only while BURIN_CI_PAID_LINUX_PROVIDER is unset. This job was
    # pinned hosted when hosted minutes were credit-covered; since 2026-10-01
    # they are $0.006 a minute in cash, so the provider switch moves it to the
    # Landlock-capable `ubicloud-standard-2` at $0.002 (`[paid_linux_provider]`).
    runs-on: ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-2' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/burin-tui
    env:
      # Test backtraces here don't need full DWARF; dropping test debuginfo
      # trims test-binary size and link time (same knob rust-tui-harn-linked
      # already sets).
      CARGO_PROFILE_TEST_DEBUG: "0"
      BURIN_RUNNER_TIER: >-
        ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && 'self-hosted' || 'github-hosted') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Rust compiler cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/ci-rustc-wrapper.sh configure
        working-directory: .
      - uses: ./.github/actions/setup-rustup
      - name: Toolchain components
        run: |
          rustup toolchain install stable --profile minimal ${{ matrix.components }}
          rustup default stable
          rustc --version
      # Cache cargo deps + the harn-FREE default-members target dir. Ubicloud
      # serves standard cache traffic from next to its runners, and the
      # GitHub-hosted rung benefits from the same cache step. Skipped on our own
      # boxes, which keep a persistent target dir — there, round-tripping it
      # through actions/cache is pure added wall time. #4455 dropped this guard
      # along with the self-hosted rung; restored now that the rung is back.
      # Safe to cache the target here because this builds the lighter harn-free
      # target, NOT the multi-GB harn-linked one (see rust-tui-harn-linked,
      # which deliberately caches registry/git only).
      - name: Cache cargo deps + target (harn-free)
        if: env.BURIN_RUNNER_TIER != 'self-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/burin-tui
          shared-key: rust-tui-fast-${{ matrix.check }}
          # PRs restore; only main writes. Unbounded PR writers evict the
          # warm main archive and pay upload on every rust-tui-fast PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install wrapper script test
        if: matrix.check == 'clippy'
        run: ../../scripts/tests/test_install_tui_wrapper.sh
      - name: TUI cargo target-dir helper test
        if: matrix.check == 'clippy'
        run: ../../scripts/tests/test_tui_cargo_sh.sh
      - name: Machine build slot test
        if: matrix.check == 'clippy'
        run: ../../scripts/tests/test_build_slot_sh.sh
      - name: Isolated app-suite launcher test
        if: matrix.check == 'clippy'
        run: ../../scripts/tests/test_tui_app_suite_sh.sh
      - name: TUI Git build-stamp rebuild test
        if: matrix.check == 'clippy'
        run: ../../scripts/tests/test_tui_git_stamp_rebuild_sh.sh
      - name: Format check
        if: matrix.check == 'clippy'
        run: cargo fmt --all --check
      - name: Clippy (harn-free default-members)
        if: matrix.check == 'clippy'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (harn-free default-members)
        if: matrix.check == 'test'
        run: cargo test
      - name: Rust compiler cache stats
        if: always()
        run: ./scripts/ci-rustc-wrapper.sh stats
        working-directory: .

  # One Harn-owned source-size gate for the Rust and TypeScript product trees.
  # The two scans share checkout/runtime bootstrap instead of paying for two
  # nearly empty jobs, while path filters still skip whichever language did not
  # change. Harn sources run the same command inside the Harn lint worker pool.
  file-length-ratchet:
    name: Source files stay under their length limit
    needs: [changes, harn-prewarm]
    # Runs on pull requests: a ratchet that only measures main tells an author
    # their file grew after it is too late to keep it from growing. Thirty-three
    # seconds hosted (#8757).
    # Measured 2026-08-05 after #5909: 0.45m hosted (n=22) vs 2.48m
    # self-hosted (n=7) — 5.5x slower on the owned pool. Free capacity is
    # not free when it costs wall time on the merge path, so this job keeps the
    # two-rung shape. Its siblings that measured FASTER self-hosted kept the
    # ladder; the split is per job because duration does not predict which way
    # a job goes (Markdown lint is equally short and 1.4x FASTER).
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # BURIN_COMPARISON_BASE_SHA and the Rust and TypeScript merge bases
          # must be in history, not guessed from a shallow checkout.
          fetch-depth: 0
      - name: Fetch Harn runtime
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # These scans execute one standalone Harn script; compiling every
          # product and eval module consumed the job's entire five-minute
          # budget before either ratchet could run.
          precompile: "false"
      # One owner for the three invocations, shared with `pnpm run
      # check:file-lengths` and the pre-push hook. Three workflow steps spelling
      # out three long command lines is how "run the ratchet locally" became
      # "copy a line out of ci.yml". Each scan takes seconds, so they no longer
      # carry per-surface `if:` gates; the job's own gate is the filter.
      - name: Enforce file length limits
        run: ./scripts/check-file-lengths.sh

  # macOS canary for the Rust TUI. `rust-tui-fast` only builds on Linux, so the
  # macOS-only surface — including the app's stop/steer path and the host's
  # Keychain implementation — needs a native test run before main. Gate it to
  # `merge_group`/`push` (not every pull request) to keep the 10x-billed macOS
  # minutes off routine PRs. The harn-free default-members proof remains cheap;
  # the app suite runs separately after the pinned Harn runtime is installed.
  rust-tui-macos:
    name: Rust TUI on macOS (macOS-bound clippy & tests)
    needs: [changes, runner-availability, mac-runner-placement]
    # Match the linked proof's trust boundary before persistent runner dispatch.
    if: >-
      needs.changes.outputs.rust_tui_macos_selected == 'true'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    # Prefer an idle self-hosted macOS runner (the M4 mini pool) to avoid the
    # 10x-billed GitHub-hosted macOS minutes; fall back to a hosted runner when
    # none is available. Same selection the `swift` job uses.
    # Projection of the one routing owner; see the mac-runner-placement job.
    runs-on: ${{ fromJSON(needs.mac-runner-placement.outputs.rust_tui_macos) }}
    # The job queues for a mini instead of falling back to hosted, and a job's
    # timeout starts when it is queued: merge-queue waits for a mini measured
    # p90 52.6 min on 2026-09-26, so the cap covers that wait plus the mini
    # run. A spilled run starts at once and its fuse is what the daily spill
    # cap reserves (bc#9569).
    timeout-minutes: ${{ needs.mac-runner-placement.outputs.rust_tui_macos_spilled == 'true' && 45 || 75 }}
    defaults:
      run:
        working-directory: crates/burin-tui
    # Test backtraces here don't need full DWARF; dropping test debuginfo trims
    # test-binary size and link time (same knob rust-tui-harn-linked already sets).
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # Stamped before checkout so the receipt counts the whole job.
      - name: Stamp the job start
        working-directory: .
        run: echo "BURIN_JOB_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.0'
      - name: Configure Rust compiler cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/ci-rustc-wrapper.sh configure
        working-directory: .
      - name: Isolate public Harn source fetch
        uses: ./.github/actions/harn-public-git
      - uses: ./.github/actions/setup-rustup
      - name: Toolchain components
        run: rustup component add clippy
      # No format check: formatting is platform-independent and rust-tui-fast
      # owns it on Linux.
      - name: Clippy + test (harn-free default-members)
        # Source the shared resource limits so CARGO_BUILD_JOBS (compile) and
        # RUST_TEST_THREADS (libtest execution) are capped on the shared
        # self-hosted mac (up to 4 runners + eval batteries on 18 cores), so
        # this job can't oversubscribe CPU and SIGABRT a sibling. A no-op on
        # GitHub-hosted fallback runners.
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          source ../../scripts/ci-resource-limits.sh
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Set up bundled Harn for app tests
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Only the harn-linked targets whose result can differ on macOS run here:
      # OS-sandbox confinement (Seatbelt here, Landlock on Linux), macOS signal
      # reporting, and the app crate's unit tests, which compile the macOS-only
      # modules. rust-tui-harn-linked runs every engine, app and headless test
      # on Linux, so the rest of the app suite ran twice. `[rust_tui_macos]` in
      # scripts/ci-policy.toml owns the list, and check-ci-script-contracts.sh
      # refuses a macOS-dependent or sandbox-dependent test file missing from it.
      #
      # No skip is allowed. These suites self-skip where the OS sandbox is
      # unavailable, and a Seatbelt proof that skipped here is proved nowhere,
      # so both phases run with --nocapture and refuse any BURIN_TEST_SKIP.
      - name: Test (macOS-bound harn-linked targets)
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          source scripts/ci-resource-limits.sh
          app_root="${RUNNER_TEMP}/burin-tui-app-suite"
          app_args=(--lib)
          app_targets="$(ci_policy_string_array rust_tui_macos app_test_targets)"
          test -n "${app_targets}"
          while IFS= read -r target; do
            app_args+=(--test "${target}")
          done <<< "${app_targets}"
          app_nonproof_args=()
          app_nonproof="$(ci_policy_string_array rust_tui_macos app_library_nonproof_cases)"
          while IFS= read -r name; do
            test -n "${name}"
            app_nonproof_args+=(--skip "${name}")
          done <<< "${app_nonproof}"
          make test-app ARGS="--root ${app_root} ${app_args[*]} -- --nocapture ${app_nonproof_args[*]}"
          engine_args=()
          engine_targets="$(ci_policy_string_array rust_tui_macos engine_test_targets)"
          test -n "${engine_targets}"
          while IFS= read -r target; do
            engine_args+=(--test "${target}")
          done <<< "${engine_targets}"
          engine_log="${RUNNER_TEMP}/rust-tui-macos-engine.log"
          ./scripts/tui-cargo.sh test -p burin-tui-engine "${engine_args[@]}" \
            -- --nocapture 2>&1 | tee "${engine_log}"
          for log in "${app_root}/cargo-test.log" "${engine_log}"; do
            if [ ! -s "${log}" ]; then
              echo "::error::${log} is absent or empty; the macOS-bound targets were not measured" >&2
              exit 1
            fi
          done
          if grep -E 'BURIN_TEST_SKIP name=|running 0 tests|test result: ok\. 0 passed|; [1-9][0-9]* ignored;' "${app_root}/cargo-test.log" "${engine_log}"; then
            echo "::error::a macOS-bound suite skipped or ran zero tests; it is proved nowhere else" >&2
            exit 1
          fi
        working-directory: .
      - name: Clear public Harn git isolation
        uses: ./.github/actions/clear-harn-git-config
      - name: Rust compiler cache stats
        if: always()
        run: ./scripts/ci-rustc-wrapper.sh stats
        working-directory: .

  # Heavy Rust TUI gate. The harn-linked crates pull the public
  # `burin-labs/harn` git-tag dependency and statically link the harn runtime.
  # This is the most expensive Linux lane in the repo, so it takes the same
  # three-rung ladder as rust-tui-fast. The x64 pin is load-bearing on every
  # rung: this job uploads the `burin-linux` binary for eval-canary reuse on
  # main pushes, and ARM would produce an artifact the current x86_64 Linux
  # consumers cannot execute. The public-Harn composite replaces ambient Git
  # configuration with an empty job-local file, so stale credentials or URL
  # rewrites on a shared runner cannot redirect the dependency fetch.
      - name: Record the macOS runner receipt
        if: always()
        uses: ./.github/actions/macos-runner-receipt
        with:
          route: ${{ needs.mac-runner-placement.outputs.rust_tui_macos }}
          usd-per-minute: ${{ needs.mac-runner-placement.outputs.rust_tui_macos_usd_per_minute }}
  rust-tui-harn-linked:
    name: Rust TUI harn-linked clippy, test & build
    # The Linux hygiene prerequisite is the single cold owner for the released
    # runtime and product bytecode caches. Wait for its post-job cache save
    # before this lane restores the same bundle for linked product tests.
    needs: [changes, harn-prewarm, late-runner-availability]
    # Pull request heads from forks must not execute on persistent owned runners.
    # A skipped proof remains required by CI status, so a fork cannot merge
    # through this path without an explicitly isolated runner route.
    if: >-
      needs.changes.outputs.rust_tui_harn_linked_selected == 'true'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    # Exact source pins already require the durable big-build fleet for hygiene
    # and repin rehearsal. Keep the linked product proof on that same resource
    # class: a paid-primary snapshot can otherwise queue indefinitely even after
    # the exact runtime has been prepared, defeating its four-minute median
    # advantage. Released pins retain the measured ladder below.
    #
    # Blacksmith Linux was retired on 2026-10-02 (`[paid_linux_provider]`); the
    # Blacksmith figures below are the history this ladder was built on.
    #
    # Production receipts on the released-pin graph, Aug 2026: Blacksmith 16-vCPU
    # median 6.8m (n=4), tornadough median 11.0m (n=10), Blacksmith 8-vCPU
    # median 9.8m (n=4), and cattrick 16.4m (n=2). The explicit paid-primary
    # variable buys about four median minutes over the free route; unset it to
    # prefer tornadough. Existing kill switches retain free, standard paid, and
    # GitHub-hosted recovery paths.
    #
    # The `harn-ci-big` rung below the availability snapshot exists because a
    # busy fleet is a reason to QUEUE, not a reason to start this job somewhere
    # it cannot finish. The rung above it consults idle capacity, so on a loaded
    # fleet it declines and the ladder used to fall straight to `ubuntu-latest`.
    # The harn-linked compile does not survive there: measured on this job,
    # three runs on a 4-core hosted runner were killed mid-`Compile harn-linked
    # tests` at 21, 22 and 63 minutes with no log ever uploaded, against a
    # 6-minute median on a 16-vCPU box. A last rung that guarantees a red rather
    # than a wait is not a fallback. Waiting for a big self-hosted slot costs
    # queue time and nothing else, so take it whenever self-hosted capacity
    # exists at all, and keep `ubuntu-latest` only for the case where the whole
    # self-hosted fleet is switched off.
    #
    # `ubuntu-latest` is gone from this ladder and is not coming back. A hosted
    # standard runner cannot hold this compile: two runs on 2026-09-06 died at
    # 20m24s and 20m46s with the runner's own
    # `System.IO.IOException: No space left on device`, mid-`Compile harn-linked
    # tests`, with no log uploaded and no cleanup step run. The two steps that
    # would have bounded the target directory, the sticky disk mount and the
    # 15 GiB cap, are both gated on the Blacksmith tier and skip there, so
    # nothing bounds it at all. That is a disk ceiling, not a duration problem,
    # and no cache change fixes it. The ladder therefore ends on the big
    # self-hosted class: waiting for a slot costs queue time, which is recoverable,
    # while a hosted start costs twenty minutes and a red that means nothing.
    #
    # An opt-in rung for the organization's hosted 8 vCPU / 32 GB Ubuntu 24.04
    # pool, off by default. It is here because the question "what would the
    # hosted pool cost us" should have an answer in the tree rather than being
    # re-measured by whoever asks next (#8868).
    #
    # The answer is that it costs about 2.1x. One complete run took 19m52s
    # against 9m13-9m17s on the paid 16-vCPU pool over the three preceding main
    # runs. Cores are not the reason: the sticky volume that keeps a warm cargo
    # target is a paid-tier product and cannot mount on hosted capacity, so this
    # rung compiles cold every run. Measured per step, paid against hosted:
    # build 21s / 3m56s, clippy 16s / 1m56s, pipeline precompile 1m03s / 2m04s,
    # linked test compile 41s / 41s. Capacity on the pool is a queue of four,
    # not a failure mode: a fifth job waits rather than landing undersized.
    #
    # On the disk ceiling that killed two `ubuntu-latest` attempts: the same
    # missing sticky volume means there is no warm target to bound on entry,
    # which is why the before-build cap stays paid-only rather than being
    # extended into a step that cannot fail. What binds here binds. The
    # after-build cap runs on this rung, and the compile is gated on measured
    # disk headroom, which refuses rather than being killed with no log.
    #
    # An idle owned big runner comes first, ahead of the paid preference
    # (`[linux_owned_first]`, bc#9618). From 2026-09-28 to 10-01 every one of
    # 648 runs of this job took the 16-vCPU paid box, $311 and 38% of the
    # Blacksmith bill, and 281 of them were routed while the late probe counted
    # an idle `harn-ci-big` runner. In merge groups this job finished at least
    # 11 minutes before the run's last job in 90% of runs, so the slower owned
    # box does not move the queue's wall time.
    runs-on: >-
      ${{ (vars.BURIN_CI_LINUX_OWNED_FIRST == 'true' && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_big.idle >= 1 && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-big"]'))
        || (vars.BURIN_CI_ENABLE_HOSTED_RUST_TUI_HARN_LINKED == 'true' && 'ubuntu-8core')
        || (vars.BURIN_CI_HEAVY_PREFER_PAID == 'true' && github.event_name != 'pull_request' && (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-16' || 'ubuntu-8core'))
        || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.changes.outputs.harn_source_revision != 'false' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_big.eligible && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-big"]'))
        || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.late-runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]'))
        || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-big"]'))
        || 'ubuntu-8core' }}
    # Paid capacity keeps a spend fuse. Exact `.harn-revision` source builds
    # need room for a cold harn-cli install before clippy/tests start, so the
    # fuse is wider than a warm released-pin median. Free and GitHub-hosted
    # routes retain the wider correctness backstop. The idle owned rung is
    # free capacity, so it is excluded first and always takes the backstop.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: crates/burin-tui
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Line tables, not full debug info: a native crash in a linked test
      # (#9263) prints `binary(+offset)` frames, and only line tables in the
      # exact binary that ran turn those into file:line. The binary is
      # uploaded on failure by "Upload the burin binary the tests ran".
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # Compile parallelism follows the same ladder as `runs-on`. The hosted
      # fuse of 4 is a 7 GiB / shared-box cap, not a property of this gate.
      # Applying it on blacksmith-16vcpu left the paid box half-idle for the
      # 105s clippy + 119s test-compile stretch (PR run 32657380523).
      CI_RUSTC_WRAPPER: "off"
      # The hosted rung carries the new pool's core count, because compile
      # parallelism follows `runs-on` rung for rung.
      CARGO_BUILD_JOBS: >-
        ${{ (vars.BURIN_CI_LINUX_OWNED_FIRST == 'true' && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_big.idle >= 1) && '4'
          || (vars.BURIN_CI_ENABLE_HOSTED_RUST_TUI_HARN_LINKED == 'true') && '8'
          || (vars.BURIN_CI_HEAVY_PREFER_PAID == 'true' && github.event_name != 'pull_request' && (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && '16' || '8'))
          || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.changes.outputs.harn_source_revision != 'false' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_big.eligible) && '4'
          || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.late-runner-availability.outputs.linux == 'true') && '4'
          || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true') && '4'
          || '8' }}
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # See rust-tui-fast for why this exists and why it must mirror `runs-on`.
      BURIN_RUNNER_TIER: >-
        ${{ (vars.BURIN_CI_LINUX_OWNED_FIRST == 'true' && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_big.idle >= 1 && 'self-hosted')
          || (vars.BURIN_CI_ENABLE_HOSTED_RUST_TUI_HARN_LINKED == 'true') && 'github-hosted'
          || (vars.BURIN_CI_HEAVY_PREFER_PAID == 'true' && github.event_name != 'pull_request' && (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud' || 'github-hosted'))
          || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.changes.outputs.harn_source_revision != 'false' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_big.eligible) && 'self-hosted'
          || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.late-runner-availability.outputs.linux == 'true') && 'self-hosted'
          || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true') && 'self-hosted'
          || 'github-hosted' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Own this run's Burin home
        # `burin headless` keeps user-scoped agent context in a
        # schema-versioned session store under `BURIN_HOME`, which defaults to
        # the runner user's `~/.burin` — one file shared by every burin-code
        # lane a self-hosted runner ever executes. Lanes pinned to different
        # Harn versions then fight over its schema; on 2026-08-01 that took
        # `session/prompt` down in five open PRs at once. Keying on run id and
        # attempt keeps sequential jobs in one runner slot disjoint too. This
        # is a step rather than job-level `env:` because the `runner` context
        # is not available there — using it fails the whole workflow at
        # startup, before a single job runs.
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/burin-ci-home/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$home"
          echo "BURIN_HOME=$home" >> "$GITHUB_ENV"
        working-directory: .
      - name: Configure Rust compiler cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/ci-rustc-wrapper.sh configure
        working-directory: .
      # This deliberately poisons the prior global config. The public-source
      # action must replace it before the first Harn fetch.
      - name: Install hostile ambient Git rewrite falsifier
        run: |
          set -euo pipefail
          hostile_config="${RUNNER_TEMP}/hostile-harn-gitconfig"
          git config --file "${hostile_config}" \
            url.https://harn-public-fetch.invalid/.insteadOf \
            https://github.com/
          printf 'GIT_CONFIG_GLOBAL=%s\n' "${hostile_config}" >> "${GITHUB_ENV}"
        working-directory: .
      - name: Isolate public Harn git access
        uses: ./.github/actions/harn-public-git
      - uses: ./.github/actions/setup-rustup
      - name: Toolchain components
        timeout-minutes: 5
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - name: Install mold linker
        run: |
          set -euo pipefail
          if command -v mold >/dev/null 2>&1; then
            mold --version
            exit 0
          fi
          # Blacksmith's mirror list can retain an unreachable first choice for
          # minutes. Bound each mirror attempt so apt can reach its fallback.
          APT_NETWORK_OPTS=(-o Acquire::Retries=0 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
          sudo apt-get "${APT_NETWORK_OPTS[@]}" update
          sudo apt-get "${APT_NETWORK_OPTS[@]}" install -y mold
          mold --version
      # Cache cargo registry/git deps through the normal archive cache, which
      # Ubicloud serves transparently and the GitHub-hosted fallback needs too.
      # The multi-GB harn-linked target dir is deliberately not archived.
      - name: Cache cargo registry + git deps
        # Not on our own boxes: they keep ~/.cargo warm, and uploading that
        # persistent cache through actions/cache can dominate job wall time.
        if: env.BURIN_RUNNER_TIER != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-burin-tui-harn-linked-v2-${{ hashFiles('crates/burin-tui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-burin-tui-harn-linked-v2-
      # The linked app tests exercise product paths that launch the bundled
      # runtime. Install it once before libtest starts: otherwise parallel
      # tests can all fall back to harnw and race its lazy fetch/replace path.
      # The later interactive smoke reuses this same verified projection.
      - name: Set up bundled Harn for linked tests and interactive smoke
        # Source pins cold-build harn-cli; released pins finish in seconds.
        timeout-minutes: 90
        uses: ./.github/actions/fetch-harn
      - name: Prove exact public Harn revision access
        env:
          HARN_EGRESS_ALLOW: github.com
          HARN_EGRESS_DEFAULT: deny
        run: >-
          ./scripts/harnw run
          --allow-process-network
          --read-only-root "${RUNNER_TEMP}"
          --sandbox-read-root "${RUNNER_TEMP}"
          scripts/verify-public-harn-fetch.harn -- "${GIT_CONFIG_GLOBAL}"
        working-directory: .

      # ARTIFACT FIRST, and the order is the whole point. `burin-linux` is the
      # binary the pull request reviewer and the eval canary reuse instead of
      # compiling their own, and it used to be published at the very END of
      # this job. On main CI run 34867834424 that put it 26 minutes into the
      # run, while producing it cost 23 seconds: 15 to build and 8 to upload.
      # The nine intervening minutes were clippy, the pipeline precompile and
      # the test phases, none of which the binary needs. Every consumer that
      # scanned during those minutes found nothing and paid its own cold build,
      # roughly 494 s for a review. See bc#8687.
      #
      # What gates the upload is UNCHANGED. The build, the interactive TUI
      # smoke and the upload move together and stay in that order, so the
      # artifact is still published only after the binary has driven a real
      # Harn terminal session, and still only on a main push.
      - name: Require disk headroom for the linked compile
        # The shared owner does the reading, the floor check and the failure
        # path; this boundary only names its stage and its floor. This job has
        # twice been killed mid-compile by a full disk with no log uploaded and
        # no cleanup step run, which is the exact shape that helper exists for.
        #
        # The floor is derived from what this job writes, not guessed. The
        # cargo target is the largest item: measured 14.68 GiB after the build
        # on the 8 vCPU pool, and the after-build cap holds it at 15 GiB. The
        # toolchain, the cargo registry, the bundled Harn runtime and the
        # per-run state under RUNNER_TEMP have each been a small fraction of
        # that. 40 GiB is that ceiling plus room for the rest and roughly
        # double for margin.
        #
        # Both ends are checked against observation. The hosted pool reported
        # 368-369 GiB free here, so the floor is about nine times clear of a
        # healthy runner and cannot red an ordinary one; the standard hosted
        # runner that died twice had on the order of 14 GiB, less than the
        # target directory alone, so the floor refuses that class of host. A
        # floor that could only do one of the two would be decoration.
        if: env.BURIN_RUNNER_TIER != 'self-hosted'
        working-directory: .
        run: |
          scripts/ci/require-disk-headroom.sh \
            --stage linked-compile \
            --floor-gib 40 \
            --path "${{ github.workspace }}" \
            --consumer-root "${{ github.workspace }}/crates/burin-tui/target" \
            --consumer-root "${HOME}/.cargo" \
            --consumer-root "${HOME}/.rustup"
      - name: Build burin bin
        timeout-minutes: 12
        env:
          RUNNER_ENVIRONMENT: ${{ env.BURIN_RUNNER_TIER == 'self-hosted' && 'self-hosted' || 'github-hosted' }}
        run: |
          set -euo pipefail
          source ../../scripts/ci-resource-limits.sh
          cargo build --locked --profile test -p burin-tui-app --bin burin
      - name: Drive the interactive TUI through Harn terminal sessions
        timeout-minutes: 5
        working-directory: .
        run: |
          set -euo pipefail
          BURIN_PIPELINE_INPUT_JSON="$(
            jq -nc --arg workspace "$GITHUB_WORKSPACE" '{
              binary: ($workspace + "/crates/burin-tui/target/debug/burin"),
              mode_pipeline: ($workspace + "/Sources/BurinCore/Resources/pipelines/mode/auto.harn"),
              mock_fixture: ($workspace + "/Sources/BurinCore/Resources/pipeline-tests/tests/fixtures/tui-smoke-reply.jsonl"),
              harn_binary: ($workspace + "/Sources/BurinCore/Resources/bin/harn")
            }'
          )"
          export BURIN_PIPELINE_INPUT_JSON
          Sources/BurinCore/Resources/bin/harn run --no-sandbox --timeout 3m \
            Sources/BurinCore/Resources/pipelines/infra/tui-smoke.harn
      # Reuse this already-compiled burin binary (it hosts the `headless`
      # eval subcommand) for the eval-canary workflow instead of making the
      # canary pay a fresh ~15-25 min cold cargo build. Only on main pushes —
      # PRs don't need it and would just accrue storage. This job is already
      # gated on `changes.outputs.rust-tui`, so the artifact is only
      # (re)built+uploaded when material TUI/Rust code actually changes.
      # Uploaded on main for the eval canary, and on every run where the
      # calibration replay will consume it. The replay measures the reviewer
      # under review, so it takes THIS head's binary and never one published
      # from an earlier commit.
      - name: Upload burin for eval-canary reuse
        if: >-
          (github.ref == 'refs/heads/main' && github.event_name == 'push')
          || github.event_name == 'merge_group'
          || needs.changes.outputs.review_calibration == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burin-linux
          path: crates/burin-tui/target/debug/burin
          retention-days: 14
          if-no-files-found: error

      # Heavy lane: the harn-linked crates (engine/app/headless). Keep clippy
      # separate from tests and link the real bins with the same no-debug test
      # profile so the gate still catches binary link regressions without
      # paying the default dev-profile debug-info cost.
      # Source the shared resource limits so explicit CARGO_BUILD_JOBS is
      # validated and RUST_TEST_THREADS stays predictable if this job is ever
      # dispatched from a self-hosted fork of the workflow.
      #
      # Derive it from the resolved tier, NOT from `runner.environment`: the
      # Ubicloud and GitHub rungs are both dedicated single-tenant capacity
      # and want the hosted caps, while our own shared boxes want the
      # self-hosted caps and the raised nofile limit. `runner.environment`
      # reports `self-hosted` on Ubicloud and so cannot express that split;
      # #4455 worked around it by hardcoding `github-hosted`, which silently
      # dropped the real caps on the self-hosted rung it had just removed.
      - name: Clippy (harn-linked crates)
        timeout-minutes: 20
        env:
          RUNNER_ENVIRONMENT: ${{ env.BURIN_RUNNER_TIER == 'self-hosted' && 'self-hosted' || 'github-hosted' }}
        run: |
          set -euo pipefail
          source ../../scripts/ci-resource-limits.sh
          cargo clippy -p burin-tui-engine -p burin-tui-app -p burin-tui-headless --all-targets -- -D warnings
      - name: Precompile Harn pipelines before parallel linked tests
        # Use the shared manifest-authorized precompiler to build each graph
        # once. The parallel Rust tests then consume the adjacent immutable
        # artifacts when available.
        #
        # This is a warm-start optimization, not the correctness gate: a
        # source tree contains reusable libraries as well as standalone entry
        # points, and Harn intentionally allows standalone-incompatible
        # libraries to fall back to runtime compilation. The linked tests
        # below remain authoritative for the product path.
        timeout-minutes: 10
        env:
          RUNNER_ENVIRONMENT: ${{ env.BURIN_RUNNER_TIER == 'self-hosted' && 'self-hosted' || 'github-hosted' }}
          HARN_CACHE_DIR: ${{ github.workspace }}/.blacksmith/harn-cache
        run: |
          set -euo pipefail
          source ../../scripts/ci-resource-limits.sh
          # shellcheck source=../../scripts/lib/precompile-pipelines.sh
          source ../../scripts/lib/precompile-pipelines.sh
          mkdir -p "${HARN_CACHE_DIR}"
          precompile_harn_tree \
            ../../Sources/BurinCore/Resources/bin/harn \
            ../../Sources/BurinCore/Resources/pipelines \
            ../../Sources/BurinCore/Resources/pipelines/.precompile-stamp
      - name: Compile harn-linked tests
        id: compile-linked
        # Preserve the paid spend fuse while allowing slower cheap routes to
        # complete a cold linked-runtime build.
        timeout-minutes: 90
        env:
          RUNNER_ENVIRONMENT: ${{ env.BURIN_RUNNER_TIER == 'self-hosted' && 'self-hosted' || 'github-hosted' }}
          HARN_CACHE_DIR: ${{ github.workspace }}/.blacksmith/harn-cache
        run: |
          set -euo pipefail
          source ../../scripts/ci-resource-limits.sh
          mkdir -p "${HARN_CACHE_DIR}"
          cargo test --no-run -p burin-tui-engine -p burin-tui-app -p burin-tui-headless
      - name: Warm the linked Harn bytecode cache
        # CLI `harn precompile` stamps adjacent .harnbc with the bundled CLI
        # codegen fingerprint. The linked burin runtime is a different
        # compiler, so those artifacts miss and every agent test compiles the
        # graph. Two concurrent compiles have independently hit the 60s
        # inactivity limit on 16-vCPU. One serial linked-runtime turn fills
        # HARN_CACHE_DIR before parallel lanes start. No extra step fuse: the
        # child already has 180s/60s budgets, and the duration-limit census
        # forbids growing hand-set timeouts on this file.
        env:
          RUNNER_ENVIRONMENT: ${{ env.BURIN_RUNNER_TIER == 'self-hosted' && 'self-hosted' || 'github-hosted' }}
          HARN_CACHE_DIR: ${{ github.workspace }}/.blacksmith/harn-cache
        run: |
          set -euo pipefail
          source ../../scripts/ci-resource-limits.sh
          mkdir -p "${HARN_CACHE_DIR}"
          cargo test -p burin-tui-app --test output_contract -- \
            --test-threads=1 --exact headless_prompt_resolves_staged_provider_credential_without_interactive_ui
      # A setup-python interpreter on a self-hosted rung lives outside the
      # rpath it was built for and needs LD_LIBRARY_PATH, which the agent's
      # command environment does not pass through, so the typed test-scope
      # verifier exited 127. Self-hosted rungs use the system python3 instead,
      # with pytest from a job-local venv when the image lacks it.
      - if: ${{ env.BURIN_RUNNER_TIER != 'self-hosted' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install typed test-scope verifier
        run: |
          set -euo pipefail
          if [ "${BURIN_RUNNER_TIER}" != self-hosted ]; then
            python -m pip install pytest
          elif ! python3 -m pytest --version >/dev/null 2>&1; then
            # This existing toolchain-store root is admitted by the same
            # sandbox policy as the fixture. Runner temp is outside that policy.
            venv="${HOME}/.local/share/virtualenvs/burin-typed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
            echo "BURIN_TYPED_TEST_SCOPE_VENV=${venv}" >> "${GITHUB_ENV}"
            python3 -m venv "${venv}"
            "${venv}/bin/python" -m pip install pytest
            echo "${venv}/bin" >> "${GITHUB_PATH}"
          fi
      - name: Check typed test-scope verifier
        run: python3 -m pytest --version
      - name: Test (harn-linked crates)
        id: harn-linked-test
        # Compile and execution have separate fuses. A released Harn repin
        # invalidates the test profile; folding that cold compile into this
        # step exhausted 30m and 45m without identifying a failing test.
        #
        # The fuse follows the runner class, because a flat one cannot fit both
        # ends of the ladder above. Measured on THIS job (see the runs-on
        # comment): Blacksmith 16-vCPU median 6.8m, tornadough 11.0m, cattrick
        # 16.4m. A flat 20 leaves the slowest rung 3.6 minutes of headroom, so
        # ordinary variance reds it. Observed 2026-09-06 on main f840510c5f:
        # routed to cattrick-w1, killed here at 20m having finished 16 of 40
        # suites with 1227.9s of test time, against 40 suites and 251.8s on
        # blacksmith-16vcpu 24 minutes earlier at 14677dfe82. Every suite ran
        # 3.3x-6.7x slower INCLUDING a 748-case hermetic unit suite, which is
        # what identifies it as the host rather than the code: no test failed,
        # and the job reported a step timeout, not a failure.
        #
        # Keyed on BURIN_RUNNER_TIER rather than a second copy of the ladder.
        # That variable is already the one projection of `runs-on`, rung for
        # rung, so the fuse cannot drift out of step with the class it is
        # sizing. The outer job fuse (75 paid / 120 self-hosted) is unchanged
        # and still bounds the whole job.
        timeout-minutes: 45
        env:
          RUNNER_ENVIRONMENT: ${{ env.BURIN_RUNNER_TIER == 'self-hosted' && 'self-hosted' || 'github-hosted' }}
          # The step fuse above is not the only wall-clock literal this job runs
          # into. `agent_context_store_isolation` asserts a prompt-liveness
          # ceiling in its own source, and a flat one has the same defect for
          # the same reason: measured with a mock model, so with no network in
          # the window, that turn takes 19.9-25.3s on the paid class and
          # 46.5-119.3s on cattrick. A single number cannot be both a real alarm
          # on the fast class and survivable on the slow one, and the flat 90
          # failed two unrelated pull requests this morning on runner speed
          # alone. Keyed on the same tier variable as the fuse, from the same
          # budget registry, so the three cannot drift apart.
          BURIN_PROMPT_LIVENESS_DEADLINE_SECONDS: 150
          # Same ladder as CARGO_BUILD_JOBS / runs-on. Hosted recovery stays at
          # one VM. The paid 16-vCPU primary can run four isolated lanes after
          # the linked-runtime cache warmup above.
          # The hosted rung needs its own entry for the same reason the compile
          # parallelism does: this ladder is keyed on the paid and self-hosted
          # rungs, so without one the hosted route falls through to the
          # single-lane recovery value and serialises the suite. Measured cost
          # of that omission on run 35518637123: the test step took 9m20s
          # against 5m10s on the paid pool. Two lanes is the value this policy
          # already gives an 8-vCPU class.
          # A dedicated 16-vCPU Ubicloud runner takes four isolated lanes after
          # the linked-runtime warmup; the tier is read here, not the switch, so
          # the lane count follows the runner the job actually landed on.
          BURIN_HEADLESS_TEST_LANES: >-
            ${{ env.BURIN_RUNNER_TIER == 'ubicloud' && '4'
              || (vars.BURIN_CI_ENABLE_HOSTED_RUST_TUI_HARN_LINKED == 'true') && '2'
              || (needs.changes.outputs.harn_source_revision != 'false' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_big.eligible) && '2'
              || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.late-runner-availability.outputs.linux == 'true') && '2'
              || '1' }}
          HARN_CACHE_DIR: ${{ github.workspace }}/.blacksmith/harn-cache
        run: |
          set -euo pipefail
          source ../../scripts/ci-resource-limits.sh
          mkdir -p "${HARN_CACHE_DIR}"
          # Record the burin binary the suite spawns before it runs. The upload
          # step below re-hashes the file it uploads, so a crash report is
          # symbolized against these exact bytes or says that it cannot be.
          sha256sum target/debug/burin | tee target/burin-under-test.sha256
          # --nocapture so a skip-guarded test's BURIN_TEST_SKIP marker reaches
          # the log — libtest swallows a passing test's stderr otherwise, which
          # is exactly how the old silent skips hid. tee the merged output so
          # the skip check below can inspect it. `set -euo pipefail` above keeps
          # cargo's status authoritative through the pipe: a failing test still
          # fails this step rather than reporting tee's success.
          cargo test -p burin-tui-engine -p burin-tui-app -p burin-tui-headless \
            -- --nocapture 2>&1 | tee "${RUNNER_TEMP}/harn-linked-test.log"
      - name: Remove the job-owned typed test-scope verifier
        if: always() && env.BURIN_TYPED_TEST_SCOPE_VENV != ''
        run: |
          set -euo pipefail
          expected="${HOME}/.local/share/virtualenvs/burin-typed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          [ "${BURIN_TYPED_TEST_SCOPE_VENV}" = "${expected}" ]
          [ ! -L "${expected}" ]
          rm -rf -- "${expected}"
          [ ! -e "${expected}" ]
      # A failed suite keeps the binary it spawned, so a native frame dump on
      # stderr resolves with `addr2line -f -C -i -e burin <offset>`. The
      # `burin-linux` upload above is built before "Compile harn-linked tests"
      # relinks target/debug/burin, so it is not this binary (#9263).
      - name: Verify the burin binary the tests ran
        id: burin-under-test
        if: failure() && steps.harn-linked-test.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ ! -f target/burin-under-test.sha256 ]; then
            echo "the suite never started; no binary to keep"
            exit 0
          fi
          echo "recorded before the suite: $(cat target/burin-under-test.sha256)"
          echo "hashed for upload:         $(sha256sum target/debug/burin)"
          if sha256sum --check --quiet target/burin-under-test.sha256; then
            echo "identical=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::target/debug/burin changed after the suite started, so it is not the binary that ran; not uploading it"
            echo "identical=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Upload the burin binary the tests ran
        if: failure() && steps.burin-under-test.outputs.identical == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burin-linux-under-test
          path: |
            crates/burin-tui/target/debug/burin
            crates/burin-tui/target/burin-under-test.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Fail on unexpected test skips
        # Zero-skip false-green guard. The env-profile pipeline tests and the
        # app slash-command doctor test emit a BURIN_TEST_SKIP marker (via
        # burin_tui_util::test_skip) only when the pinned harn binary or the
        # bundled pipelines are absent. The `Set up bundled Harn` step above
        # puts both on disk, so ZERO skips are expected here and the allowlist
        # is empty on purpose. A marker means fetch-harn regressed in a way
        # that still exits zero (or a new unguarded skip landed) and this lane
        # would otherwise report a false green, so fail loudly.
        #
        # This lane is the one that actually runs: it gates every merge-queue
        # entry and unproven push, so the guard has to live here rather than
        # in a dispatch-only workflow (#6337).
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/harn-linked-test.log"
          if [ ! -s "${log}" ]; then
            echo "harn-linked test log absent/empty; non-zero test evidence was not measured." >&2
            exit 1
          fi
          # Newline-separated allowlist of permitted skip reason slugs. Add a
          # slug here only with a documented, lane-specific justification.
          #
          # os-sandbox-backend-unavailable is allowed HERE and refused in
          # `rust-tui-sandbox-proof`, which runs the same suites on a
          # Landlock-capable host and forbids every skip. This lane may route
          # to the paid image, which has no Landlock, so the confined arms have
          # no mechanism to observe and say so by name. The allowance is only
          # honest because another required job proves the same thing where the
          # mechanism exists: `scripts/ci-policy.toml` records that pairing and
          # a contract refuses this allowance if that job stops existing,
          # stops being required, or gains an allowance of its own.
          allow_reasons="os-sandbox-backend-unavailable"
          fail=0
          while IFS= read -r marker; do
            [ -n "${marker}" ] || continue
            reason="${marker##*reason=}"
            reason="${reason%% *}"
            if printf '%s\n' "${allow_reasons}" | grep -qxF -- "${reason}"; then
              echo "note: allowed test skip (${reason}): ${marker}"
            else
              echo "::error::unexpected test skip in harn-linked lane: ${marker}"
              fail=1
            fi
          done < <(grep -oE 'BURIN_TEST_SKIP name=[^ ]+ reason=[^ ]+' "${log}" || true)
          if [ "${fail}" -ne 0 ]; then
            echo "harn-linked lane skipped test(s) that must run (false-green guard tripped)." >&2
            exit 1
          fi
          passed="$({
            grep -oE 'test result: ok\. [0-9]+ passed' "${log}" || true
          } | awk '{sum += $4} END {print sum + 0}')"
          if [ "${passed}" -le 0 ]; then
            echo "harn-linked lane emitted no non-zero test evidence." >&2
            exit 1
          fi
          echo "harn-linked test evidence: passed=${passed}"
          echo "skip-marker check: no unexpected BURIN_TEST_SKIP markers — all skip-guarded tests ran."
      - name: Rust compiler cache stats
        if: always()
        run: ./scripts/ci-rustc-wrapper.sh stats
        working-directory: .
      - name: Enforce 15 GiB cargo target cache limit after build
        # Also on the hosted rung. There is no sticky volume to carry a bloated
        # target into the next run there, but this is the step that reads the
        # target's size at all, and an over-budget target is the shape of the
        # disk failure this job has died of twice. Reporting it by size beats
        # inferring it from a killed runner. Every vendor VM tier runs it
        # (Ubicloud, GitHub-hosted); only our own boxes, which keep
        # their persistent target and bound it elsewhere, skip it.
        if: >-
          ${{ always() && env.BURIN_RUNNER_TIER != 'self-hosted' }}
        run: ./scripts/enforce-cargo-target-cache-budget.sh --max-gib 15
        working-directory: .

  # The Linux sandbox proof, on a host that has the mechanism it proves.
  #
  # These suites spawn a real child and read confinement out of the child
  # itself, which on Linux means Landlock. Without it they do not fail: they
  # emit a named self-skip and return green, so the wide gate above reported a
  # sandbox proof it never performed on every paid run. Routing that whole gate
  # to the Landlock-capable class would have cost it about four median minutes
  # for one suite's sake, so the suite moves instead. The narrow job takes the
  # mechanism, the wide gate keeps the faster rung, and neither is traded for
  # the other.
  #
  # The suites this job owns are listed in `[runner_kernel_sandbox]` of
  # `scripts/ci-policy.toml` rather than only here, so the wide gate's
  # allowance for their skip slug and this job's refusal of it are two halves
  # of one recorded pairing that a contract checks.
  rust-tui-sandbox-proof:
    name: Rust TUI Linux sandbox proof
    needs: [changes, harn-prewarm, late-runner-availability]
    if: >-
      needs.changes.outputs.rust_tui_harn_linked_selected == 'true'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    # No PAID rung: the paid image has no Landlock, and a host without the
    # mechanism turns the observation into a skip. The last rung is
    # `ubuntu-24.04`, which is a Landlock-capable label in
    # `[runner_kernel_sandbox]` (measured ABI 7), because "no owned capacity"
    # must not mean "this required job queues until the run is cancelled". The
    # rule this job obeys is capability, not ownership, and the hosted runner
    # satisfies it.
    runs-on: >-
      ${{ (fromJSON(needs.late-runner-availability.outputs.capacity).linux_big.eligible
        && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-big"]'))
        || (needs.late-runner-availability.outputs.linux == 'true'
        && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]'))
        || 'ubuntu-24.04' }}
    # The free-route ceiling from `critical_path_capacity`, not a smaller
    # number of its own: this job carries the same 90-minute cold `fetch-harn`
    # step as the gate it was split out of, and a job fuse below its own
    # longest required step turns a cold fetch into a cancellation instead of
    # sandbox evidence. `check_job_fuses_cover_their_steps` enforces that for
    # every job, so the next one cannot reintroduce it.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: crates/burin-tui
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      # Mirrors `runs-on`: `github-hosted` on the last rung, so the shared
      # resource limits and the tier contract read the class this job is
      # actually on rather than the one it prefers.
      BURIN_RUNNER_TIER: >-
        ${{ (fromJSON(needs.late-runner-availability.outputs.capacity).linux_big.eligible
          || needs.late-runner-availability.outputs.linux == 'true')
          && 'self-hosted' || 'github-hosted' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before anything is compiled: a host that lost Landlock names itself
      # here instead of producing a green built out of self-skips.
      - uses: ./.github/actions/require-landlock
      - name: Own this run's Burin home
        # Same reason as the wide gate: `BURIN_HOME` defaults to the runner
        # user's `~/.burin`, which every lane on a self-hosted box would share.
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/burin-ci-home/${{ github.run_id }}-${{ github.run_attempt }}-sandbox"
          mkdir -p "$home"
          echo "BURIN_HOME=$home" >> "$GITHUB_ENV"
        working-directory: .
      - name: Configure Rust compiler cache
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/ci-rustc-wrapper.sh configure
        working-directory: .
      - name: Isolate public Harn git access
        uses: ./.github/actions/harn-public-git
      - uses: ./.github/actions/setup-rustup
      - name: Toolchain components
        timeout-minutes: 5
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Install mold linker
        run: |
          set -euo pipefail
          if command -v mold >/dev/null 2>&1; then
            mold --version
            exit 0
          fi
          APT_NETWORK_OPTS=(-o Acquire::Retries=0 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10)
          sudo apt-get "${APT_NETWORK_OPTS[@]}" update
          sudo apt-get "${APT_NETWORK_OPTS[@]}" install -y mold
          mold --version
      - name: Set up bundled Harn for the linked sandbox suites
        # Source pins cold-build harn-cli; released pins finish in seconds.
        timeout-minutes: 90
        uses: ./.github/actions/fetch-harn
      - name: Run the Linux sandbox suites
        timeout-minutes: 45
        env:
          # Every rung of this job is an owned box, so the runner's own report
          # is the honest source rather than a tier expression that exists to
          # tell paid single-tenant capacity apart from a shared host.
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          source ../../scripts/ci-resource-limits.sh
          log="${RUNNER_TEMP}/sandbox-proof.log"
          cargo test -p burin-tui-engine --test sandbox_profile_optin \
            -- --nocapture 2>&1 | tee "${log}"
          cargo test -p burin-tui-app --test unrestricted_child_authority \
            -- --nocapture 2>&1 | tee -a "${log}"
          cargo test -p burin-tui-app --test review_child_confinement \
            -- --nocapture 2>&1 | tee -a "${log}"
          cargo test -p burin-tui-app --test credential_file_read_deny \
            -- --nocapture 2>&1 | tee -a "${log}"
      - name: Refuse a skipped sandbox arm
        # The whole point of this job. A skip here is not a lane that lacked an
        # input; it is the sandbox proof declining to run on the one host that
        # can perform it, which is indistinguishable from a pass in every other
        # signal the run produces. The allowlist is empty and stays empty.
        if: always()
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/sandbox-proof.log"
          if [ ! -s "${log}" ]; then
            echo "::error::the sandbox suites produced no log; their own step status governs, but a proof with no output is not a proof"
            exit 1
          fi
          if grep -qE 'BURIN_TEST_SKIP name=[^ ]+ reason=[^ ]+' "${log}"; then
            grep -oE 'BURIN_TEST_SKIP name=[^ ]+ reason=[^ ]+' "${log}" | while read -r marker; do
              echo "::error::the Linux sandbox proof skipped an arm: ${marker}"
            done
            exit 1
          fi
          echo "sandbox proof: every arm ran; no BURIN_TEST_SKIP markers."
        working-directory: .
      - name: Rust compiler cache stats
        if: always()
        run: ./scripts/ci-rustc-wrapper.sh stats
        working-directory: .

  # Supply-chain gate for the Rust TUI workspace (cargo-deny) and the
  # release's third-party notices (cargo-about + Package.resolved). REQUIRED.
  #
  # Policy lives in `crates/burin-tui/deny.toml`; reproduce locally with
  # `cargo xtask deny`. cargo-deny only reads `Cargo.lock` + crate metadata, so
  # there is no workspace compile here — the job is cheap and needs no harn auth.
  #
  # Two invocations with deliberately different blocking behavior:
  #   * `check bans licenses sources` is fully deterministic (it only changes
  #     when Cargo.lock / deny.toml change), so it BLOCKS the merge — this is
  #     what catches a new disallowed license, duplicate-crate ban, or an
  #     unreviewed (non-crates.io, non-burin-labs) source.
  #   * `check advisories` reads the RustSec database, which updates
  #     continuously; a brand-new advisory must not red an unrelated PR (that
  #     would deadlock auto-merge), so it is advisory-only (continue-on-error).
  #     A vulnerable/yanked dependency introduced BY a PR still shows up here for
  #     a human to act on, and the scheduled dependency review will catch drift.
  rust-tui-supply-chain:
    name: Rust TUI supply chain (cargo-deny)
    needs: [changes, runner-availability]
    if: needs.changes.outputs.rust_tui_supply_chain == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_all)
    # NEVER the self-hosted pool. This gate downloads a pinned, checksum-verified
    # cargo-deny and runs it against the lockfile: no compile, no toolchain, no
    # cache, nothing the owned workers provide. Queueing for one only exposes it
    # to their backlog, and `timeout-minutes` counts queue wait, so on #8718 it
    # was cancelled after 10m56s with an empty runner name and zero steps.
    #
    # A cancelled required row is not a failure row. It reports COMPLETED with
    # conclusion CANCELLED, so the usual "nothing pending and no FAILURE" read
    # counts it as green and the supply-chain gate simply did not run. The
    # capacity contract holds this routing so an edit cannot quietly restore it.
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || 'ubuntu-24.04') }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/burin-tui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install a pinned, checksum-verified cargo-deny prebuilt binary through
      # the shared cached-tool step. No compile (so no Rust toolchain needed)
      # and no new third-party action dependency. Bump VERSION + SHA256
      # together; the published sidecar is at <url>.sha256.
      - name: Install cargo-deny
        uses: ./.github/actions/cached-tool
        with:
          name: cargo-deny
          version: "0.19.9"
          sha256: "f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af"
          url: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.9/cargo-deny-0.19.9-x86_64-unknown-linux-musl.tar.gz
          binary: cargo-deny
          # The archive is wrapped in one versioned directory.
          strip-components: "1"
      - name: Report the cargo-deny build in use
        working-directory: .
        run: cargo-deny --version
      - name: License / bans / sources gate (deterministic — blocks merge)
        run: cargo-deny --all-features check bans licenses sources
      # Every release generates THIRD-PARTY-NOTICES.txt from these inputs
      # (release.yml, `third-party-notices`). Generating it here makes a change
      # the release could not document, such as a crate license outside
      # about.toml, a Swift package with no license file, or an about.toml that
      # drifted from deny.toml, fail on its own pull request instead of at tag
      # time. Bump VERSION + SHA256 together with the copy in release.yml.
      - name: Install cargo-about
        uses: ./.github/actions/cached-tool
        with:
          name: cargo-about
          version: "0.9.2"
          sha256: "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af"
          url: https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          binary: cargo-about
          strip-components: "1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Third-party notices are generated and current (deterministic — blocks merge)
        working-directory: .
        run: |
          set -euo pipefail
          node scripts/release/third-party-notices.mjs generate --out "${RUNNER_TEMP}/THIRD-PARTY-NOTICES.txt"
          node scripts/release/third-party-notices.mjs verify "${RUNNER_TEMP}/THIRD-PARTY-NOTICES.txt"
      - name: Security advisories (advisory-only — RustSec DB updates continuously)
        continue-on-error: true
        run: cargo-deny --all-features check advisories

  # @burin/cli npm package smoke. Assembles the publishable package (pipelines,
  # provider metadata, and the frozen Harn package boundary; the cross-compiled
  # `burin` binary ships in the per-platform optionalDependency), packs it,
  # runs the postinstall unit test
  # (optional-dep-copy / idempotent / missing-binary) and the install-round-trip
  # smoke (npm install + bin/burin exec via a stubbed binary), and verifies
  # package notices against the canonical release renderer.
  #
  # Linux runs on every PR because it gives the fastest signal for the
  # package tree, postinstall copy, and bin-shim smoke. The macOS and Windows
  # legs moved to `cli-check-macos` / `cli-check-windows` below; same
  # matrix-split pattern as `tui-cross-platform-linux-arm` (#970). Premium
  # platform legs run in merge_group and on path-relevant pushes, while the
  # daily comprehensive run catches cross-surface regressions.
  cli-check:
    name: "@burin/cli build + smoke"
    needs: [changes, late-runner-availability, harn-prewarm]
    if: needs.changes.outputs.cli == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_all)
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    env:
      # The rung `runs-on` resolved to, so the registry restore below can skip
      # our own boxes, which keep ~/.cargo warm.
      BURIN_RUNNER_TIER: >-
        ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && 'self-hosted' || 'github-hosted') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # cargo-about reads every crate's license from its extracted source. On an
      # empty ~/.cargo it first downloads the whole graph (147 MB, 1.2 GB
      # extracted): 78 s against 27 s warm on a Mac, and a slow crates.io pass
      # exceeded the notice render's 300 s deadline (run 36941191604). Restore
      # the harn-linked job's registry cache, which covers the same Cargo.lock;
      # restore only, so this job never competes to upload it.
      - name: Restore cargo registry for the notice render
        if: env.BURIN_RUNNER_TIER != 'self-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-burin-tui-harn-linked-v2-${{ hashFiles('crates/burin-tui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-burin-tui-harn-linked-v2-
      - name: Install cargo-about for canonical notice verification
        uses: ./.github/actions/cached-tool
        with:
          name: cargo-about
          version: "0.9.2"
          sha256: "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af"
          url: https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          binary: cargo-about
          strip-components: "1"
      - name: Fetch Harn package boundary
        uses: ./.github/actions/fetch-harn
        with:
          precompile: "false"
      - name: Assemble @burin/cli package
        run: node npm/cli/tools/build.mjs
      - name: CLI regression tests
        # setup-node supplies npm, while these lightweight package lanes do not
        # install pnpm. Keep this runnable on a fresh hosted image.
        run: npm run cli:test
      - name: Install smoke (npm pack + install + bin/burin exec)
        # Self-contained: the smoke test stands in a fake `burin` binary in the
        # platform package, so no real Rust cross-compile is needed to exercise
        # the postinstall-copy + bin-shim-exec wiring. (Real cross-compiled
        # binaries are produced + smoke-launched in release.yml.)
        run: node npm/cli/test/smoke.mjs

  # macOS @burin/cli smoke. Same steps as `cli-check` above, gated to
  # merge_group / push to main / workflow_dispatch only.
  #
  # Gated on `cli_platform`, NOT `cli`: this lane bills 10x whenever it lands on
  # a hosted runner. The only thing it proves that Linux does not is that
  # postinstall + the `bin/` shim behave on darwin, and that code is entirely
  # under `npm/cli/`.
  #
  # It now prefers a self-hosted Mac with a `macos-15` fallback, same rung as
  # its siblings. The job is ~17 seconds of work but GitHub bills hosted runners
  # by the whole minute, so 38 executions over 3.7 days cost ~38 billed minutes
  # for ~10 minutes of actual compute — the rounding, not the runtime, was the
  # expense. The image pin left the display name because placement is no longer
  # fixed to it; `macos-15` survives as the fallback only.
  cli-check-macos:
    name: "@burin/cli build + smoke (macOS arm64)"
    needs: [changes, runner-availability, mac-runner-placement]
    # `schedule` is in the list deliberately. `npm/cli/**` went untouched for
    # the last 40 commits on `main`, so gating on `cli_platform` alone would
    # leave this lane dormant for months and a darwin postinstall break would
    # surface first at release. The daily backstop (`schedule` forces every
    # surface true) costs ~1 hosted minute a day and bounds that exposure.
    if: needs.changes.outputs.cli_platform_macos_selected == 'true'
    # Projection of the one routing owner; see the mac-runner-placement job.
    runs-on: ${{ fromJSON(needs.mac-runner-placement.outputs.cli_check_macos) }}
    timeout-minutes: 15
    steps:
      # Stamped before checkout so the receipt counts the whole job.
      - name: Stamp the job start
        working-directory: .
        run: echo "BURIN_JOB_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install cargo-about for canonical notice verification
        uses: ./.github/actions/cached-tool
        with:
          name: cargo-about
          version: "0.9.2"
          sha256: "ae72f0df0c399a1e96336f696fa55b1b28679fd725632eba8cf8e4568467cc3e"
          url: https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-aarch64-apple-darwin.tar.gz
          binary: cargo-about
          strip-components: "1"
      - name: Fetch Harn package boundary
        uses: ./.github/actions/fetch-harn
        with:
          precompile: "false"
      - name: Assemble @burin/cli package
        run: node npm/cli/tools/build.mjs
      - name: CLI regression tests
        run: npm run cli:test
      - name: Install smoke (npm pack + install + bin/burin exec)
        run: node npm/cli/test/smoke.mjs

  # Windows @burin/cli smoke. Same steps as `cli-check` above, gated to
  # merge_group / push to main / workflow_dispatch only. Gated on
  # `cli_platform` for the same reason as `cli-check-macos`: `windows-latest`
  # is always hosted and bills 2x, and the win32-specific behavior it proves
  # lives under `npm/cli/`.
      - name: Record the macOS runner receipt
        if: always()
        uses: ./.github/actions/macos-runner-receipt
        with:
          route: ${{ needs.mac-runner-placement.outputs.cli_check_macos }}
          usd-per-minute: ${{ needs.mac-runner-placement.outputs.cli_check_macos_usd_per_minute }}
  cli-check-windows:
    name: "@burin/cli build + smoke (Windows x86_64)"
    needs: [changes]
    # `schedule` included for the same dormancy reason as `cli-check-macos`.
    if: needs.changes.outputs.cli_platform_windows_selected == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Fetch Harn package boundary
        uses: ./.github/actions/fetch-harn
        with:
          precompile: "false"
      - name: Assemble @burin/cli package
        run: node npm/cli/tools/build.mjs
      - name: CLI regression tests
        run: npm run cli:test
      - name: Install smoke (npm pack + install + bin/burin exec)
        run: node npm/cli/test/smoke.mjs

  # Pipeline-bench regression gate (F1' / #815). Runs `--check` against every
  # baseline registered in `bench/pipeline-baselines.json` and fails the job
  # on >10% regression for any metric (wall_ms / first_token_ms /
  # llm_calls / tool_calls).
  # Paths-filtered to keep the cost off PRs that do not touch pipelines or
  # the harness.
  bench-pipelines:
    name: Pipeline-bench regression gate
    needs: [changes, harn-prewarm, late-runner-availability]
    if: needs.changes.outputs.bench_selected == 'true'
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Self-test bench harness
        # Runs the harness's own fake-mode unit + integration tests. Cheap
        # and catches harness bugs before they're paid for by every P-track
        # PR.
        run: ./scripts/harnw test scripts/tests/test_bench_pipeline_harn.harn
      - name: Run registered pipeline-bench checks
        # Iterate every baseline in pipeline-baselines.json and run `--check`.
        # No baselines registered yet is a clean no-op; baselines are
        # populated by P-track PRs as they port subsystems.
        run: |
          set -euo pipefail
          BASELINES=bench/pipeline-baselines.json
          if [ ! -f "$BASELINES" ]; then
            echo "no baselines file; nothing to check"
            exit 0
          fi
          pipelines=$(node -e "const f=require('./bench/pipeline-baselines.json'); for(const k of Object.keys(f.baselines)){console.log(k)}")
          if [ -z "$pipelines" ]; then
            echo "no pipelines registered in $BASELINES yet"
            exit 0
          fi
          fail=0
          while IFS= read -r pipeline; do
            echo "::group::bench-check $pipeline"
            if ! ./scripts/harnw run --no-sandbox scripts/bench-pipeline.harn -- \
              --pipeline "$pipeline" --check --budget 10 --runs 3; then
              fail=1
            fi
            echo "::endgroup::"
          done <<< "$pipelines"
          exit $fail

  # VS Code-compatible extension lint, type-check, test, and VSIX package
  editor-extension-check:
    name: Editor extension lint, type check, test & package
    needs: [changes, runner-availability]
    if: needs.changes.outputs.editor_extension == 'true'
    # Single `npm run package` step; use the paid Linux rung without consuming
    # the shared self-hosted pool.
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editor-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: editor-extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run package

  # Burin workbench portal lint & test (formerly Eval dashboard). The job
  # *display name* below ("Eval dashboard lint & test") is kept stable so
  # existing branch protection rules keyed on that required-check name
  # continue to match. The job-key and working-directory now point at the
  # renamed `burin-portal/` package.
  burin-portal-check:
    name: Eval dashboard lint & test
    needs: [changes, harn-prewarm]
    if: needs.changes.outputs.eval == 'true'
    # Same routing calculus as the other npm-only jobs.
    # Measured 2026-08-05 after #5909: 2.03m hosted (n=10) vs 4.60m
    # self-hosted (n=8) — 2.3x slower on the owned pool. Free capacity is
    # not free when it costs wall time on the merge path, so this job keeps the
    # two-rung shape. Its siblings that measured FASTER self-hosted kept the
    # ladder; the split is per job because duration does not predict which way
    # a job goes (Markdown lint is equally short and 1.4x FASTER).
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    # Covers this job's own longest step: `Fetch harn binaries` allows 20
    # minutes for a cold source pin, and a 15-minute fuse cancelled the job
    # before that step could reach its own ceiling.
    # `check_job_fuses_cover_their_steps` now refuses that shape everywhere.
    timeout-minutes: 50
    defaults:
      run:
        working-directory: burin-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: burin-portal/pnpm-lock.yaml
      # The transcript-qualification tests spawn the pinned Harn runtime
      # through ./scripts/harnw (Harn owns transcript semantics; the portal is
      # a thin reader), so this job needs the harn binary fetched too.
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test

  # Eval catalog integrity check. Runs the case<->fixture<->verify consistency
  # tests (including the hollow-pass / unscoped-ctest / shape-only-verify
  # detectors) whenever scripts/eval-cases.json — or the checks themselves —
  # change. These are pure Harn tests that lint the catalog's structure; the
  # fixture-dependent assertions self-skip when the burin-examples checkouts are
  # absent (as on a hosted runner), so the check needs only the Harn binary, not
  # the example repos. This is the check that makes a hollow/gameable `verify`
  # fail CI: before it existed, eval-cases.json was in no path filter and no job
  # ran test_eval_catalog_harn.harn / test_case_fixture_consistency_harn.harn.
  eval-catalog-shards:
    name: Eval catalog contract
    needs: [changes, harn-prewarm, late-runner-availability]
    if: needs.changes.outputs.eval_catalog_shards_selected == 'true'
    # Fetch-heavy Harn consumers must use the measured fetch capability, not
    # generic Linux availability. On run 31299304681, cattrick-w3 was idle but
    # unable to download either Harn or actions/cache; shard 3 never reached
    # its test before the 12-minute job envelope expired. The harn-fetch-ok
    # label is the shared boundary that keeps degraded hosts out of this lane.
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    # Match the cold-fetch envelope owned by Harn lint. The shard itself keeps
    # a separate eight-minute execution budget below.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Eval catalog contract suite
        timeout-minutes: 8
        run: |
          ./scripts/harnw test scripts/tests/test_eval_catalog_harn.harn \
            scripts/tests/test_eval_catalog_expected_failure_harn.harn \
            scripts/tests/test_eval_expected_failure_oracles_harn.harn \
            scripts/tests/test_eval_verify_phases_harn.harn \
            scripts/tests/test_precise_refactor_catalog_harn.harn \
            scripts/tests/test_eval_rubric_task_scope_harn.harn \
            scripts/tests/test_eval_sentinel_contract_harn.harn \
            scripts/tests/test_answer_key_diagnostic_harn.harn \
            --parallel \
            --timing

  eval-catalog-check:
    name: Eval catalog integrity
    needs: [changes, harn-prewarm]
    if: needs.changes.outputs.eval_catalog == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_all)
    # This is structural validation only; golden replay remains self-hosted.
    # Measured 2026-08-05 after #5909: 1.73m hosted (n=10) vs 3.20m
    # self-hosted (n=8) — 1.9x slower on the owned pool. Free capacity is
    # not free when it costs wall time on the merge path, so this job keeps the
    # two-rung shape. Its siblings that measured FASTER self-hosted kept the
    # ladder; the split is per job because duration does not predict which way
    # a job goes (Markdown lint is equally short and 1.4x FASTER).
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    # The suite-level steps below own the real budget. Keep the job envelope
    # larger than their sum so failures report the specific slow contract.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Eval coverage contract
        timeout-minutes: 3
        run: ./scripts/harnw run lora-corpus/eval_coverage.harn -- --check --min-covered 98
      - name: Eval task contract
        run: npm run test:script:eval-task-contract
      - name: Precise refactor oracle controls
        timeout-minutes: 3
        run: pnpm run test:script:precise-refactor-oracle
      - name: Eval golden self-test contract
        # 19 sequential cases take ~4m under v0.10.58 on hosted Linux; keep
        # headroom above the observed ~241s suite wall time.
        timeout-minutes: 8
        run: npm run test:script:eval-golden-selftest
      - name: Eval case-fixture consistency contract
        timeout-minutes: 8
        run: npm run test:script:case-fixture
      - name: Fixture Git hook isolation contract
        # Temporary repositories built by a test must not execute the hooks an
        # operator's global core.hooksPath points at. CI sets no such path, so
        # this contract is the only place the decision is checked rather than
        # accidentally satisfied.
        timeout-minutes: 3
        run: npm run test:script:git-fixture-harn

  # Full no-model replay of every selected golden through the same setup and
  # grading authority as live evals. Calling the scheduled/manual workflow here
  # keeps one replay definition while making its result part of required
  # `CI status` whenever the eval-catalog path filter fires.
  #
  # Not run on `pull_request`. GitHub holds at most ONE pending run per
  # concurrency group, and `cancel-in-progress: false` protects only the
  # in-progress run, never the queued one, so a third arrival evicts the queued
  # run. Evicted shards land as `cancelled` with no runner and no steps, which
  # `ci-status` counts as a failure — a lost race is indistinguishable from a
  # real break, and there is nothing to re-run.
  #
  # HISTORY, because the previous version of this comment misdescribed the
  # hazard and that is why it survived (burin-code#5584): it claimed the group
  # was "unkeyed" and named `eval-golden-selftest`, and it framed the deadlock as
  # a `pull_request` problem. Both were wrong. The group had already become
  # `eval-golden-selftest-${{ github.ref }}`, and a ref key does NOT save `main`:
  # every push to main shares `refs/heads/main`. Commit `29d61050` (#5571's own
  # merge) was evicted by #5579's merge five minutes later and carried a red
  # `CI status` for reasons unrelated to its diff. The comment also said the fix
  # was "tracked separately" when no issue existed. The group is now keyed per
  # commit (`github.sha`), matching this workflow's own top-level group, which
  # already special-cases main to `github.sha` for the same reason.
  #
  # The `pull_request` exclusion STAYS, and not because of eviction — the
  # per-commit key removes eviction on that event too. It stays because of
  # capacity: replay is 5 shards, 2 of them macOS, and the fleet has exactly one
  # macOS runner. Per-commit keying means concurrent PR pushes no longer evict
  # each other, they all queue, so N PRs in flight serialize 2N macOS shards
  # behind one runner and start timing out against the 75-minute job budget.
  # Restoring PR coverage is a capacity question (a second macOS runner, or
  # dropping macOS shards from the PR event), not a concurrency-key question.
  # Do not trade a known-quiet state for an unproven one.
  #
  # Choosing a concurrency policy for a workflow like this one: decide whether
  # overlap or loss is worse. Replay tolerates overlap (fixtures are exported
  # read-only into per-invocation temp dirs) and cannot tolerate loss (its result
  # is a required verdict), so it keys per commit and never evicts. release.yml
  # is the mirror image — two concurrent releases would corrupt the shared taps,
  # a dropped release is retriable — so its unkeyed `release` group is correct
  # even though it can evict. Copying either pattern without asking that
  # question is how this defect is reintroduced.
  #
  # merge_group, eval-catalog pushes, and the nightly schedule still run it.
  # The daily comprehensive CI schedule also requests this reusable workflow.
  # On a merge group its macOS cells also need a `golden_replay` change
  # (bc#9505); the schedule replays them all.
  #
  # The exclusion is on the event, NOT on a mutable cost killswitch, so that
  # clearing a variable cannot silently re-arm the capacity problem. The
  # killswitch this originally guarded against has since been removed entirely.
  #
  # Do NOT reach for `gh workflow disable` to take this lane offline: it blocks
  # `schedule` and `workflow_dispatch` only. A `workflow_call` from here still
  # runs every job of a `disabled_manually` workflow (verified 2026-07-30), so
  # disabling looks like an off switch and is not one. Use
  # `CI_SELFHOSTED_DISABLED`, which this workflow honors via the org detector.
  eval-golden-selftest:
    needs: [changes, harn-prewarm]
    permissions:
      actions: read
      checks: read
      contents: read
    if: needs.changes.outputs.eval_golden_selftest_selected == 'true'
    uses: ./.github/workflows/eval-golden-selftest.yml
    with:
      bytecode-handoff-name: ${{ needs.harn-prewarm.outputs.bytecode_handoff_name }}
      replay-relevant: ${{ needs.changes.outputs.golden_replay == 'true' }}
    # A called workflow inherits NO secrets. Golden replay needs these to mint a
    # read-only token for the private burin-example-* fixture repos and to let
    # the runner-availability detector measure fleet capacity. Named explicitly
    # rather than `secrets: inherit`: this repo's secret set includes Apple
    # signing, deploy hooks and provider keys, and replay needs exactly one
    # read-only app credential.
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # The only lane that runs the real reviewer over labelled heads.
  #
  # `review-calibration` in the eval-script fan-out runs the Harn suite over
  # the calibration LIBRARY: it proves the scoring, never the reviewer. So the
  # corpus replay, which is the measurement docs/pull-request-review.md tells
  # people to trust, ran nowhere in CI and was broken unseen for weeks (#9033).
  # An injected case's archived provider catalog had stopped decoding, every
  # case was skipped, and the run said only that the reviewer wrote no receipt.
  #
  # The runner refuses a run that replayed nothing rather than reporting a
  # clean sheet, so a skipped corpus is a red here and not a silent pass.
  review-calibration-corpus:
    name: Review calibration corpus replay
    needs: [changes, harn-prewarm, linked-runner-availability, rust-tui-harn-linked]
    if: needs.changes.outputs.review_calibration_selected == 'true'
    # The replay is deterministic, calls no provider and builds nothing: it
    # downloads the binary the Rust lane built in this run. Prefer self-hosted
    # when the fleet is up and fall back to hosted. The fallback is
    # ubuntu-24.04, never Blacksmith: review mode confines its commands with
    # Landlock (#9609), and on a Blacksmith host every case wrote no receipt
    # (run 36344734557, 0 of 12 replayed). `landlock_required_jobs` in
    # scripts/ci-policy.toml holds this job to Landlock-capable labels.
    # Hosted only while BURIN_CI_PAID_LINUX_PROVIDER is unset. This job was
    # pinned hosted when hosted minutes were credit-covered; since 2026-10-01
    # they are $0.006 a minute in cash, so the provider switch moves it to the
    # Landlock-capable `ubicloud-standard-2` at $0.002 (`[paid_linux_provider]`).
    runs-on: >-
      ${{ (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true'
        && needs.linked-runner-availability.outputs.linux == 'true'
        && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]'))
        || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-2' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    # The CI latency policy caps any required job's declared budget at the
    # critical-path allowance, 19.5 minutes, and this job is declared there.
    # With the build moved to the producer, what is left is a download and the
    # replay, measured at 507s. The timeout stays well above that so a slow
    # replay is judged by the policy from measurement rather than cut off
    # without a reading.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A case names an archived main revision as its head, and `git archive`
          # of a head this checkout never fetched fails "not a tree object". Full
          # history is the one depth that holds for every case head, present and
          # future; the eval-script job carries the same comment for the same
          # reason.
          fetch-depth: 0
      - uses: ./.github/actions/require-landlock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Isolate public Harn fetch
        uses: ./.github/actions/harn-public-git
      - name: Fetch Harn binary
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # The reviewer under review is this head's binary, so the replay takes
      # the one the Rust lane built in THIS run and never a binary published
      # from an earlier commit: calibrating a reviewer change against the old
      # reviewer would read green on exactly the regressions this job exists
      # to catch. The producer's selector carries this job's surface, so the
      # artifact is there whenever the replay runs.
      #
      # It is also why the job fits its budget. Building in-job measured 668s
      # against a 507s replay, about 23 minutes against a declared 19.5; the
      # download is seconds and the critical path gains only the replay.
      - name: Take this run's burin from the Rust lane
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: burin-linux
          path: ${{ runner.temp }}/burin-linux
      # A missing or unusable download must be loud. Absent, every case would
      # skip and the job would report a clean sheet for a replay that never
      # ran, which is the failure this gate exists to make impossible.
      - name: Require the reviewer binary this run built
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/burin-linux/burin"
          if [ ! -s "$bin" ]; then
            echo "::error::the Rust lane published no burin for this head; the replay cannot measure the reviewer under review"
            exit 1
          fi
          chmod +x "$bin"
          echo "BURIN_HEADLESS_BIN=$bin" >> "$GITHUB_ENV"
      # Named rather than inferred. A binary path that resolved to nothing would
      # make every case skip, which is the shape this job exists to catch.
      - name: Say which reviewer binary the replay will use
        run: |
          set -euo pipefail
          test -n "${BURIN_HEADLESS_BIN:-}"
          test -x "$BURIN_HEADLESS_BIN"
          "$BURIN_HEADLESS_BIN" --version
          echo "reviewer binary: $BURIN_HEADLESS_BIN, built by this run's Rust lane"
      - name: Replay the calibration corpus
        run: pnpm run review:calibrate -- --binary "$BURIN_HEADLESS_BIN"
      - name: Upload the calibration receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-calibration-receipt
          # The transcripts directory holds the envelope and receipt of every
          # replay case that disagreed with its label, so a red replay can be
          # read instead of re-run. It is empty on a green one.
          path: |
            .harn-runs/review-calibration.json
            .harn-runs/review-calibration/transcripts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  eval-script-tests:
    name: Eval script unit tests
    needs: [changes, harn-prewarm, late-runner-availability]
    # Fork code must not reach persistent owned runners. CI status keeps a
    # selected but skipped proof blocking until an isolated route is provided.
    if: >-
      needs.changes.outputs.eval_script_tests_selected == 'true'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    # Harn/shell unit tests, including source-linked cases that spawn cargo;
    # no live eval runs or provider calls. A narrow
    # opt-in puts the wide child-process graph on dedicated 16-vCPU capacity;
    # unset it to restore the existing free-first ladder immediately.
    #
    # The `harn-ci-big` rung mirrors the one the harn-linked TUI lane uses, for
    # the same reason: the rung above it consults *idle* capacity, so on a busy
    # fleet it declines and the ladder used to fall straight to `ubuntu-latest`.
    # This job does not merely run slower there, it runs at a different width.
    # Its work is a fan-out of independent child checks, and
    # `scripts/run-parallel-checks.ts` sizes its worker pool from the host's
    # core count. Measured on run 33941812515: `ubuntu-latest` reported two
    # cores, so the pool ran "max 2 at a time" and spent 13.9 minutes of wall
    # clock on 1959s of child work, with the longest single child only 292s. No
    # child sets that wall; the core count does. Waiting for a big self-hosted
    # slot costs queue time and nothing else, so take it whenever self-hosted
    # capacity exists at all, and keep the hosted rung for the case where the
    # whole self-hosted fleet is switched off.
    #
    # `runs-on` label lists are an AND. Both owned rungs require the probed
    # Rust-capable pool. General Linux labels also admit toolchain-less cattrick.
    runs-on: >-
      ${{ (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.late-runner-availability.outputs.linux_probe == 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable", "harn-ci-big-a"]'))
        || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_probe.eligible && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-big", "harn-ci-big-a"]'))
        || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-8' || 'ubuntu-8core') }}
    # Paid capacity keeps a 20-minute spend fuse. Free capacity retains the
    # wide correctness backstop for its measured co-tenant variance. The
    # self-hosted rungs take the same wide bound: the fuse exists to cap spend,
    # and self-hosted minutes are not billed.
    timeout-minutes: >-
      ${{ (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX == 'true' || !fromJSON(needs.late-runner-availability.outputs.capacity).linux_probe.eligible) && 20
        || 125 }}
    env:
      # Resolved runner tier — see ci-policy.toml. Declared so cache steps
      # branch on the tier rather than on `runner.environment`, which reports
      # 'self-hosted' on Ubicloud. This MUST mirror `runs-on`
      # rung for rung: a tier that disagrees with the runner silently mounts the
      # wrong cache.
      BURIN_RUNNER_TIER: >-
        ${{ (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.late-runner-availability.outputs.linux_probe == 'true') && 'self-hosted'
          || (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux_probe.eligible) && 'self-hosted'
          || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud' || 'github-hosted') }}
      # Hosted Harn setup is roughly 6-16s per eval-trial test. Individual Harn
      # files stay internally bounded; only the independent outer suites widen.
      EVAL_TRIALS_TEST_TIMEOUT_SECONDS: "1200"
      GRADE_CHECKPOINT_TEST_TIMEOUT_SECONDS: "720"
      RUN_EVAL_CONCURRENCY_TEST_TIMEOUT_SECONDS: "1200"
      # The debugger suite is intentionally broad: path discovery, corpus
      # mining, run-state fallbacks, and five-whys helpers share fixtures.
      # Hosted setup is slow enough that the full sequential suite needs a
      # real budget when the eval-script tests make debugger changes visible.
      HARNESS_DEBUGGER_TEST_TIMEOUT_SECONDS: "720"
      HARN_CACHE_DIR: ${{ github.workspace }}/.blacksmith/harn-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The review-calibration corpus archives each injected case's head,
          # a main revision from when the case was authored. A depth-1 checkout
          # holds only this head, and with credentials dropped the tests cannot
          # fetch the missing one, so they read "not a tree object" once the
          # branch was rebased past it (run 35565958810). Full history is the
          # one shape that holds for every case head, present and future.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-rustup
        if: env.BURIN_RUNNER_TIER != 'self-hosted'
      - name: Require Rust toolchain for source-linked eval cases
        run: |
          set -euo pipefail
          if [ "$BURIN_RUNNER_TIER" != self-hosted ]; then
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          cargo --version
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prewarm Harn module graph
        timeout-minutes: 10
        # Compile the shared Harn bytecode once, serially, before anything fans
        # out. Harn compiles modules lazily inside the *execute phase* of the
        # first test to need them, and `harn test --timeout` bounds only that
        # phase -- so a cold cache bills the whole graph compile to one
        # arbitrary sub-second test. With children compiling concurrently that
        # reliably exceeds a 30 s per-test budget.
        #
        # Off the owned pool HARN_CACHE_DIR starts empty on every run, so the
        # graph is cold every time.
        run: ./scripts/prewarm-harn-graph.sh
      - name: Eval and meter script unit tests
        timeout-minutes: >-
          ${{ (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX == 'true' || !fromJSON(needs.late-runner-availability.outputs.capacity).linux_probe.eligible) && 15
            || 120 }}
        # npm: this job has no pnpm/action-setup step; these package scripts
        # shell out to harnw or local wrappers and need no node_modules install.
        # eval-trials is intentionally sequential and takes ~300s on a contended
        # hosted runner. The longest child budget is meter-core at 2100s.
        #
        # Child budgets are backstops against a hang, not performance policy:
        # keep every one at >=3x its observed worst green run. Measured wall
        # clock swings ~2x run-to-run here, so a check sitting near its budget is
        # a timeout waiting for a busy runner. The repository-wide fixture
        # authority scan proved the point by passing its self-test and then
        # exceeding 120s under measured free-runner contention; its 420s bound
        # keeps the diagnostic without mistaking that slow scan for a hang.
        # run-parallel-checks warns when
        # a passing check crosses half its budget; fix the budget, don't mute it.
        # The step cap stays above the slowest child so every route retains a
        # clean per-check timeout report. The old universal 65m cap was
        # empirically below free-hosted aggregate work, so 120m remains the
        # correctness backstop regardless of capacity placement.
        #
        # Deliberately NOT --fail-fast. The children are independent suites, so
        # the first failure is not reliably the informative one, and aborting
        # discards every sibling's diagnostic. One meter-core timeout previously
        # terminated 16 siblings, leaving no way to see what else was failing.
        # Paying the extra wall clock buys a run that can actually be read.
        #
        # The trailing seventeen children are the CI-orphan paydown that landed
        # with the pull-request narrowing in check-ci-test-script-coverage.ts.
        # Each ran in no pull-request job before: some were credited by a
        # `dorny/paths-filter` entry naming their test file, which decides when a
        # job runs and never runs anything, and `test:script:rust-headless-surface`
        # was reachable only from the root `pnpm test` aggregator, which no
        # workflow invokes. Measured locally, the seventeen sum to ~203s of
        # sequential work against a job whose wall clock is set by meter-core
        # (2100s budget) and eval-trials (1200s); they fan out alongside the
        # existing children rather than extending the critical path, so the p90
        # CI budget is unmoved. `test:script:lora-gemma4-preflight` is wired
        # below now that the record floor comes from the training config.
        #
        # The seventeen carry no `--timeout` of their own, unlike every child
        # above them. That is deliberate. The rule this job states for child
        # budgets is ">=3x the observed worst green run", and these suites
        # measure 0.1s to 17s, so honouring the rule would mean seventeen numbers
        # in the 1s-to-60s range that nobody would ever tune again. Round
        # backstops far above the rule are worse than none: they cannot fire
        # before the job wall limit does, and at that headroom the half-budget
        # warning that makes a child budget useful never trips. So they are
        # bounded by this job's `timeout-minutes` instead, which is the shape
        # `pnpm test`, `pnpm lint`, `pnpm typecheck` and `pnpm ci` already use
        # for every child they run. The stated cost: a hang in one of the
        # seventeen burns the job wall limit rather than a named per-child
        # timeout, and the report says "job timed out" rather than naming the
        # child. Deriving these from measured receipts is what the
        # duration-limit census is ratcheting toward; seventeen more hand-set
        # numbers is the thing it exists to refuse.
        run: |
          # Let the scheduler own host shaping. Its bounded outer pool divides
          # the detected CPU capacity among nested Harn workers, so the machine
          # stays occupied without starting one heavyweight process per logical
          # core. Overriding the outer pool with `nproc` defeated that contract:
          # twelve competing checks stretched healthy 2-7 second cases past
          # their 30 second execution ceiling and left two repository scans
          # unable to finish inside seven minutes.
          # Both streams to a file as well as to the step log. When this step
          # is killed rather than failed, the step log is not served at all:
          # main 55b8a30e0c hung 48 minutes here and the log answered
          # BlobNotFound on every fetch twenty minutes apart, so which child
          # hung is still unknown (#9159). The retained copy is the only thing
          # that can answer that question next time. `pipefail` is set because
          # a pipeline's exit status is its last command's, and `tee` always
          # succeeds: without it every hang and every failure would report
          # green.
          set -o pipefail
          node --experimental-strip-types --no-warnings scripts/run-parallel-checks.ts \
            --budget-site eval-script-tests --budget-tier "${BURIN_RUNNER_TIER}" \
            --job harn-worker-policy "npm run test:script:harn-worker-policy" \
            --job meter-core \
              "npm run test:script:meter && npm run test:script:meter-run && npm run test:script:eval-launch-defaults" \
            --job eval-agreement "npm run test:script:eval-agreement" \
            --job run-eval-resilience \
              "npm run test:script:run-eval-resilience && npm run test:script:run-eval-policy-denial" \
            --job run-eval-admission \
              "npm run test:script:run-eval-admission && npm run test:script:run-eval-platforms" \
            --job fixture-verdict-authority "npm run test:script:fixture-verdict-authority" \
            --job run-eval-wrapper \
              "npm run test:script:run-eval-wrapper && npm run test:script:run-eval-help" \
            --job run-eval-reset "npm run test:script:run-eval-reset" \
            --job run-eval-resume "npm run test:script:run-eval-resume" \
            --job eval-artifacts \
              "npm run test:script:eval-artifacts && npm run test:script:run-eval-exploration-strategy" \
            --job harness-debugger "npm run test:script:harness-debugger" \
            --job harness-debugger-response-compaction "npm run test:script:harness-debugger-response-compaction" \
            --job harness-librarian "npm run test:script:harness-librarian" \
            --job grade-checkpoint "npm run test:script:grade-checkpoint" \
            --job eval-trials "npm run test:script:eval-trials" \
            --job call-role-coverage "npm run test:script:call-role-coverage" \
            --job dead-inner-default "npm run test:script:dead-inner-default" \
            --job verification-integrity "npm run test:script:verification-integrity" \
            --job eval-rollup-reconciliation "npm run test:script:eval-rollup-reconciliation" \
            --job eval-verify-toolchain-resolution "npm run test:script:eval-verify-toolchain-resolution" \
            --job eval-regression-verify "npm run test:script:eval-regression-verify" \
            --job run-eval-concurrency "npm run test:script:run-eval-concurrency" \
            --job run-eval-trial-overlays "npm run test:script:run-eval-trial-overlays" \
            --job grade-watchdog "npm run test:script:grade-watchdog" \
            --job grader-provisioning "npm run test:script:grader-provisioning" \
            --job fleet-doctor-daemons "npm run test:script:fleet-doctor-daemons" \
            --job cross-repo-pr-auditor "npm run test:script:cross-repo-pr-auditor" \
            --job modal-fanout-artifacts "npm run test:script:modal-fanout-artifacts" \
            --job mechanism-opportunity-rank "npm run test:script:mechanism-opportunity-rank" \
            --job ops-fixtures "npm run test:script:ops-fixtures" \
            --job prompt-fleet-report "npm run test:script:prompt-fleet-report" \
            --job meter-smoke "npm run test:script:meter-smoke" \
            --job eval-runtime-preflight "npm run test:script:eval-runtime-preflight" \
            --job scoreboard "npm run test:script:scoreboard" \
            --job provider-runtime-env "npm run test:script:provider-runtime-env" \
            --job provider-key-preflight "npm run test:script:provider-key-preflight" \
            --job harn-maturity-verdict "npm run test:script:harn-maturity-verdict" \
            --job run-eval-dotenv-resolution "npm run test:script:run-eval-dotenv-resolution" \
            --job replay-check "npm run test:script:replay-check" \
            --job review-calibration "npm run test:script:review-calibration" \
            --job review-calibration-rescore "npm run test:script:review-calibration-rescore" \
            --job selftest "npm run test:script:selftest" \
            --job event-projection-multiset "npm run test:script:event-projection-multiset" \
            --job upgrade-pipeline "npm run test:script:upgrade-pipeline" \
            --job build-daemons "npm run test:script:build-daemons" \
            --job user-timeline "npm run test:script:user-timeline" \
            --job pr-grade "npm run test:script:pr-grade" \
            --job pr-patrol "npm run test:script:pr-patrol" \
            --job merge-captain-patrol "npm run test:script:merge-captain-patrol" \
            --job loop-wall-attribution "npm run test:script:loop-wall-attribution" \
            --job wasted-time "npm run test:script:wasted-time" \
            --job wasted-time-summary "npm run test:script:wasted-time-summary" \
            --job budget-attribution-projection "npm run test:script:budget-attribution-projection" \
            --job converge "npm run test:script:converge" \
            --job judge-cutover-ladder "npm run test:script:judge-cutover-ladder" \
            --job judge-ladder-order "npm run test:script:judge-ladder-order" \
            --job deferred-eval-candidates "npm run test:script:deferred-eval-candidates" \
            --job serving-precision "npm run test:script:serving-precision" \
            --job harness-ownership "npm run test:script:harness-ownership" \
            --job burinbench-field "npm run test:script:burinbench-field" \
            --job evaluator "npm run test:script:evaluator" \
            --job approval-resolver-census "npm run test:script:approval-resolver-census" \
            --job permission-canary "npm run test:script:permission-canary" \
            --job preflight-harn-runtime "npm run test:script:preflight-harn-runtime" \
            --job analyze-transcripts "npm run test:script:analyze-transcripts" \
            --job stale-pr-guard "npm run test:script:stale-pr-guard" \
            --job project-changes "npm run test:script:project-changes" \
            --job local-runtime-config "npm run test:script:local-runtime-config" \
            --job rust-headless-surface "npm run test:script:rust-headless-surface" \
            --job source-linked-eval-attestation "npm run test:script:source-linked-eval-attestation" \
            --job source-linked-launch-preflight "npm run test:script:source-linked-launch-preflight" \
            --job live-evals "npm run test:script:live-evals" \
            --job harness-debugger-remote "npm run test:script:harness-debugger-remote" \
            --job transcript-judge "npm run test:script:transcript-judge" \
            --job transcript-scoring "npm run test:script:transcript-scoring" \
            --job transcript-qualification "npm run test:script:transcript-qualification" \
            --job staircase-run "npm run test:script:staircase-run" \
            --job lora-eval-coverage-tests "npm run test:script:lora-eval-coverage" \
            --job lora-gemma4-preflight-tests "npm run test:script:lora-gemma4-preflight" \
            --job lora-gemma4-train-manifest "npm run test:script:lora-gemma4-train-manifest" \
            --job run-eval-exploration-strategy "npm run test:script:run-eval-exploration-strategy" \
            --job run-eval-artifacts "npm run test:script:run-eval-artifacts" \
            --job compare-eval-baseline "npm run test:script:compare-eval-baseline" \
            2>&1 | tee "${RUNNER_TEMP}/eval-script-tests.log"

      # Not `always()`: a green run's log is already served and keeping a copy
      # of every one of them buys nothing. `!success()` covers the case
      # `failure()` misses, which is the one that produced this step: a killed
      # step reports `cancelled`, not `failure`.
      - name: Retain the eval and meter unit test output
        if: ${{ !success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-script-tests-log
          path: ${{ runner.temp }}/eval-script-tests.log
          # An empty upload reporting success is how the UI smoke spent eight
          # days retaining nothing (#9139). The file is written by `tee` before
          # the first child finishes, so its absence means the retention broke.
          if-no-files-found: error
          retention-days: 7

  trial-resume-process-canary:
    name: Eval run resumes after a crash
    env:
      # A label, not the lever. `CI_STATUS_ROLE` governs one thing: whether the
      # aggregate is allowed not to depend on this job. It does not make a red
      # harmless, which is why the demotion itself lives in the verdict step's
      # `TRIAL_RESUME_CANARY_ROLE` below. Marked here so the job's standing is
      # readable where the job is defined.
      CI_STATUS_ROLE: informational
    # This canary launches the bundled Linux runtime, so it must restore the
    # exact cache produced by `actions` instead of racing a second cold setup.
    needs: [changes, harn-prewarm, late-runner-availability]
    # Gate on the pool EXISTING, not on a runner being idle this instant
    # (burin-code#5588). `outputs.linux` means "a job can land right now", which
    # is false when the fleet is merely BUSY — so this canary silently vanished
    # exactly when CI was heaviest and a resume regression mattered most. A
    # canary that only runs when the machines are quiet is absent under load.
    # `capacity.linux.eligible` requires the policy's minimum online pool,
    # while remaining true when that pool is busy. A starved pool is skipped
    # and named in CI status because this workload has no small hosted fallback.
    #
    # `measured` must be checked BEFORE the counts. It is false both when
    # `CI_SELFHOSTED_DISABLED` retired the lane and when the probe could not see
    # the fleet at all, and the counts are 0 in both cases, so treating 0 as
    # "busy" would repeat the conflation the detector exists to prevent.
    #
    # Hosted fallback is not an option here and skipping is the only
    # alternative to queueing: this canary drives the real Rust headless binary
    # through a full 2-cell x 2-trial eval with a SIGKILL/resume in the middle,
    # an eval-class workload whose trial-completion timing is starved on a
    # 2-vCPU hosted runner (proven flaky there: fast-fails at ~1m with
    # completed_trials < 4, passes at ~2-3m when it has headroom).
    #
    # Queueing on the PR critical path was justified here by a "9-runner
    # `harn-ci-stable` pool" that has never existed at that size. Measured
    # 2026-08-15 over 18 runs (7 occurrences), the pool was THREE workers, all
    # on cattrick, and this job's queue p50 was 16.0 min against a declared
    # 4.4-minute budget -- it finished at p50 26.4 min, on its own past the
    # 19.5-minute critical-path allowance in .github/ci-latency.json (not
    # scripts/config/ci-wall-time-budget.json, which does not exist).
    #
    # The pool is now six workers (cattrick-w1..w6), so the original reasoning
    # holds at roughly half the strength it claimed. Re-measure before trusting
    # it again: the number of runners behind a label is a fact about the org's
    # runner registry, not about this comment.
    #
    # A skip here is still invisible in `ci-status`, which reads `skipped` as
    # pass. That is not fixable by any predicate — while the lane is retired
    # there is genuinely nowhere to run — so `ci-status` now ANNOUNCES the skip
    # and its reason instead of letting a green check imply the canary ran.
    if: >-
      (github.event_name == 'merge_group' || github.event_name == 'push') &&
      needs.changes.outputs.eval_scripts == 'true' &&
      (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' ||
        (vars.BURIN_CI_HEAVY_PREFER_PAID == 'true' && vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request')) &&
      fromJSON(needs.late-runner-availability.outputs.capacity).linux.measured &&
      fromJSON(needs.late-runner-availability.outputs.capacity).linux.eligible
    # Heavy class. This canary launches the bundled Linux runtime and resumes a
    # killed trial, and it does not survive a standard hosted runner: on a
    # hosted box it reported `the stopped parent has not indexed the terminal
    # worker`, which is the resource class, not the resume code. An idle owned
    # runner first, then Ubicloud only while it carries the paid class, and the
    # owned queue otherwise. It has no hosted rung at all, so it uses the
    # Ubicloud-only form rather than the paid pair with its hosted fallback.
    runs-on: >-
      ${{ (vars.BURIN_CI_LINUX_OWNED_FIRST == 'true' && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON(needs.late-runner-availability.outputs.capacity).linux.idle >= 1 && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]'))
        || (vars.BURIN_CI_HEAVY_PREFER_PAID == 'true' && vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-16')
        || fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') }}
    # The ordinary compatible-artifact path stays at the measured ~4.4m. A
    # compiled-runtime change rejects ancestor artifacts and may consume the
    # fallback build's full backstop before the 2-3 minute canary runs, so the
    # job ceiling must actually contain the step ceilings it governs.
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      # Bootstrap the verifier from an explicit durable ref. The following
      # checkout may legitimately fail after a delayed PR run loses its merge
      # ref; keeping the control plane present lets that absence produce a
      # structured provenance rejection instead of an unrelated missing-file
      # error or an implicit default-branch checkout.
      - name: Check out trial-resume provenance control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/heads/main
      - name: Materialize exact pull-request merge source
        if: github.event_name == 'pull_request'
        id: pr-source-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          # Trial adoption reconstructs each cell's baseline project copy from an
          # ancestor commit, so the resume path needs real history. A shallow
          # (fetch-depth 1) checkout has no ancestor commits and aborts adoption.
          fetch-depth: 0
      - name: Verify exact pull-request source identity
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_OUTCOME: ${{ steps.pr-source-checkout.outcome }}
        run: >-
          scripts/ci/verify-trial-resume-pr-source.sh
          --pull-request "$PR_NUMBER"
          --expected-merge-sha "$EXPECTED_MERGE_SHA"
          --expected-head-sha "$EXPECTED_HEAD_SHA"
          --checkout-outcome "$CHECKOUT_OUTCOME"
      - name: Materialize exact main source
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        id: main-source-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact main source identity
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'merge_group') }}
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          CHECKOUT_OUTCOME: ${{ steps.main-source-checkout.outcome }}
        run: >-
          scripts/ci/verify-trial-resume-pr-source.sh
          --expected-commit-sha "$EXPECTED_COMMIT_SHA"
          --checkout-outcome "$CHECKOUT_OUTCOME"
      - name: Plan trial-resume source and binary build identities
        id: runtime-plan
        env:
          DIRECT_EVAL_SCRIPTS: ${{ needs.changes.outputs.eval_scripts_direct }}
          SOURCE_KIND: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'commit' || 'pull-request' }}
        run: >-
          scripts/ci/plan-trial-resume-runtime.sh
          --direct-eval-scripts "$DIRECT_EVAL_SCRIPTS"
          --source-kind "$SOURCE_KIND"
      - name: Materialize planned trial-resume source identity
        env:
          SOURCE_SHA: ${{ steps.runtime-plan.outputs.source_sha }}
        run: |
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install fixture test dependency
        run: python -m pip install pytest
      - name: Isolate public Harn fetch for eval freshness preflight
        uses: ./.github/actions/harn-public-git
      - name: Fetch Harn binary
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          consume-bytecode-handoff: ${{ steps.runtime-plan.outputs.consume_bytecode_handoff }}
      - name: Reuse compatible harn-linked burin from main CI
        id: prebuilt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BURIN_PREBUILT_REQUIRED_SOURCE_SHA: ${{ steps.runtime-plan.outputs.source_sha }}
          BURIN_PREBUILT_REQUIRED_BUILD_IDENTITY: ${{ steps.runtime-plan.outputs.build_input_identity }}
          BURIN_PREBUILT_FORCE_SOURCE: ${{ steps.runtime-plan.outputs.force_source }}
        run: scripts/ci/reuse-burin-linux-artifact.sh
      - name: Configure Rust compiler wrapper for fallback build
        if: steps.prebuilt.outputs.reused != 'true'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          ./scripts/ci-rustc-wrapper.sh configure
          source scripts/lib/ci-cargo-target.sh
          target="$(ci_persistent_cargo_target trial-resume)"
          test -n "$target"
          mkdir -p "$target"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
          echo "BURIN_HEADLESS_BIN=$target/debug/burin" >> "$GITHUB_ENV"
      # Retain compiler output outside checkout cleanup, isolated per runner.
      # Cargo still invalidates changed build inputs; a timed-out cold build
      # retains completed compilation work for the next scheduled run.
      - name: Build burin from current merge source when no compatible artifact exists
        id: fallback-build
        if: steps.prebuilt.outputs.reused != 'true'
        timeout-minutes: 40
        working-directory: crates/burin-tui
        run: |
          source ../../scripts/ci-resource-limits.sh
          cargo build --locked --profile test -p burin-tui-app --bin burin
      - name: Kill the eval run mid-trial and resume it
        id: trial-resume-canary
        continue-on-error: true
        env:
          CANARY_LOG: ${{ runner.temp }}/trial-resume-canary.log
        # Capture to a file so the verdict step can name the cases that
        # actually failed. Redirect rather than pipe to `tee`: a pipeline's exit
        # status is its last stage's, so a piped canary failure would report as
        # a success. `cat` afterwards keeps the output in the job log.
        run: |
          status=0
          npm run test:script:run-eval-trial-resume-canary >"$CANARY_LOG" 2>&1 || status=$?
          cat "$CANARY_LOG"
          exit "$status"
      - name: Report whether the resume check ran and passed
        if: ${{ always() }}
        env:
          PREBUILT_OUTCOME: ${{ steps.prebuilt.outcome }}
          FALLBACK_BUILD_OUTCOME: ${{ steps.fallback-build.outcome }}
          CANARY_OUTCOME: ${{ steps.trial-resume-canary.outcome }}
          CANARY_LOG: ${{ runner.temp }}/trial-resume-canary.log
          # Demoted while the instrument is unproven. This canary has zero
          # successful runs in the observable window, so its red is not
          # evidence that a commit broke anything, and through skip-inheritance
          # it was reddening heads that never ran it. A FAIL it produced now
          # warns instead of failing the job; INSTRUMENT_UNAVAILABLE still
          # fails in both roles, because absence must not read as success.
          # Back to `required` after five consecutive green main runs, tracked
          # in burin-code#8248.
          TRIAL_RESUME_CANARY_ROLE: informational
        run: >-
          scripts/ci/verify-trial-resume-canary-outcome.sh
          "$PREBUILT_OUTCOME"
          "$FALLBACK_BUILD_OUTCOME"
          "$CANARY_OUTCOME"
          "$CANARY_LOG"

  document-artifact-dogfood:
    name: Document artifact dogfood
    needs: [changes, runner-availability]
    if: needs.changes.outputs.document_artifacts_selected == 'true'
    # Pure deterministic Node harness: generates a PDF/PNG bundle offline and
    # validates the canonical manifest/session-update contract. No provider
    # calls and no headless build in CI; live headless/API dogfooding stays a
    # manual/local evidence path.
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || 'ubuntu-24.04') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install Poppler
        # `apt-get update` fails when ANY configured index fails, and the hosted
        # runner image ships third-party sources this job never installs from
        # (Google Chrome, Microsoft). Under `set -e` one of those breaking kills
        # the step before poppler-utils is installed, even though the Ubuntu
        # archive index refreshed fine: observed 2026-09-09 as `Hash Sum
        # mismatch` on dl.google.com/linux/chrome-stable, which reddened this
        # job on every fresh pull-request head while the package it needs was
        # available the whole time.
        #
        # So the refresh is advisory and the install is the gate. `pdftotext`
        # comes from the Ubuntu archive alone, and the install below fails
        # loudly if that archive's index is stale or missing — which is the
        # only failure this step should ever report.
        run: |
          sudo apt-get update \
            || echo "::warning::apt-get update reported a failing index; the poppler-utils install below is the gate"
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Document artifact dogfood contract
        # npm: this job does not need node_modules; the package script runs a
        # single Node TypeScript-stripping test.
        run: npm run test:script:document-artifact-dogfood

  experiment-engine-test:
    name: Experiment-engine tests
    needs: [changes, harn-prewarm, late-runner-availability]
    if: needs.changes.outputs.experiment_engine_test_selected == 'true'
    # Deterministic Burin product-path coverage over Harn's released experiment
    # primitives. Harn owns the synthetic statistical conformance suite.
    runs-on: >-
      ${{ (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && needs.late-runner-availability.outputs.linux == 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]'))
        || (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    # The fetch and test steps own 20m and 10m ceilings respectively. Recent
    # cold-cache runs spent 6m45s-7m32s fetching Harn and about 7m testing; a
    # 15m job envelope cancelled otherwise-green suites at the next test file.
    # Contain both declared child budgets plus setup and cleanup instead.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Experiment-engine unit tests
        timeout-minutes: 10
        run: |
          npm run test:script:experiment-artifact-contracts
          npm run test:script:experiment-engine

  # Markdown lint. Runs the same `pnpm run lint:md` (markdownlint-cli2 +
  # repo .markdownlint-cli2.* config) that the pre-commit hook and
  # `pnpm run lint` use, so CI and local enforcement never drift on docs.
  docs-lint:
    name: Markdown lint
    needs: [changes, runner-availability]
    if: needs.changes.outputs.docs == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_all)
    # Measured 2026-08-06 over 20 PR runs: tornadough p90 0.3m, cattrick p90
    # 4.8m (n=4) — ~16x slower on cattrick. The job's declared budget is 0.5m;
    # landing on cattrick alone was enough to miss the wall-time report. Same
    # calculus as #5950 / site-check: two-rung, not three.
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-4' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:script:documentation-contracts
      - run: pnpm run test:script:config-reference
      - run: pnpm run lint:md

  harn-pipeline-budget-margin:
    name: Harn pipeline execute-budget margin (${{ matrix.shard_index }}/${{ needs.harn-pipeline-plan.outputs.budget_margin_shard_total }})
    needs: [changes, harn-prewarm, harn-pipeline-plan]
    if: needs.changes.outputs.harn_pipeline_heavy_selected == 'true'
    # Each shard gets a dedicated VM and Harn's one-worker measurement mode.
    # Capacity-level sharding keeps the full-suite gate off the critical path
    # without reintroducing within-runner contention, which is also why this
    # lane never takes a shared fleet runner. The paid 2-vCPU rung is the same
    # dedicated two-core shape as ubuntu-24.04; each shard's calibration run divides out the host-speed
    # difference (see `budget_margin_calibration_reference_ms`). On 09-27 these
    # shards were about $14/day of hosted Linux (bc#9618).
    runs-on: >-
      ${{ (vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request' && 'ubicloud-standard-2' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' && fromJSON('["self-hosted", "Linux", "X64", "harn-ci-stable"]') || 'ubuntu-24.04') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard_index: ${{ fromJSON(needs.harn-pipeline-plan.outputs.budget_margin_shard_indices) }}
    env:
      BURIN_HARN_AFFECTED_FROM: ${{ needs.harn-pipeline-plan.outputs.affected_from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ needs.harn-pipeline-plan.outputs.affected_from != '' && '0' || '1' }}
          persist-credentials: false
      - name: Isolate public Harn source fetch
        if: hashFiles('.harn-revision') != ''
        uses: ./.github/actions/harn-public-git
      - name: Fetch harn binaries
        timeout-minutes: 20
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Measure serial Harn pipeline execute margin
        id: harn_pipeline_budget_margin
        env:
          HARN: ./Sources/BurinCore/Resources/bin/harn
          HARN_PROVIDERS_CONFIG: ${{ github.workspace }}/Sources/BurinCore/Resources/providers.toml
          HARN_STATE_DIR: Sources/BurinCore/Resources/pipeline-tests/tests/.harn-state
          TMPDIR: ${{ github.workspace }}/.build/harn-test-tmp
          BURIN_HOME: ${{ runner.temp }}/burin-harn-pipeline-budget-margin
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ needs.harn-pipeline-plan.outputs.budget_margin_shard_total }}
        run: |
          mkdir -p .build/harn-tests "$TMPDIR"
          scripts/run-harn-pipeline-budget-margin.sh \
            --calibration-out ".build/harn-tests/pipeline-budget-margin-calibration-$SHARD_INDEX.json" \
            --shard-index "$SHARD_INDEX" \
            --shard-total "$SHARD_TOTAL" \
            --json-out ".build/harn-tests/pipeline-budget-margin-source-$SHARD_INDEX.json"
      - name: Report Harn pipeline execute margin
        if: always() && hashFiles(format('.build/harn-tests/pipeline-budget-margin-source-{0}.json', matrix.shard_index)) != ''
        env:
          HARN: ./Sources/BurinCore/Resources/bin/harn
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          "$HARN" run scripts/check-harn-test-budget-margin.harn -- \
            --report ".build/harn-tests/pipeline-budget-margin-source-$SHARD_INDEX.json" \
            --calibration ".build/harn-tests/pipeline-budget-margin-calibration-$SHARD_INDEX.json" \
            --json-out ".build/harn-tests/pipeline-budget-margin-$SHARD_INDEX.json" \
            --summary-out ".build/harn-tests/pipeline-budget-margin-$SHARD_INDEX.md"
          cat ".build/harn-tests/pipeline-budget-margin-$SHARD_INDEX.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Harn pipeline budget-margin artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harn-pipeline-budget-margin-${{ matrix.shard_index }}
          path: .build/harn-tests/**
          if-no-files-found: error
          retention-days: 7

  registry-shrink:
    name: Registry shrink guard
    permissions:
      contents: read
      pull-requests: read
    # Deliberately NOT gated on `changes`. This job judges a MERGE, not a tree:
    # its subject is every shared registry at once (scripts/lint-harn.ts, the
    # package.json aggregates, ci.yml's own path filters), and a whole-tree gate
    # behind a path filter is how a check stops running on exactly the change it
    # exists to judge — the lesson already paid for in #5645 and #5648. Running
    # it unconditionally also makes the trigger set trivially a superset of
    # everything it reads, which a `changes` entry could silently stop being.
    # About a minute of work, so the 1 vCPU runner (bc#9618).
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate compares two revisions and resolves their merge base, so a
          # shallow clone cannot answer the question it asks.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The guard fetches the merge target, and `persist-credentials: false`
      # leaves the checkout with no credential for a raw git network verb.
      - uses: ./.github/actions/github-token-git-auth
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Behavioral suite
        # Runs here rather than only in an aggregate so the guard's own tests
        # cannot drift into the set of suites that execute nowhere (#5733).
        run: node --experimental-strip-types --no-warnings scripts/tests/test-check-registry-shrink.ts
      - name: Registry shrink guard
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          provenance=()
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git fetch --no-tags --quiet origin "${BASE_REF}"
              base="origin/${BASE_REF}"
              ;;
            push)
              base="${BEFORE_SHA}"
              git cat-file -e "${base}^{commit}"
              provenance=(--github-repository "$GITHUB_REPOSITORY")
              ;;
            *)
              echo "registry-shrink: no introduced-commit range for ${GITHUB_EVENT_NAME}"
              exit 0
              ;;
          esac
          node --experimental-strip-types --no-warnings scripts/check-registry-shrink.ts \
            --base "$base" "${provenance[@]}"
      - name: Fleet-owned projection tests
        # Beside the guard for the same reason the shrink guard's suite is here:
        # a gate's own suite that runs only inside an aggregate can drift into
        # the set of suites that execute nowhere (#5733).
        run: node --experimental-strip-types --no-warnings scripts/tests/test-fleet-owned-projections.ts
      - name: Fleet-owned projection guard
        # Refuses a pull request that edits a file this repository renders but
        # does not own. bc#7959 edited scripts/agent_shell_guard.harn, every
        # gate here passed, and Harn's v0.10.131 pre-publication policy then
        # refused Burin over the drift (bc#8027).
        #
        # It lives in THIS job rather than behind a path filter keyed on the
        # projections, because a filter keyed on the files a gate judges skips
        # on exactly the pull request that breaks it — the same reason stated at
        # the top of this job. The completeness half runs on push too, since
        # that is the direction a new unlisted projection arrives from.
        #
        # A deliberate restore is allowed by ONE trailer line per file in the
        # body, naming that exact path, or by the fleet bot's own authorship.
        # Per path, and a trailer for a path the pull request does not change is
        # itself an error, so the allowance cannot ride forward in a template
        # onto the next file — the same shape the shrink guard above uses for
        # its removal trailers. The body reaches the check through the
        # environment rather than the command line, so its text is never shell.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            node --experimental-strip-types --no-warnings scripts/check-fleet-owned-projections.ts
            exit 0
          fi
          git fetch --no-tags --quiet origin "${BASE_REF}"
          node --experimental-strip-types --no-warnings scripts/check-fleet-owned-projections.ts \
            --base "origin/${BASE_REF}"

  # The Harn repin rehearsal, as a required check.
  #
  # It is NOT path-filtered here on purpose. The workflow decides for itself
  # whether a rehearsal is owed (its `detect` job), because a path filter at
  # this level reports no result at all on a non-matching PR, and it would be a
  # second copy of a list that already has an owner. Unconditional here costs
  # about five seconds on a pull request that touches no repin machinery: the
  # heavy legs and the runner-capacity probe both skip, and nothing fetches
  # Harn.
  #
  # `permissions` is set here rather than at the workflow level because a
  # called workflow gets what the caller grants, and `detect` reads the PR's
  # changed files from the API. Nothing else in ci.yml needs that scope.
  harn-repin-rehearsal:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/harn-repin-rehearsal.yml
    # Named, not inherited. `secrets: inherit` hands the called workflow every
    # secret this one holds; the rehearsal needs exactly the read-only runner
    # app credential its capacity probe uses. zizmor's `secrets-inherit` audit
    # flags the broad form, and it is right to.
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Gate job for branch protection — always runs, succeeds only if all
  # applicable checks passed, were correctly skipped, or have an explicitly
  # unmeasured GitHub-confirmed runner acquisition failure.
  # Set THIS as the sole required check in repo settings.
  ci-status:
    name: CI status
    if: always()
    needs: [changes, runner-availability, mac-runner-placement, harn-prewarm, late-runner-availability, linked-runner-availability, actions, swift-lint, harn-lint, harn-check-scripts, repository-policies, generated-projections, harn-env-namespace, harness-ownership, harn-helper-tests, harn-previously-unwired-suite-tests, harn-capability-migration-tests, harn-pipeline-plan, harn-pipeline-tests, harn-pipeline-budget-margin, harn-repin-rehearsal, swift, swift-linux, server-check, server-image, site-check, scripts-typecheck, rust-tui-fast, rust-tui-macos, rust-tui-harn-linked, rust-tui-sandbox-proof, rust-tui-supply-chain, file-length-ratchet, cli-check, cli-check-macos, cli-check-windows, bench-pipelines, editor-extension-check, burin-portal-check, eval-catalog-shards, eval-catalog-check, eval-golden-selftest, eval-script-tests, review-calibration-corpus, trial-resume-process-canary, document-artifact-dogfood, experiment-engine-test, docs-lint, registry-shrink]
    # About a minute of work, so the 1 vCPU runner (bc#9618).
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      # A capacity-gated job that skips is invisible here: `ci-status` reads
      # `skipped` as pass, so a canary that never ran looks identical to one that
      # passed. That is how `trial-resume-process-canary` reached 20 consecutive
      # main runs and every PR without executing once (burin-code#5588).
      #
      # No predicate can fix this half. While `CI_SELFHOSTED_DISABLED` retires
      # the Linux lane there is genuinely nowhere for a self-hosted-only job to
      # run, so skipping is correct — but it must not be SILENT. Announce it, and
      # say which of the three states caused it, because "retired on purpose",
      # "pool does not exist" and "probe could not see the fleet" call for very
      # different responses and the per-lane booleans cannot tell them apart.
      #
      # Never fails the aggregate: a deliberately retired lane is not a broken
      # build. The verdict logic below is untouched.
      #
      # `eval-script-tests` stands in for "did this commit touch eval_scripts":
      # it is already in `needs` and gates on the same path filter, so if it ran
      # the filter fired.
      #
      # `changes` is in `needs` too, and has to be. It used to be left out to
      # avoid owing it a wall-time budget entry, and that omission was a merge
      # bypass: when `changes` FAILS, every job downstream of it reports
      # `skipped`, not `failure`, so the verdict below saw 40 skips, zero
      # failures, and certified the run green. Observed live on 2026-08-17,
      # when dorny/paths-filter started returning "Resource not accessible by
      # integration": `Detect changes` went red at 14:25:03Z and `CI status`
      # reported SUCCESS 18 seconds later, on a PR where nothing else had run.
      # The runner-availability re-reads are in `needs` for the same reason:
      # a failed re-read skips every job that reads it. The budget entry is the
      # cheaper half of that trade.
      - name: Announce capacity-gated jobs that did not run
        if: >-
          needs.trial-resume-process-canary.result == 'skipped' &&
          needs.eval-script-tests.result != 'skipped'
        env:
          CAPACITY: ${{ needs.late-runner-availability.outputs.capacity }}
          RETIRED: ${{ needs.late-runner-availability.outputs.selfhosted_disabled }}
          BURIN_DISABLED: ${{ vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          measured="$(printf '%s' "${CAPACITY:-{\}}" | jq -r '.linux.measured // false')"
          online="$(printf '%s' "${CAPACITY:-{\}}" | jq -r '.linux.online // 0')"
          eligible="$(printf '%s' "${CAPACITY:-{\}}" | jq -r '.linux.eligible // false')"

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            reason="the crash-recovery workload is reserved for main pushes and merge groups"
          elif [ "${BURIN_DISABLED}" = "true" ]; then
            reason="BURIN_CI_DISABLE_SELFHOSTED_LINUX disabled the owned Linux lane and no supported paid route was selected"
          elif [ "${measured}" != "true" ]; then
            if [ -n "${RETIRED}" ]; then
              reason="CI_SELFHOSTED_DISABLED retired the Linux lane ('${RETIRED}')"
            else
              reason="the runner-availability probe could not see the fleet, which is NOT the same as a busy or absent pool and should be investigated"
            fi
          elif [ "${eligible}" != "true" ]; then
            reason="the measured Linux pool is below its online minimum (online=${online}, eligible=false)"
          else
            reason="unexpected: capacity reports ${online} online Linux runner(s), so the gate should have opened"
          fi

          echo "::warning::trial-resume-process-canary did NOT run on a commit that touches eval_scripts: ${reason}. SIGKILL/resume behavior is unverified for this commit."
          {
            echo "### Eval run resumes after a crash: not run"
            echo
            echo "This commit touches \`eval_scripts\` paths but the canary was"
            echo "skipped because ${reason}."
            echo
            echo "**SIGKILL/resume trial-adoption behavior is unverified for this"
            echo "commit.** It has no GitHub-hosted fallback — a 2-vCPU runner"
            echo "starves the workload and fast-fails at ~1m."
            echo
            echo "Capacity: \`${CAPACITY}\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Check out CI status script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node for verdict classifier
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Set up pnpm for verdict classifier
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install verdict classifier dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # A path-gated job that is red on main vanishes the moment a commit lands
      # whose paths do not select it: `skipped` is not a failure, so the verdict
      # below certifies the run and main reads green while the job stays broken.
      # Observed 2026-09-05, when `Eval script unit tests` FAILED on 6a366eae14
      # and was SKIPPED on 5dc248df8e with the same failure still in the tree
      # (bc#7917).
      #
      # The daily scheduled run already forces every surface and is the right
      # backstop, but it is a backstop: the 2026-09-04 run was green and the
      # reds landed after it, so a day of commits carried an invisible failure.
      # This closes the window per commit, from runs that already happened.
      #
      # Not `continue-on-error`, unlike the two diagnostic steps above. Those
      # enrich a verdict that is already decided; this one IS a verdict, and a
      # verdict that cannot fail is a report. It fails closed on an unreadable
      # API for the same reason.
      #
      # Deliberately NOT skipped when the run is otherwise green. A green run is
      # exactly the case this exists for.
      #
      # The gate's question is about main, so main's copy answers it. A pull
      # request's test-merge commit can sit on an old base: run 35811498801 ran
      # the copy from before #9160 and reported a red main had already fixed,
      # which blocked every approved pull request on that base (bc#9235). The
      # pull request's own copy is still judged by its unit tests. Its imports
      # resolve node_modules from the workspace installed above, and it reads
      # this head's workflow from the working directory.
      # A proven push ran almost nothing, and what it skipped its merge_group run
      # proved; there is no inherited red to judge.
      - name: Check out main's inherited-red gate
        if: github.event_name != 'push' || needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .main-inherited-red-gate
          sparse-checkout: scripts
          persist-credentials: false
      - name: Refuse a head that skipped a job main is currently red on
        if: github.event_name != 'push' || needs.changes.outputs.heavy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_HARN_PIN_SELECTED: ${{ needs.changes.outputs.harn_pin }}
        run: |
          node --experimental-strip-types --no-warnings \
            .main-inherited-red-gate/scripts/check-skipped-job-inherited-red.ts --max-runs 8
      - name: Diagnose missing failed-job logs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --no-warnings scripts/ci-check-verdict.ts missing-job-logs \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID"
      # `needs.*.result` says `cancelled` both for a job whose runner was lost
      # before any step ran and for one cancelled mid-command. The aggregate
      # below reads this typed per-job list to name the class and the exact
      # job. This census is required even when a reusable summary succeeded:
      # its children can still carry an explicitly unmeasured capacity result.
      - name: Classify dependency outcomes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node --experimental-strip-types --no-warnings scripts/ci-check-verdict.ts dependency-outcomes \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --out "$RUNNER_TEMP/ci-dependency-outcomes.json"
      - name: Check for failures
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_DEPENDENCY_OUTCOMES: ${{ runner.temp }}/ci-dependency-outcomes.json
          HAS_FAILURE_OR_CANCELLATION: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          HAS_SUCCESS: ${{ contains(needs.*.result, 'success') }}
          CI_PATH_SURFACES: ${{ needs.changes.outputs.path_surfaces }}
          # Surfaces selected by the event rather than by paths. ci-status.sh
          # refuses a CI_*_CHECKS table that neither list names.
          CI_EVENT_SURFACES: main_push repository_policies harn_lint harn_check_scripts

          CI_MAIN_PUSH_SELECTED: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.heavy == 'true') }}
          CI_MAIN_PUSH_CHECKS: |
            harn-prewarm|success|${{ needs.harn-prewarm.result }}
            actions|success|${{ needs.actions.result }}
            file-length-ratchet|success|${{ needs.file-length-ratchet.result }}

          CI_REPOSITORY_POLICIES_SELECTED: ${{ needs.changes.outputs.repository_policies_selected }}
          CI_REPOSITORY_POLICIES_CHECKS: |
            repository-policies|success|${{ needs.repository-policies.result }}

          CI_HARN_LINT_SELECTED: ${{ needs.changes.outputs.harn_lint_selected }}
          CI_HARN_LINT_CHECKS: |
            harn-lint|success|${{ needs.harn-lint.result }}

          CI_HARN_CHECK_SCRIPTS_SELECTED: ${{ needs.changes.outputs.harn_check_scripts_selected }}
          CI_HARN_CHECK_SCRIPTS_CHECKS: |
            harn-check-scripts|success|${{ needs.harn-check-scripts.result }}

          CI_SWIFT_SELECTED: ${{ needs.changes.outputs.swift }}
          CI_SWIFT_CHECKS: |
            swift-lint|success|${{ needs.swift-lint.result }}
            swift-linux|${{ needs.changes.outputs.swift_linux_selected == 'true' && 'success' || 'skipped' }}|${{ needs.swift-linux.result }}
          # The job's own eligibility output, not the raw path surface, so one
          # decision owns both whether the suite runs and whether its skip is
          # allowed (#7587). check-ci-script-contracts.sh runs this projection.
          CI_SWIFT_MACOS_SELECTED: ${{ needs.changes.outputs.swift_full_selected }}
          CI_SWIFT_MACOS_CHECKS: |
            swift|success|${{ needs.swift.outputs.full || 'skipped' }}
          CI_SWIFT_BURINAPP_SELECTED: ${{ needs.changes.outputs.swift-burinapp }}
          CI_SWIFT_BURINAPP_CHECKS: |
            swift|${{ needs.changes.outputs.swift_app_selected == 'true' && 'success' || 'skipped' }}|${{ needs.swift.outputs.app || 'skipped' }}
          CI_SWIFT_BURINAPP_TESTS_SELECTED: ${{ needs.changes.outputs.swift-burinapp-tests }}
          CI_SWIFT_BURINAPP_TESTS_CHECKS: |
            swift|${{ needs.changes.outputs.swift_app_tests_selected == 'true' && 'success' || 'skipped' }}|${{ needs.swift.outputs.app-tests || 'skipped' }}
          CI_SWIFT_SUBPROCESS_SELECTED: ${{ needs.changes.outputs.swift_integration_selected }}
          CI_SWIFT_SUBPROCESS_CHECKS: |
            swift|${{ needs.changes.outputs.swift_integration_selected == 'true' && 'success' || 'skipped' }}|${{ needs.swift.outputs.integration || 'skipped' }}

          CI_HARN_SELECTED: ${{ needs.changes.outputs.harn }}
          CI_HARN_CHECKS: |
            harn-helper-tests|success|${{ needs.harn-helper-tests.result }}
            harn-previously-unwired-suite-tests|${{ needs.changes.outputs.harn_suites_heavy_selected == 'true' && 'success' || 'skipped' }}|${{ needs.harn-previously-unwired-suite-tests.result }}
            harn-capability-migration-tests|${{ needs.changes.outputs.harn_suites_heavy_selected == 'true' && 'success' || 'skipped' }}|${{ needs.harn-capability-migration-tests.result }}
            harness-ownership|success|${{ needs.harness-ownership.result }}
            file-length-ratchet|success|${{ needs.file-length-ratchet.result }}
          CI_HARN_ENV_NAMESPACE_SELECTED: ${{ needs.changes.outputs.harn_env_namespace }}
          CI_HARN_ENV_NAMESPACE_CHECKS: |
            harn-env-namespace|success|${{ needs.harn-env-namespace.result }}
          CI_HARN_PIPELINE_TESTS_SELECTED: ${{ needs.changes.outputs.harn_pipeline_tests }}
          CI_HARN_PIPELINE_TESTS_CHECKS: |
            harn-pipeline-plan|${{ needs.changes.outputs.harn_pipeline_heavy_selected == 'true' && 'success' || 'skipped' }}|${{ needs.harn-pipeline-plan.result }}
            harn-pipeline-tests|${{ needs.changes.outputs.harn_pipeline_heavy_selected == 'true' && 'success' || 'skipped' }}|${{ needs.harn-pipeline-tests.result }}
            harn-pipeline-budget-margin|${{ needs.changes.outputs.harn_pipeline_heavy_selected == 'true' && 'success' || 'skipped' }}|${{ needs.harn-pipeline-budget-margin.result }}

          CI_TS_SELECTED: ${{ needs.changes.outputs.ts }}
          CI_TS_CHECKS: |
            file-length-ratchet|success|${{ needs.file-length-ratchet.result }}
          CI_SCRIPTS_TS_SELECTED: ${{ needs.changes.outputs.scripts_ts }}
          CI_SCRIPTS_TS_CHECKS: |
            scripts-typecheck|success|${{ needs.scripts-typecheck.result }}
          CI_SERVER_SELECTED: ${{ needs.changes.outputs.server }}
          CI_SERVER_CHECKS: |
            server-check|success|${{ needs.server-check.result }}
            server-image|success|${{ needs.server-image.result }}
          CI_SITE_SELECTED: ${{ needs.changes.outputs.site }}
          CI_SITE_CHECKS: |
            site-check|success|${{ needs.site-check.result }}

          # The named selection outputs above are the authority for Rust job
          # eligibility. This aggregate verifies the resulting terminal state;
          # the impact-plan structural gate verifies that selection is correct.
          CI_RUST_TUI_SELECTED: ${{ needs.changes.outputs.rust-tui }}
          CI_RUST_TUI_CHECKS: |
            file-length-ratchet|success|${{ needs.file-length-ratchet.result }}
            rust-tui-fast|${{ needs.changes.outputs.rust_tui_fast_selected == 'true' && 'success' || 'skipped' }}|${{ needs.rust-tui-fast.result }}
            rust-tui-harn-linked|${{ needs.changes.outputs.rust_tui_harn_linked_selected == 'true' && 'success' || 'skipped' }}|${{ needs.rust-tui-harn-linked.result }}
            rust-tui-sandbox-proof|${{ needs.changes.outputs.rust_tui_harn_linked_selected == 'true' && 'success' || 'skipped' }}|${{ needs.rust-tui-sandbox-proof.result }}
            rust-tui-macos|${{ needs.changes.outputs.rust_tui_macos_selected == 'true' && 'success' || 'skipped' }}|${{ needs.rust-tui-macos.result }}
          CI_RUST_TUI_SUPPLY_CHAIN_SELECTED: ${{ needs.changes.outputs.rust_tui_supply_chain }}
          CI_RUST_TUI_SUPPLY_CHAIN_CHECKS: |
            rust-tui-supply-chain|success|${{ needs.rust-tui-supply-chain.result }}

          CI_CLI_SELECTED: ${{ needs.changes.outputs.cli }}
          CI_CLI_CHECKS: |
            cli-check|success|${{ needs.cli-check.result }}
          CI_CLI_PLATFORM_SELECTED: ${{ needs.changes.outputs.cli_platform }}
          CI_CLI_PLATFORM_CHECKS: |
            cli-check-macos|${{ needs.changes.outputs.cli_platform_macos_selected == 'true' && 'success' || 'skipped' }}|${{ needs.cli-check-macos.result }}
            cli-check-windows|${{ needs.changes.outputs.cli_platform_windows_selected == 'true' && 'success' || 'skipped' }}|${{ needs.cli-check-windows.result }}
          CI_EDITOR_EXTENSION_SELECTED: ${{ needs.changes.outputs.editor_extension }}
          CI_EDITOR_EXTENSION_CHECKS: |
            editor-extension-check|success|${{ needs.editor-extension-check.result }}

          CI_EVAL_SELECTED: ${{ needs.changes.outputs.eval }}
          CI_EVAL_CHECKS: |
            burin-portal-check|success|${{ needs.burin-portal-check.result }}
          # The job's own selector includes pin pull requests. The raw path
          # surface remains narrower because Harn pin files are runtime inputs,
          # not edits to the eval scripts.
          CI_EVAL_SCRIPTS_SELECTED: ${{ needs.changes.outputs.eval_script_tests_selected }}
          CI_EVAL_SCRIPTS_CHECKS: |
            eval-script-tests|${{ needs.changes.outputs.eval_script_tests_selected == 'true' && 'success' || 'skipped' }}|${{ needs.eval-script-tests.result }}
            trial-resume-process-canary|${{ ((github.event_name == 'merge_group' || github.event_name == 'push') && (vars.BURIN_CI_DISABLE_SELFHOSTED_LINUX != 'true' || (vars.BURIN_CI_HEAVY_PREFER_PAID == 'true' && vars.BURIN_CI_PAID_LINUX_PROVIDER == 'ubicloud' && github.event_name != 'pull_request')) && needs.late-runner-availability.result == 'success' && fromJSON(needs.late-runner-availability.outputs.capacity).linux.measured && fromJSON(needs.late-runner-availability.outputs.capacity).linux.eligible) && 'success' || 'skipped' }}|${{ needs.trial-resume-process-canary.result }}
          CI_REVIEW_CALIBRATION_SELECTED: ${{ needs.changes.outputs.review_calibration }}
          CI_REVIEW_CALIBRATION_CHECKS: |
            review-calibration-corpus|${{ needs.changes.outputs.review_calibration_selected == 'true' && 'success' || 'skipped' }}|${{ needs.review-calibration-corpus.result }}
          CI_EVAL_CATALOG_SELECTED: ${{ needs.changes.outputs.eval_catalog }}
          CI_EVAL_CATALOG_CHECKS: |
            eval-catalog-shards|${{ needs.changes.outputs.eval_catalog_shards_selected == 'true' && 'success' || 'skipped' }}|${{ needs.eval-catalog-shards.result }}
            eval-catalog-check|success|${{ needs.eval-catalog-check.result }}
            eval-golden-selftest|${{ needs.changes.outputs.eval_golden_selftest_selected == 'true' && 'success' || 'skipped' }}|${{ needs.eval-golden-selftest.result }}
          CI_GOLDEN_REPLAY_SELECTED: ${{ needs.changes.outputs.golden_replay }}
          CI_GOLDEN_REPLAY_CHECKS: |
            eval-golden-selftest|${{ needs.changes.outputs.eval_golden_selftest_selected == 'true' && 'success' || 'skipped' }}|${{ needs.eval-golden-selftest.result }}

          CI_DOCUMENT_ARTIFACTS_SELECTED: ${{ needs.changes.outputs.document_artifacts }}
          CI_DOCUMENT_ARTIFACTS_CHECKS: |
            document-artifact-dogfood|${{ needs.changes.outputs.document_artifacts_selected == 'true' && 'success' || 'skipped' }}|${{ needs.document-artifact-dogfood.result }}
          CI_EXPERIMENT_ENGINE_SELECTED: ${{ needs.changes.outputs.experiment_engine }}
          CI_EXPERIMENT_ENGINE_CHECKS: |
            experiment-engine-test|${{ needs.changes.outputs.experiment_engine_test_selected == 'true' && 'success' || 'skipped' }}|${{ needs.experiment-engine-test.result }}
          CI_BENCH_SELECTED: ${{ needs.changes.outputs.bench }}
          CI_BENCH_CHECKS: |
            bench-pipelines|${{ needs.changes.outputs.bench_selected == 'true' && 'success' || 'skipped' }}|${{ needs.bench-pipelines.result }}
          CI_DOCS_SELECTED: ${{ needs.changes.outputs.docs }}
          CI_DOCS_CHECKS: |
            docs-lint|success|${{ needs.docs-lint.result }}
        run: scripts/ci-status.sh
