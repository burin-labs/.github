name: runner-availability (reusable)

# Reusable detection of idle self-hosted runners, by OS, with safe fall-through
# to GitHub-hosted runners. Callers gate each job's `runs-on` on these boolean
# outputs via a ternary, for example:
#
#   jobs:
#     runner-availability:
#       uses: burin-labs/.github/.github/workflows/runner-availability.yml@main
#       secrets:
#         RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
#         RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#     build:
#       needs: runner-availability
#       runs-on: ${{ needs.runner-availability.outputs.linux == 'true'
#         && fromJSON('["self-hosted", "Linux", "harn-ci-stable"]') || 'ubuntu-latest' }}
#
# The `.busy | not` filter means a busy/absent self-hosted pool reports that OS
# as unavailable, so callers route to hosted runners instead of queueing behind
# active local work.
#
# Self-hosted routing can also be retired wholesale by the organization variable
# `CI_SELFHOSTED_DISABLED`, which this detector is the single owner of. Because
# every caller already gates `runs-on` on these outputs, one flip of that
# variable moves every repo's every lane to GitHub-hosted runners with no
# per-repo variable, no workflow edit, and no runner-label surgery. Reach for it
# when the hosted allowance would otherwise expire unused (it is a monthly
# use-it-or-lose-it grant, and public repositories get hosted minutes free), or
# when the self-hosted boxes are needed for local eval work.
#
# Label surgery is the wrong tool for the same job: it is invisible from the
# workflow source, it silently strands the minority of jobs that hardcode
# self-hosted labels without an availability gate, and on some runners here the
# `self-hosted`/`Linux`/`X64` labels are registered as *custom* rather than
# read-only, so a label rewrite can make a runner unaddressable entirely.
#
# Detection is scoped to the runner GROUPS named by `runner_groups`, never the
# flat `/orgs/{org}/actions/runners` list. Managed-runner vendors (Blacksmith,
# Namespace, ...) register one ephemeral runner per job into their own groups
# and do not deregister them, so that flat list grows without bound: burin-labs
# reached 1015 registrations, 1002 of them vendor ephemerals and 997 of those
# offline. A single unpaginated page of it returned zero self-hosted matches
# while 9 Linux and 4 macOS runners sat online and idle, so every caller routed
# to paid GitHub-hosted runners. Group scoping keeps the query O(#groups)
# regardless of vendor fleet size; paginating the flat list would only have
# deferred the same failure.
on:
  workflow_call:
    inputs:
      runner_tag:
        description: "Default label required on self-hosted runners"
        type: string
        default: harn-ci
        required: false
      runner_groups:
        description: >-
          Comma-separated runner group names holding this org's own self-hosted
          capacity. Must exclude vendor-managed groups.
        type: string
        default: Default,burin-labs-mac-mbp
        required: false
      linux_runner_tag:
        description: "Linux-specific self-hosted runner label"
        type: string
        default: harn-ci-stable
        required: false
      linux_big_runner_tag:
        description: >-
          Label carried only by Linux runners sized (cores/disk) for
          multi-gigabyte build+test lanes
        type: string
        default: harn-ci-big
        required: false
      macos_runner_tag:
        description: "macOS-specific self-hosted runner label"
        type: string
        default: harn-ci
        required: false
      windows_runner_tag:
        description: "Windows-specific self-hosted runner label"
        type: string
        default: harn-ci
        required: false
    # Declared explicitly so callers can avoid `secrets: inherit` and pass only
    # the GitHub App credentials this detector needs. Both are optional:
    # fork/dependabot runs without them and fall through to hosted runners.
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
    outputs:
      linux:
        description: "true when an idle matching self-hosted Linux runner exists"
        value: ${{ jobs.detect.outputs.linux }}
      linux_big:
        description: "true when an idle big-lane self-hosted Linux runner exists"
        value: ${{ jobs.detect.outputs.linux_big }}
      windows:
        description: "true when an idle matching self-hosted Windows runner exists"
        value: ${{ jobs.detect.outputs.windows }}
      macos:
        description: "true when an idle matching self-hosted macOS runner exists"
        value: ${{ jobs.detect.outputs.macos }}
      selfhosted_disabled:
        description: >-
          Comma list of lanes `CI_SELFHOSTED_DISABLED` has retired, empty when
          self-hosted routing is on offer. Deliberately distinct from the
          per-OS outputs above, which also go false when the fleet is merely
          busy. A job that is self-hosted-only by nature and *wants* to queue
          behind busy runners must gate on this, not on `linux`/`macos`:
          gating such a job on availability would silently drop its coverage
          on any busy day, which is the "busy fleet" / "deliberately off"
          conflation the loud fall-through reporting exists to prevent.
        value: ${{ jobs.detect.outputs.selfhosted_disabled }}
      capacity:
        description: >-
          JSON object of the measured fleet, keyed by lane (linux, linux_big,
          macos, windows), each `{online, idle, measured}`. Consume with
          `fromJSON(...).linux.idle`.

          The per-lane booleans above answer one question - "can a job land
          right now" - by collapsing three distinct states into false: no pool
          exists, the pool is busy, and the pool was never measured. A caller
          whose policy needs to tell those apart cannot recover them from a
          boolean, which is why harn-cloud forked this detector wholesale to
          get at the counts. Two policies that need them:

            * Reserve capacity. "Route Rust to self-hosted only when at least
              two runners are idle, so the Docker job still has one" is
              `fromJSON(...).linux.idle > 1`.
            * Queue deliberately. "This lane prefers self-hosted and is willing
              to wait behind in-flight work" is `.linux.online > 0`, which
              stays true on a busy fleet where `linux` is already false.

          `measured` is false whenever the counts are not an observation of the
          fleet: the lane is retired by `CI_SELFHOSTED_DISABLED`, or the probe
          could not see the fleet at all. Counts are 0 in both cases, so a
          caller that treats 0 as "busy" would repeat the conflation this
          detector exists to prevent. Gate on `measured` before reading counts.
        value: ${{ jobs.detect.outputs.capacity }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect self-hosted runner availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Promote to job env so step-level `if:` can gate on secret presence; the
      # `secrets` context is unavailable directly in step `if:` expressions.
      HAS_RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID != '' }}
    outputs:
      linux: ${{ steps.detect.outputs.linux }}
      linux_big: ${{ steps.detect.outputs.linux_big }}
      windows: ${{ steps.detect.outputs.windows }}
      macos: ${{ steps.detect.outputs.macos }}
      selfhosted_disabled: ${{ steps.detect.outputs.selfhosted_disabled }}
      capacity: ${{ steps.detect.outputs.capacity }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        if: ${{ env.HAS_RELEASE_APP_CLIENT_ID == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Required for /orgs/{org}/actions/runners; without it the app token
          # returns 403 and the detector falls back to hosted runners.
          permission-actions: read
          permission-organization-self-hosted-runners: read
      - id: detect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          DEFAULT_TAG: ${{ inputs.runner_tag }}
          LINUX_TAG: ${{ inputs.linux_runner_tag }}
          LINUX_BIG_TAG: ${{ inputs.linux_big_runner_tag }}
          MACOS_TAG: ${{ inputs.macos_runner_tag }}
          WINDOWS_TAG: ${{ inputs.windows_runner_tag }}
          RUNNER_GROUPS: ${{ inputs.runner_groups }}
          SELFHOSTED_DISABLED: ${{ vars.CI_SELFHOSTED_DISABLED }}
        run: |
          set -euo pipefail

          # Resolve the kill switch before probing anything. Accepted values:
          #
          #   unset | "" | none | false   self-hosted routing offered (default)
          #   all | true                  every OS reports unavailable
          #   comma list                  any of linux, linux_big, macos, windows
          #
          # `linux` implies `linux_big`. The big lane is a strict subset of the
          # Linux pool, so disabling Linux while still advertising linux_big
          # would report capacity on a pool callers were just told not to use.
          disabled=""
          case "$(printf '%s' "${SELFHOSTED_DISABLED:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
            "" | none | false) : ;;
            all | true) disabled="linux linux_big macos windows" ;;
            *)
              for token in $(printf '%s' "$SELFHOSTED_DISABLED" | tr ',' ' ' | tr '[:upper:]' '[:lower:]'); do
                case "$token" in
                  all | true) disabled="$disabled linux linux_big macos windows" ;;
                  none | false) : ;;
                  linux) disabled="$disabled linux linux_big" ;;
                  linux_big) disabled="$disabled linux_big" ;;
                  macos) disabled="$disabled macos" ;;
                  windows) disabled="$disabled windows" ;;
                  *) echo "::warning::runner-availability: ignoring unknown CI_SELFHOSTED_DISABLED token '$token'" ;;
                esac
              done
              ;;
          esac

          is_disabled() { case " $disabled " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }

          # Every early exit publishes the same thing: no lane is available and
          # nothing was measured. Funnel them through one function rather than
          # repeating the key list. GITHUB_OUTPUT is append-only and read once
          # at step end, so an exit path that forgets a key does not fail - the
          # key silently arrives at the caller as the empty string, and
          # `fromJSON('')` then fails inside the caller's `runs-on`, where the
          # error is far from its cause.
          report_unmeasured() {
            {
              echo "linux=false"
              echo "linux_big=false"
              echo "windows=false"
              echo "macos=false"
              echo "capacity=$(jq -c -n '["linux", "linux_big", "macos", "windows"]
                | map({key: ., value: {online: 0, idle: 0, measured: false}})
                | from_entries')"
            } >> "$GITHUB_OUTPUT"
          }

          # Publish the switch state before any exit path below. GITHUB_OUTPUT is
          # append-only and read once at step end, so writing it here covers all
          # four returns (the fast path, the missing-token path, every
          # `fall_through`, and the normal end) without repeating the line at
          # each one, where a later-added path could forget it.
          echo "selfhosted_disabled=$(printf '%s' "$disabled" | tr ' ' '\n' \
            | sed '/^$/d' | sort -u | paste -sd, -)" >> "$GITHUB_OUTPUT"

          # Always announce the switch, including when it is off. An operator
          # reading a run log must be able to tell "the fleet was busy" from
          # "routing was deliberately pinned to hosted" without guessing.
          if [ -n "$disabled" ]; then
            echo "::notice::runner-availability: CI_SELFHOSTED_DISABLED='${SELFHOSTED_DISABLED}' pins to GitHub-hosted for:${disabled}"
          else
            echo "::notice::runner-availability: CI_SELFHOSTED_DISABLED is off; probing self-hosted capacity"
          fi

          # Fast path: with every OS disabled there is nothing to measure, so
          # skip the org API calls entirely rather than probing a fleet whose
          # answer cannot change the outcome.
          if is_disabled linux && is_disabled linux_big \
            && is_disabled macos && is_disabled windows; then
            report_unmeasured
            exit 0
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::runner-availability: no GH_TOKEN; using GitHub-hosted runners"
            report_unmeasured
            exit 0
          fi

          gh_api_stderr="$(mktemp)"

          # Every fall-through below is a FALSE report of "no self-hosted
          # capacity" that silently routes the caller onto paid GitHub-hosted
          # runners. It must always be loud: a probe that cannot see the fleet
          # is not the same as a fleet that is busy, and the previous version
          # of this detector conflated the two for six days.
          fall_through() {
            echo "::warning::runner-availability: $1; falling back to GitHub-hosted runners"
            report_unmeasured
            exit 0
          }

          group_list="$(gh api --paginate --slurp \
            "/orgs/${OWNER}/actions/runner-groups?per_page=100" \
            2>"$gh_api_stderr" || true)"
          if [ -z "$group_list" ] || ! echo "$group_list" | jq -e '.[0].runner_groups' > /dev/null 2>&1; then
            err_excerpt="$(head -c 300 "$gh_api_stderr" | tr '\n' ' ')"
            body_excerpt="$(echo "$group_list" | head -c 300 | tr '\n' ' ')"
            fall_through "could not list /orgs/${OWNER}/actions/runner-groups. gh stderr: ${err_excerpt} | response body: ${body_excerpt}"
          fi

          # Resolve the declared group names to ids. An unresolved name means
          # the group was renamed or deleted, which silently shrinks the
          # observable fleet, so treat it as a hard detection failure rather
          # than quietly probing fewer groups.
          #
          # A name can resolve to MORE than one id. Runner group names are not
          # unique across scopes: burin-labs has two groups named "Default" -
          # the org-level one holding all 9 Linux runners, and an empty
          # enterprise-level one. The previous `from_entries` collapsed the
          # duplicate and kept the LAST, which was the empty group, so the
          # detector observed 4 runners instead of 13 and reported
          # `linux=false` on every single run. Both callers' Linux lanes had
          # silently routed to GitHub-hosted runners ever since, and nothing
          # failed, because falling through to hosted is exactly what a busy
          # fleet is supposed to look like. That is the failure mode the loud
          # `fall_through` reporting was added to prevent, arriving through a
          # path it did not cover.
          #
          # So take the union of every matching id rather than picking one. If
          # two groups share a name, the honest reading of "probe the group
          # called X" is to probe all of them.
          resolved="$(echo "$group_list" | jq -c --arg names "$RUNNER_GROUPS" '
            ([$names | split(",") | .[] | gsub("^\\s+|\\s+$"; "")] | map(select(. != ""))) as $want
            | ([.[].runner_groups[]] | map({name, id})) as $have
            | {
                found: [$want[] as $n | $have[] | select(.name == $n) | {name, id}],
                missing: [$want[] | select([$have[] | .name] | index(.) == null)],
                ambiguous: [$want[] as $n
                  | {name: $n, ids: [$have[] | select(.name == $n) | .id]}
                  | select(.ids | length > 1)],
              }')"
          # Surface the collapse rather than silently papering over it: a
          # duplicate name is a real misconfiguration even though the union
          # keeps detection correct.
          echo "$resolved" | jq -r '.ambiguous[]
            | "::warning::runner-availability: runner group name \(.name) resolves to \(.ids | length) groups (ids \(.ids | join(", "))); probing all of them. Rename them to be unique."'
          missing="$(echo "$resolved" | jq -r '.missing | join(", ")')"
          if [ -n "$missing" ]; then
            known="$(echo "$group_list" | jq -r '[.[].runner_groups[].name] | join(", ")')"
            fall_through "runner group(s) not found: ${missing}. Known groups: ${known}. Update the caller's runner_groups input"
          fi

          # Query each declared group instead of the flat org runner list. The
          # flat list is dominated by vendor ephemerals (see header comment).
          runners="[]"
          for group_id in $(echo "$resolved" | jq -r '.found[].id'); do
            group_runners="$(gh api --paginate --slurp \
              "/orgs/${OWNER}/actions/runner-groups/${group_id}/runners?per_page=100" \
              2>"$gh_api_stderr" || true)"
            if [ -z "$group_runners" ] || ! echo "$group_runners" | jq -e '.[0].runners' > /dev/null 2>&1; then
              err_excerpt="$(head -c 300 "$gh_api_stderr" | tr '\n' ' ')"
              fall_through "could not list runners in group ${group_id}. gh stderr: ${err_excerpt}"
            fi
            # Deduplicate by runner id: one runner can be visible through more
            # than one probed group, and now that a name may resolve to several
            # groups it would otherwise be counted twice.
            runners="$(jq -c -n --argjson acc "$runners" --argjson next "$group_runners" \
              '($acc + [$next[].runners[]]) | unique_by(.id)')"
          done

          runner_list="$(jq -c -n --argjson r "$runners" '{runners: $r}')"
          observed="$(echo "$runner_list" | jq -r '.runners | length')"
          echo "::notice::runner-availability: observed ${observed} runner(s) across group(s) ${RUNNER_GROUPS}"
          if [ "$observed" -eq 0 ]; then
            fall_through "declared groups (${RUNNER_GROUPS}) contain no runners at all, which indicates a misconfigured runner_groups input rather than a busy fleet"
          fi

          # One query for both counts. `online` alone means the pool exists and
          # is reachable; `idle` additionally requires the runner be free. The
          # gap between them is in-flight work, and keeping the two separate is
          # the whole point of the `capacity` output: collapsing them is what
          # makes "no pool" and "busy pool" indistinguishable to a caller.
          count_matching() {
            # $1 OS label, $2 required tag, $3 "idle" to also require not busy
            echo "$runner_list" | jq -r --arg os "$1" --arg tag "$2" --arg mode "$3" '
              [ .runners[]
                | select(.status == "online")
                | select($mode != "idle" or (.busy | not))
                | select(any(.labels[].name; . == $tag))
                | select(any(.labels[].name; . == $os))
              ] | length'
          }

          capacity='{}'
          record_capacity() {
            # $1 lane, $2 online, $3 idle, $4 measured
            capacity="$(jq -c -n --argjson acc "$capacity" --arg lane "$1" \
              --argjson online "$2" --argjson idle "$3" --argjson measured "$4" \
              '$acc + {($lane): {online: $online, idle: $idle, measured: $measured}}')"
          }

          for os_label in Linux Windows macOS; do
            tag="$DEFAULT_TAG"
            case "$os_label" in
              Linux) tag="$LINUX_TAG" ;;
              Windows) tag="$WINDOWS_TAG" ;;
              macOS) tag="$MACOS_TAG" ;;
            esac
            key="$(echo "$os_label" | tr '[:upper:]' '[:lower:]')"
            if is_disabled "$key"; then
              echo "${key}=false" >> "$GITHUB_OUTPUT"
              echo "::notice::runner-availability ${key}=false (pinned to GitHub-hosted by CI_SELFHOSTED_DISABLED; capacity not measured)"
              record_capacity "$key" 0 0 false
              continue
            fi
            count="$(count_matching "$os_label" "$tag" idle)"
            online="$(count_matching "$os_label" "$tag" any)"
            if [ "$count" -gt 0 ]; then
              available=true
            else
              available=false
            fi
            echo "${key}=${available}" >> "$GITHUB_OUTPUT"
            record_capacity "$key" "$online" "$count" true
            echo "::notice::runner-availability ${key}=${available} (${count} idle of ${online} online ${os_label} ${tag} runner(s))"
          done

          # Big-lane Linux capacity is a strict subset of the pool: only
          # runners a human explicitly labeled for multi-gigabyte build+test
          # workspaces (cores + disk headroom) count, and the same
          # idle-and-online rule applies so callers overflow to hosted runners
          # instead of queueing.
          #
          # This branch deliberately does not `exit 0`: the capacity object is
          # published once at the end of the step, and an early exit here would
          # drop it on exactly the kill-switch path.
          if is_disabled linux_big; then
            echo "linux_big=false" >> "$GITHUB_OUTPUT"
            echo "::notice::runner-availability linux_big=false (pinned to GitHub-hosted by CI_SELFHOSTED_DISABLED; capacity not measured)"
            record_capacity linux_big 0 0 false
          else
            big_count="$(count_matching Linux "$LINUX_BIG_TAG" idle)"
            big_online="$(count_matching Linux "$LINUX_BIG_TAG" any)"
            if [ "$big_count" -gt 0 ]; then
              echo "linux_big=true" >> "$GITHUB_OUTPUT"
            else
              echo "linux_big=false" >> "$GITHUB_OUTPUT"
            fi
            record_capacity linux_big "$big_online" "$big_count" true
            echo "::notice::runner-availability linux_big=$([ "$big_count" -gt 0 ] && echo true || echo false) (${big_count} idle of ${big_online} online Linux ${LINUX_BIG_TAG} runner(s))"
          fi

          echo "capacity=${capacity}" >> "$GITHUB_OUTPUT"
          echo "::notice::runner-availability capacity=${capacity}"
