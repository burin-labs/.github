name: Smart Ship

# Reusable: one look at each pull request labeled `ship`. A look lands an
# approved, green head or hands what blocks it to one bounded repair agent; see
# scripts/smart-ship/ship.harn. Callers subscribe to the events and pass them
# all through. The script reads the pull request fresh, so a wake that changes
# nothing only costs a look.

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner label, or list of labels, for each look.
        type: string
        default: '"ubuntu-24.04"'
      repair:
        description: >-
          Let a blocked pull request get one bounded repair agent. Off unless a
          caller opts in; the agent also needs OPENAI_API_KEY.
        type: boolean
        default: false
      repair-turns:
        description: Model turns one repair attempt may take before its unfinished work is kept for the next.
        type: number
        default: 60
      repair-environment:
        description: >-
          GitHub environment whose secret OPENAI_API_KEY reaches the repair
          agent. Callers that use one pass `secrets: inherit`. A review event
          runs outside it, so it can land a head but never repairs one.
        type: string
        default: ""
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  sweep:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - name: Mint the release app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read
      - name: List the pull requests labeled ship
        id: list
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs="$(gh pr list -R "$REPO" --label ship --state open --limit 201 --json number --jq '[.[].number]')"
          # A list cut at its limit could leave any PR out; refuse rather than sweep part of it.
          if [ "$(jq length <<< "$prs")" -gt 200 ]; then
            echo "::error::More than 200 pull requests are labeled ship; the sweep refuses to look at a partial list."
            exit 1
          fi
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "Looking at: $prs"

  ship:
    needs: [sweep]
    # A pull request event wakes only a labeled PR; a CI completion only a PR's own run.
    if: >-
      !cancelled()
      && ((needs.sweep.result == 'success' && needs.sweep.outputs.prs != '[]')
      || (needs.sweep.result == 'skipped'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.pull_requests[0].number > 0)
      || ((github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review')
      && contains(github.event.pull_request.labels.*.name, 'ship')))))
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.sweep.outputs.prs || format('[{0}]', github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr)) }}
    # One look per PR at a time; a newer wake waits for it instead of cutting off a repair.
    concurrency:
      group: smart-ship-${{ github.repository }}-pr-${{ matrix.pr }}
      cancel-in-progress: false
    environment: ${{ github.event_name != 'pull_request_review' && inputs.repair-environment || '' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 45
    steps:
      - name: Mint the release app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          # Read the PR and its CI logs; push a signed repair, comment, merge or enqueue.
          permission-actions: read
          permission-checks: read
          permission-statuses: read
          permission-contents: write
          permission-pull-requests: write
          # GitHub refuses to merge or push a change under .github/workflows without it.
          permission-workflows: write
      - name: Check out Smart Ship at this workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burin-labs/.github
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .smart-ship
          sparse-checkout: scripts/smart-ship
          persist-credentials: false
      - name: Install Harn
        uses: burin-labs/harn/.github/actions/setup-harn@389a3aeb579e70d73999d7af6eac7b22a30c7808 # supports compressed release archives
        with:
          version: "0.10.180"
      - name: Look at the pull request
        id: look
        working-directory: .smart-ship/scripts/smart-ship
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr }}
          SHIP_REPAIR: ${{ inputs.repair && secrets.OPENAI_API_KEY != '' && github.event_name != 'pull_request_review' }}
          SHIP_REPAIR_TURNS: ${{ inputs.repair-turns }}
          SHIP_WORK: ${{ runner.temp }}/smart-ship-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pr }}
        run: |
          set -euo pipefail
          # A repair was prepared only if this look wrote its job, carrying this step's nonce; a
          # job.json an earlier job left on a persistent runner never matches.
          SHIP_NONCE="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          export SHIP_NONCE
          # This job owns its work dir only if it creates it; one already there is left alone.
          mkdir -- "$SHIP_WORK"
          printf '%s\n' "$SHIP_NONCE" > "$SHIP_WORK/.owner"
          echo "nonce=$SHIP_NONCE" >> "$GITHUB_OUTPUT"
          harn install --locked
          harn run --no-sandbox ship.harn
          if [ -f "$SHIP_WORK/job.json" ] && [ "$(jq -r '.nonce // ""' "$SHIP_WORK/job.json")" = "$SHIP_NONCE" ]; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          fi
      # The agent runs in Harn's sandbox in the checkout: no GitHub token in this step, no child
      # network, and the model key granted to model calls only, never to a command.
      - name: Repair without credentials
        if: inputs.repair && steps.look.outputs.prepared == 'true'
        timeout-minutes: 25
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHIP_WORK: ${{ runner.temp }}/smart-ship-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pr }}
        run: |
          set -euo pipefail
          # The script runs from its own directory so the sandbox's write jail is only that copy and
          # the checkout, never the Smart Ship scripts the publish step runs next.
          mkdir -p "$SHIP_WORK/agent"
          cp .smart-ship/scripts/smart-ship/repair.harn "$SHIP_WORK/agent/repair.harn"
          cd "$SHIP_WORK/pr"
          harn run --environment-policy granted \
            --grant "openai=env:OPENAI_API_KEY,expose=OPENAI_API_KEY,to=in_process" \
            --write-root "$SHIP_WORK/pr" \
            "$SHIP_WORK/agent/repair.harn"
      # A prepared repair always publishes, even after the agent failed or timed out; without one
      # (a failed mint, checkout or look) there is nothing to publish and no checkout to run from.
      - name: Publish the repair
        id: publish
        if: always() && inputs.repair && steps.look.outputs.prepared == 'true'
        working-directory: .smart-ship/scripts/smart-ship
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr }}
          SHIP_MODE: publish
          SHIP_WORK: ${{ runner.temp }}/smart-ship-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pr }}
        run: |
          set -euo pipefail
          harn run --no-sandbox ship.harn
      # Keep the controller's records with a failed or interrupted owned repair for recovery.
      - name: Remove Smart Ship's scripts
        if: always()
        env:
          SHIP_WORK: ${{ runner.temp }}/smart-ship-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pr }}
          SHIP_NONCE: ${{ steps.look.outputs.nonce }}
          SHIP_LOOK: ${{ steps.look.outcome }}
          SHIP_PREPARED: ${{ steps.look.outputs.prepared }}
          SHIP_PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if [ -n "${SHIP_NONCE:-}" ] && [ "$(cat -- "$SHIP_WORK/.owner" 2>/dev/null)" = "$SHIP_NONCE" ] &&
             ! { [ "$SHIP_PUBLISH" = success ] || { [ "$SHIP_LOOK" = success ] && [ "$SHIP_PREPARED" != true ]; }; }; then
            if [ -d "$GITHUB_WORKSPACE/.smart-ship" ] && [ ! -e "$SHIP_WORK/controller" ]; then
              mv -- "$GITHUB_WORKSPACE/.smart-ship" "$SHIP_WORK/controller"
            fi
            echo "::warning::Left Smart Ship's records for immediate recovery; runner temporary storage may be cleared."
          else
            rm -rf -- "$GITHUB_WORKSPACE/.smart-ship"
          fi
      # Never delete an owned checkout whose repair did not reach a successful publication.
      - name: Remove the checkouts
        if: always()
        env:
          SHIP_WORK: ${{ runner.temp }}/smart-ship-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pr }}
          SHIP_NONCE: ${{ steps.look.outputs.nonce }}
          SHIP_LOOK: ${{ steps.look.outcome }}
          SHIP_PREPARED: ${{ steps.look.outputs.prepared }}
          SHIP_PUBLISH: ${{ steps.publish.outcome }}
          SHIP_RUN: ${{ github.run_id }}
          SHIP_ATTEMPT: ${{ github.run_attempt }}
          SHIP_PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          if [ -n "${SHIP_NONCE:-}" ] && [ "$(cat -- "$SHIP_WORK/.owner" 2>/dev/null)" = "$SHIP_NONCE" ] &&
             { [ "${SHIP_PUBLISH:-}" = success ] || { [ "${SHIP_LOOK:-}" = success ] && [ "${SHIP_PREPARED:-}" != true ]; }; }; then
            rm -rf -- "$SHIP_WORK"
          elif [ -n "${SHIP_NONCE:-}" ] && [ "$(cat -- "$SHIP_WORK/.owner" 2>/dev/null)" = "$SHIP_NONCE" ]; then
            if [[ "${SHIP_RUN:-}" =~ ^[0-9]+$ && "${SHIP_ATTEMPT:-}" =~ ^[0-9]+$ && "${SHIP_PR:-}" =~ ^[0-9]+$ && -n "${GITHUB_WORKSPACE:-}" ]]; then
              umask 077
              retained="$(dirname -- "$GITHUB_WORKSPACE")/.smart-ship-retained"
              [ ! -L "$retained" ] || { echo "::error::Refusing a symlinked retention directory."; exit 1; }
              mkdir -p -- "$retained"
              chmod 700 "$retained"
              target="$retained/$SHIP_RUN-$SHIP_ATTEMPT-$SHIP_PR"
              if [ -e "$target" ] || [ -L "$target" ]; then
                [[ "$SHIP_NONCE" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::Cannot identify a safe alternate retention target."; exit 1; }
                target="$target-$SHIP_NONCE"
              fi
              mkdir -- "$target"
              mv -- "$SHIP_WORK" "$target/work"
              echo "::warning::Retained unfinished work at $target/work; cleanup is still required."
            else
              echo "::warning::Could not retain $SHIP_WORK outside runner temporary storage: run identity is unmeasured."
            fi
          elif [ -e "$SHIP_WORK" ]; then
            echo "::warning::Left $SHIP_WORK in place: ownership or publication is unconfirmed; runner temporary storage may be cleared."
          fi
