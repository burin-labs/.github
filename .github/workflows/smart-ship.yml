name: Smart Ship

# Reusable: one look at each pull request labeled `ship`. A look lands an
# approved, green head or hands what blocks it to one bounded repair agent; see
# scripts/smart-ship/ship.harn. Callers subscribe to the events and pass them
# all through. The script reads the pull request fresh, so a wake that changes
# nothing only costs a look.

on:
  workflow_call:
    inputs:
      runs-on:
        description: Linux runner label, or JSON list of labels; looks require util-linux flock and readable /proc/self.
        type: string
        default: '"ubuntu-24.04"'
      repair:
        description: >-
          Let a blocked pull request get one bounded repair agent. Off unless a
          caller opts in; the agent also needs OPENAI_API_KEY.
        type: boolean
        default: false
      repair-turns:
        description: Model turns one repair attempt may take before its unfinished work is kept for the next.
        type: number
        default: 60
      repair-environment:
        description: >-
          GitHub environment whose secret OPENAI_API_KEY reaches the repair
          agent. Callers that use one pass `secrets: inherit`. A review event
          runs outside it, so it can land a head but never repairs one.
        type: string
        default: ""
    secrets:
      RELEASE_APP_CLIENT_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  sweep:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr == '')
    # The caller's runner, so a caller on a cheaper or owned pool keeps its
    # scheduled sweeps there too.
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - name: Mint the release app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read
      - name: List the pull requests labeled ship
        id: list
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs="$(gh pr list -R "$REPO" --label ship --state open --limit 201 --json number --jq '[.[].number]')"
          # A list cut at its limit could leave any PR out; refuse rather than sweep part of it.
          if [ "$(jq length <<< "$prs")" -gt 200 ]; then
            echo "::error::More than 200 pull requests are labeled ship; the sweep refuses to look at a partial list."
            exit 1
          fi
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "Looking at: $prs"

  ship:
    needs: [sweep]
    # A pull request event wakes only a labeled PR; a CI completion only a PR's own run.
    if: >-
      !cancelled()
      && ((needs.sweep.result == 'success' && needs.sweep.outputs.prs != '[]')
      || (needs.sweep.result == 'skipped'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.pull_requests[0].number > 0)
      || ((github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review')
      && contains(github.event.pull_request.labels.*.name, 'ship')))))
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.sweep.outputs.prs || format('[{0}]', github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.inputs.pr)) }}
    # One look per PR at a time; a newer wake waits for it instead of cutting off a repair.
    concurrency:
      group: smart-ship-${{ github.repository }}-pr-${{ matrix.pr }}
      cancel-in-progress: false
    environment: ${{ github.event_name != 'pull_request_review' && inputs.repair-environment || '' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 45
    steps:
      - name: Mint the release app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          # Read CI proof and refresh its selection producer when declared scope expands.
          permission-actions: ${{ github.repository == 'burin-labs/burin-code' && 'write' || 'read' }}
          permission-checks: read
          permission-statuses: read
          permission-contents: write
          permission-pull-requests: write
          # GitHub refuses to merge or push a change under .github/workflows without it.
          permission-workflows: write
      - name: Check out Smart Ship at this workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burin-labs/.github
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .smart-ship
          sparse-checkout: |
            scripts/smart-ship
            scripts/ci-job-proof
          persist-credentials: false
      - name: Install Harn
        id: harn
        uses: burin-labs/harn/.github/actions/setup-harn@2be559c93c3cab6b38bf720b1f671505769ade4b # supports compressed release archives
        with:
          version: "0.10.200"
      - name: Look at the pull request
        id: look
        working-directory: .smart-ship/scripts/smart-ship
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr }}
          SHIP_REPAIR: ${{ inputs.repair && secrets.OPENAI_API_KEY != '' && github.event_name != 'pull_request_review' }}
          SHIP_REPAIR_TURNS: ${{ inputs.repair-turns }}
          SHIP_RETAIN_ROOT: ${{ runner.temp }}/../.smart-ship-retained
          SHIP_HARN: ${{ steps.harn.outputs.path }}
        run: |
          set -euo pipefail
          # A repair was prepared only if this look wrote its job, carrying this step's nonce; a
          # job.json an earlier job left on a persistent runner never matches.
          SHIP_NONCE="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          SHIP_WORK="$SHIP_RETAIN_ROOT/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PR-$SHIP_NONCE/work"
          export SHIP_NONCE SHIP_WORK
          echo "nonce=$SHIP_NONCE" >> "$GITHUB_OUTPUT"
          echo "work=$SHIP_WORK" >> "$GITHUB_OUTPUT"
          export PATH="${SHIP_HARN%/*}:$PATH"
          "$SHIP_HARN" install --locked
          umask 077
          flock --exclusive --nonblock --conflict-exit-code 75 --no-fork "$SHIP_RETAIN_ROOT.lock" \
            "$SHIP_HARN" run --no-sandbox ship.harn
          if [ -f "$SHIP_WORK/job.json" ] && [ "$(jq -r '.nonce // ""' "$SHIP_WORK/job.json")" = "$SHIP_NONCE" ]; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          fi
      # The trusted outer worker owns process retirement. Its fixed inner entry keeps the
      # checkout sandbox and an in-process model grant; no GitHub credential enters this step.
      - name: Repair without credentials
        id: repair
        if: inputs.repair && steps.look.outputs.prepared == 'true'
        timeout-minutes: 25
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHIP_WORK: ${{ steps.look.outputs.work }}
          SHIP_NONCE: ${{ steps.look.outputs.nonce }}
          SHIP_PR: ${{ matrix.pr }}
          SHIP_HARN: ${{ steps.harn.outputs.path }}
        run: |
          set -euo pipefail
          export PATH="${SHIP_HARN%/*}:$PATH"
          "$SHIP_HARN" run --standalone --no-sandbox --timeout 23m --environment-policy granted \
            --grant "openai=env:OPENAI_API_KEY,expose=OPENAI_API_KEY,for=harn" \
            --grant "ship_work=env:SHIP_WORK,expose=SHIP_WORK,to=in_process" \
            --grant "ship_nonce=env:SHIP_NONCE,expose=SHIP_NONCE,to=in_process" \
            --grant "ship_pr=env:SHIP_PR,expose=SHIP_PR,to=in_process" \
            --grant "github_repository=env:GITHUB_REPOSITORY,expose=GITHUB_REPOSITORY,to=in_process" \
            --grant "github_run_id=env:GITHUB_RUN_ID,expose=GITHUB_RUN_ID,to=in_process" \
            --grant "github_run_attempt=env:GITHUB_RUN_ATTEMPT,expose=GITHUB_RUN_ATTEMPT,to=in_process" \
            .smart-ship/scripts/smart-ship/worker.harn
      # A prepared repair always publishes, even after the agent failed or timed out; without one
      # (a failed mint, checkout or look) there is nothing to publish and no checkout to run from.
      - name: Publish the repair
        id: publish
        if: always() && inputs.repair && steps.look.outputs.prepared == 'true'
        working-directory: .smart-ship/scripts/smart-ship
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr }}
          SHIP_MODE: publish
          SHIP_WORK: ${{ steps.look.outputs.work }}
          SHIP_NONCE: ${{ steps.look.outputs.nonce }}
          SHIP_RETAIN_ROOT: ${{ runner.temp }}/../.smart-ship-retained
          SHIP_HARN: ${{ steps.harn.outputs.path }}
        run: |
          set -euo pipefail
          export PATH="${SHIP_HARN%/*}:$PATH"
          umask 077
          flock --exclusive --nonblock --conflict-exit-code 75 --no-fork "$SHIP_RETAIN_ROOT.lock" \
            "$SHIP_HARN" run --no-sandbox ship.harn
      # A look emits its nonce before admission. Even a failed look is reconciled through
      # the trusted owner; a failed bootstrap with no nonce has no transaction to finalize.
      - name: Finalize recovery custody
        if: always() && steps.look.outputs.nonce != ''
        working-directory: .smart-ship/scripts/smart-ship
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr }}
          SHIP_MODE: finalize
          SHIP_WORK: ${{ steps.look.outputs.work }}
          SHIP_NONCE: ${{ steps.look.outputs.nonce }}
          SHIP_RETAIN_ROOT: ${{ runner.temp }}/../.smart-ship-retained
          SHIP_HARN: ${{ steps.harn.outputs.path }}
        run: |
          set -euo pipefail
          export PATH="${SHIP_HARN%/*}:$PATH"
          umask 077
          flock --exclusive --nonblock --conflict-exit-code 75 --no-fork "$SHIP_RETAIN_ROOT.lock" \
            "$SHIP_HARN" run --no-sandbox ship.harn
