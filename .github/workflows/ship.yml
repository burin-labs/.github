name: Smart Ship

# Hands pull requests labeled `ship` to Smart Ship, which lands an approved,
# green head or repairs what blocks it; see scripts/smart-ship/ship.harn.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] same-repository PRs only; the shared look runs its own pinned script, and only its repair checks out PR code, without credentials
    types: [labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] the shared look reads the PR through the API and acts only on a same-repository PR's own CI run
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  # The review-thread relay (services/smart-ship-relay) dispatches with `pr`.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to look at; empty runs a sweep.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ship:
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@main
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
