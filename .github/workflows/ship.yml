name: Smart Ship

# Hands pull requests labeled `ship` to the Smart Ship shepherd, which lands
# them and reports each step on the PR. The shared runner lives in
# burin-labs/.github; see burin-labs/burin-code docs/design/smart-ship.md.

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, ready_for_review, dequeued, closed]
  pull_request_review:
    types: [submitted]
  # The shared runner decides which CI completions it acts on, so a green PR
  # joins the merge queue when CI finishes instead of at the next sweep.
  workflow_run: # zizmor: ignore[dangerous-triggers] the shared runner admits only completed same-repository runs, reads metadata through the API, and never checks out the parent-run ref
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  # The review-thread relay (services/smart-ship-relay) dispatches with `pr`.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to look at; empty runs a sweep.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ship:
    # The shared runner decides which events wake the shepherd.
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@ef1906f805d8a763008c9bbd580144aadeeb9a82
    with:
      # .github/smart-ship.toml limits repair to merge conflicts.
      repair: true
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
