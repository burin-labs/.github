name: Harn package

on:
  workflow_call:
    inputs:
      harn-version:
        description: Harn version with or without a leading v.
        required: false
        default: ""
        type: string
      harn-version-file:
        description: Repository-relative file containing the exact Harn version.
        required: false
        default: .harn-version
        type: string
      package-path:
        description: Repository-relative package directory, manifest, or package-owned file.
        required: false
        default: .
        type: string
      run-poll-tick:
        description: Exercise the first connector poll tick when bindings declare one.
        required: false
        default: false
        type: boolean
      strict:
        description: Make package check/lint warnings fatal and require strict boundary typing.
        required: false
        default: true
        type: boolean
      test-jobs:
        description: Parallel Harn test workers. Zero preserves Harn's automatic sizing.
        required: false
        default: 0
        type: number
      runs-on:
        description: Runner label for package verification.
        required: false
        default: ubuntu-latest
        type: string
      timeout-minutes:
        description: Maximum verification duration.
        required: false
        default: 20
        type: number
      artifact-name:
        description: Name of the uploaded verification receipt artifact.
        required: false
        default: harn-package-receipts
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify Harn package
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check out package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require called-workflow identity
        if: ${{ fromJSON(toJSON(job)).workflow_repository == '' || fromJSON(toJSON(job)).workflow_sha == '' }}
        shell: bash
        run: |
          echo "::error::harn-package.yml requires GitHub.com job.workflow_repository and job.workflow_sha; GitHub Enterprise Server is not supported"
          exit 2

      - name: Check out workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # actionlint v1.7.12 predates these GitHub.com fields; the JSON
          # round-trip keeps this workflow lintable without changing runtime.
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .harn/workflow-policy
          persist-credentials: false

      - name: Check repository projections
        if: ${{ github.repository_owner == 'burin-labs' && (github.repository != 'burin-labs/.github' || inputs.package-path != '.github/fixtures/harn-package') }}
        uses: ./.harn/workflow-policy/.github/actions/harn-repo-policy
        with:
          package-path: ${{ inputs.package-path }}

      - name: Verify package
        uses: ./.harn/workflow-policy/.github/actions/harn-package
        with:
          harn-version: ${{ inputs.harn-version }}
          harn-version-file: ${{ inputs.harn-version-file }}
          package-path: ${{ inputs.package-path }}
          run-poll-tick: ${{ inputs.run-poll-tick }}
          strict: ${{ inputs.strict }}
          test-jobs: ${{ inputs.test-jobs }}

      - name: Upload verification receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact-name }}
          path: .harn/receipts
          if-no-files-found: error
          retention-days: 14
