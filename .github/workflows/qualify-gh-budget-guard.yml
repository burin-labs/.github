name: Qualify GitHub budget guard

# The review-rule launcher grants network and ledger access only to an
# installed GitHub budget wrapper whose bytes match a version recorded in
# scripts/harn-required-review/qualified-guard.json. This keeps that record in
# step with burin-code main: burin-code dispatches it when a push to main
# changes scripts/gh-budget/, and it always qualifies main's current wrapper,
# so a late or repeated dispatch cannot qualify anything else.
on:
  repository_dispatch:
    types: [gh-budget-guard-changed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-gh-budget-guard
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify the wrapper on burin-code main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint release-app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |-
            .github
            burin-code
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the wrapper on burin-code main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burin-labs/burin-code
          ref: main
          path: .harn/burin-code
          sparse-checkout: scripts/gh-budget
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install Harn
        uses: burin-labs/harn/.github/actions/setup-harn@2c4eb2b36db924471f4b692ac5b5622cfd0ae864
        with:
          version-file: scripts/guard-publication/.harn-version

      - name: Install the locked publication adapter
        working-directory: scripts/guard-publication
        run: harn install --locked

      - name: Propose the qualified record
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          revision="$(git -C .harn/burin-code rev-parse HEAD)"
          harn run --no-sandbox scripts/harn-required-review/qualify-guard.harn -- .harn/burin-code "$revision"
          if git diff --quiet -- scripts/harn-required-review/qualified-guard.json; then
            exit 0
          fi
          git add -- scripts/harn-required-review/qualified-guard.json
          base="$(git rev-parse HEAD)"
          cd scripts/guard-publication
          harn run --no-sandbox publish.harn -- "$GITHUB_WORKSPACE" "$base" "$revision"
