# Reusable privileged override for bypass-ci / bypass-merge-queue / force-merge.
#
# Labels are the UX. Authority is re-checked from the issue event that attached
# each consumed label: every actor must be an organization or repository admin,
# and the pull request head must live in the base repository.

name: Merge override

on:
  workflow_call:
    inputs:
      label:
        description: Override label whose event dispatched this attempt.
        required: true
        type: string
      actor:
        description: GitHub login whose event dispatched this attempt.
        required: true
        type: string
      pr-number:
        description: Pull request number.
        required: true
        type: number
      head-sha:
        description: Pull request head commit SHA.
        required: true
        type: string
      head-repository:
        description: owner/name of the pull request head repository.
        required: true
        type: string
      organization:
        description: Organization that must list each actor as an admin.
        required: false
        default: burin-labs
        type: string
    secrets:
      RELEASE_APP_CLIENT_ID:
        description: GitHub App client id for privileged merges.
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: GitHub App private key for privileged merges.
        required: false

permissions:
  contents: read
  pull-requests: write
  # PR labels and their actor-bearing issue events use the Issues API.
  issues: write
  checks: write
  actions: write

# GitHub retains the active and newest pending member of a concurrency group.
# The active run snapshots every attached override label after acquiring this
# lock; the newest pending run therefore picks up any label events that replaced
# an older pending run. Never cancel the active privileged attempt.
concurrency:
  group: merge-override-${{ github.repository }}-${{ inputs.pr-number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply:
    name: Apply merge override
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out override implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: burin-labs/.github
          ref: ${{ fromJSON(toJSON(job)).workflow_sha || github.sha }}

      - name: Resolve attached override request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
        shell: bash
        run: |
          set -euo pipefail
          labels_file="$(mktemp)"
          event_pages_file="$(mktemp)"
          chmod 600 "$labels_file" "$event_pages_file"
          trap 'rm -f "$labels_file" "$event_pages_file"' EXIT
          if ! gh api "repos/${REPO}/issues/${PR}" --jq '[.labels[].name]' > "$labels_file"; then
            echo "::error::could not read attached override labels"
            exit 1
          fi
          if ! gh api --paginate --slurp \
            "repos/${REPO}/issues/${PR}/events?per_page=100" > "$event_pages_file"; then
            echo "::error::could not read override label events"
            exit 1
          fi
          if ! request="$(ruby scripts/merge_override.rb resolve-request \
            "$labels_file" "$event_pages_file")"; then
            echo "::error::could not resolve an override request from the measured labels and events"
            exit 1
          fi
          label="$(jq -r '.label // ""' <<< "$request")"
          {
            echo "active=$([[ -n "$label" ]] && echo true || echo false)"
            echo "label=${label}"
            echo "labels=$(jq -c '.labels' <<< "$request")"
            echo "actors=$(jq -c '.actors' <<< "$request")"
            echo "label_events=$(jq -c '.label_events // {}' <<< "$request")"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$label" ]]; then
            echo "Selected ${label}; consuming $(jq -c '.labels' <<< "$request")"
          else
            echo "No attached override labels remain; a serialized attempt already consumed this event."
          fi

      - name: Authorize every label actor and same-repo head
        id: auth
        if: steps.request.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ inputs.organization }}
          ACTORS_JSON: ${{ steps.request.outputs.actors }}
          HEAD_REPOSITORY: ${{ inputs.head-repository }}
          BASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t actors < <(jq -r '.[]' <<< "$ACTORS_JSON")
          for actor in "${actors[@]}"; do
            role="$(gh api "orgs/${ORG}/memberships/${actor}" --jq '.role' 2>/dev/null || true)"
            permission="$(gh api "repos/${BASE_REPOSITORY}/collaborators/${actor}/permission" \
              --jq '.permission' 2>/dev/null || true)"
            payload="$(jq -cn \
              --arg org "$ORG" --arg actor "$actor" \
              --arg membership_role "${role:-none}" \
              --arg repository_permission "${permission:-none}" \
              --arg head_repository "$HEAD_REPOSITORY" \
              --arg base_repository "$BASE_REPOSITORY" \
              '{org: $org, actor: $actor, membership_role: $membership_role,
                repository_permission: $repository_permission,
                head_repository: $head_repository, base_repository: $base_repository}')"
            if ! error="$(printf '%s' "$payload" | ruby scripts/merge_override.rb authorize 2>&1)"; then
              reason="$(tr '\n' ' ' <<< "$error")"
              echo "reason=${reason}" >> "$GITHUB_OUTPUT"
              echo "::error::${reason}"
              exit 1
            fi
          done
          echo "reason=" >> "$GITHUB_OUTPUT"
          echo "Authorized label actors: ${actors[*]}"

      - name: Resolve cancellation policy
        id: policy
        if: steps.auth.outcome == 'success'
        env:
          LABEL: ${{ steps.request.outputs.label }}
        shell: bash
        run: |
          set -euo pipefail
          cancel="$(jq -cn --arg label "$LABEL" '{label: $label}' \
            | ruby scripts/merge_override.rb cancellation-required)"
          echo "cancel_workflows=${cancel}" >> "$GITHUB_OUTPUT"

      - name: Cancel competing workflow runs
        id: sweep
        if: steps.policy.outputs.cancel_workflows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head-sha }}
          THIS_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "pending_count=unmeasured" >> "$GITHUB_OUTPUT"
          echo "Competing pending runs: unmeasured"
          run_pages_dir="$(mktemp -d)"
          chmod 700 "$run_pages_dir"
          trap 'rm -rf "$run_pages_dir"' EXIT
          if ! current_workflow_id="$(gh api \
            "repos/${REPO}/actions/runs/${THIS_RUN}" --jq '.workflow_id')"; then
            echo "::error::could not read the current override workflow identity"
            exit 1
          fi
          if [[ ! "$current_workflow_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::current override workflow identity was not a positive integer"
            exit 1
          fi
          for status in requested queued in_progress waiting pending; do
            if ! gh api --paginate --slurp \
              "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&status=${status}&per_page=100" \
              > "$run_pages_dir/${status}.json"; then
              echo "::error::could not read ${status} workflow runs for the pull-request head"
              exit 1
            fi
          done
          if ! selection="$(ruby scripts/merge_override.rb select-runs \
            "$THIS_RUN" "$current_workflow_id" "$run_pages_dir")"; then
            echo "::error::could not select competing workflow runs from the measured pages"
            exit 1
          fi
          pending_count="$(jq -r '.pending_count' <<< "$selection")"
          echo "pending_count=${pending_count}" >> "$GITHUB_OUTPUT"
          echo "Competing pending runs: ${pending_count}"
          echo "Measured workflow runs: $(jq -r '.measured_run_count' <<< "$selection")"
          echo "Active-status queries: $(jq -r '.query_count' <<< "$selection")"
          echo "Excluded sibling override runs: $(jq -c '.override_run_ids' <<< "$selection")"
          echo "Competing run IDs: $(jq -c '.competing_run_ids' <<< "$selection")"
          mapfile -t run_ids < <(jq -r '.competing_run_ids[]' <<< "$selection")
          for run_id in "${run_ids[@]}"; do
            echo "Cancelling workflow run ${run_id}"
            if ! gh api -X POST "repos/${REPO}/actions/runs/${run_id}/cancel" >/dev/null; then
              run_status="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .status)"
              if [[ "$run_status" != "completed" ]]; then
                echo "::error::could not cancel active workflow run ${run_id} (status ${run_status})"
                exit 1
              fi
            fi
          done
          for run_id in "${run_ids[@]}"; do
            echo "Waiting for workflow run ${run_id} to stop"
            timeout 120 gh run watch "$run_id" --repo "$REPO" --exit-status \
              >/dev/null 2>&1 || watch_status=$?
            if [[ "${watch_status:-0}" -eq 124 ]]; then
              echo "::error::workflow run ${run_id} did not stop within 120 seconds"
              exit 1
            fi
            unset watch_status
            run_status="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .status)"
            if [[ "$run_status" != "completed" ]]; then
              echo "::error::workflow run ${run_id} watch ended with status ${run_status}"
              exit 1
            fi
          done

      - name: Resolve CI status state
        id: ci
        if: steps.auth.outcome == 'success' && (steps.sweep.outcome == 'success' || steps.sweep.outcome == 'skipped')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head-sha }}
        shell: bash
        run: |
          set -euo pipefail
          check_pages="$(gh api --paginate --slurp \
            "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100")"
          state="$(jq '{check_runs: ([.[].check_runs] | add)}' <<< "$check_pages" \
            | ruby scripts/merge_override.rb ci-state)"
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "Post-sweep CI status state: ${state}"

      - name: Plan override actions
        id: plan
        if: steps.ci.outcome == 'success'
        env:
          LABEL: ${{ steps.request.outputs.label }}
          CI_STATE: ${{ steps.ci.outputs.state }}
        shell: bash
        run: |
          set -uo pipefail
          payload="$(jq -cn --arg label "$LABEL" --arg ci_status_state "$CI_STATE" \
            '{label: $label, ci_status_state: $ci_status_state}')"
          if ! plan="$(printf '%s' "$payload" | ruby scripts/merge_override.rb plan 2>&1)"; then
            reason="$(tr '\n' ' ' <<< "$plan")"
            echo "reason=${reason}" >> "$GITHUB_OUTPUT"
            echo "::error::${reason}"
            exit 1
          fi
          {
            echo "reason="
            echo "plan=${plan}"
            echo "publish_ci_status=$(jq -r '.publish_ci_status' <<< "$plan")"
            echo "merge=$(jq -r '.merge' <<< "$plan")"
          } >> "$GITHUB_OUTPUT"

      - name: Publish successful CI status check
        id: publish
        if: steps.plan.outputs.publish_ci_status == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head-sha }}
          LABEL: ${{ steps.request.outputs.label }}
          ACTORS: ${{ steps.request.outputs.actors }}
        shell: bash
        run: |
          set -euo pipefail
          actor_list="$(jq -r 'join(", @") | "@" + .' <<< "$ACTORS")"
          gh api -X POST "repos/${REPO}/check-runs" \
            -f name='CI status' -f head_sha="${HEAD_SHA}" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Merge override' \
            -f "output[summary]=Published by merge override \`${LABEL}\` requested by ${actor_list}." >/dev/null
          echo "Published successful CI status check for ${HEAD_SHA}"

      - name: Mint release-app token for privileged merge
        if: steps.plan.outputs.merge == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ inputs.organization }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write

      - name: Squash-merge pull request
        id: merge
        if: steps.plan.outputs.merge == 'true' && steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
          LABEL: ${{ steps.request.outputs.label }}
        shell: bash
        run: |
          set -euo pipefail
          pr_node="$(gh api "repos/${REPO}/pulls/${PR}" --jq .node_id)"
          # shellcheck disable=SC2016
          dequeue_query='mutation($id:ID!){dequeuePullRequest(input:{id:$id}){mergeQueueEntry{id}}}'
          gh api graphql -f query="$dequeue_query" -f id="$pr_node" >/dev/null 2>&1 || true
          title="$(gh pr view "$PR" --repo "$REPO" --json title --jq .title)"
          gh api -X PUT "repos/${REPO}/pulls/${PR}/merge" \
            -f merge_method=squash -f sha="${HEAD_SHA}" \
            -f "commit_title=${title} (#${PR})" \
            -f "commit_message=Merged with override label \`${LABEL}\`." >/dev/null
          echo "Merged PR #${PR} via privileged squash merge"

      - name: Remove consumed override labels
        id: cleanup
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
          ACTIVE: ${{ steps.request.outputs.active }}
          LABELS_JSON: ${{ steps.request.outputs.labels }}
          LABEL_EVENTS_JSON: ${{ steps.request.outputs.label_events }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ACTIVE" != "true" ]]; then
            echo 'removed_labels=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels_file="$(mktemp)"
          event_pages_file="$(mktemp)"
          chmod 600 "$labels_file" "$event_pages_file"
          trap 'rm -f "$labels_file" "$event_pages_file"' EXIT
          if ! gh api "repos/${REPO}/issues/${PR}" --jq '[.labels[].name]' > "$labels_file"; then
            echo "::error::could not re-read attached override labels before cleanup"
            exit 1
          fi
          if ! gh api --paginate --slurp \
            "repos/${REPO}/issues/${PR}/events?per_page=100" > "$event_pages_file"; then
            echo "::error::could not re-read override label events before cleanup"
            exit 1
          fi
          if ! current="$(ruby scripts/merge_override.rb resolve-request \
            "$labels_file" "$event_pages_file")"; then
            echo "::error::could not resolve the current override request before cleanup"
            exit 1
          fi
          removed='[]'
          mapfile -t labels < <(jq -r '.[]' <<< "$LABELS_JSON")
          for label in "${labels[@]}"; do
            expected_event="$(jq -r --arg label "$label" '.[$label]' <<< "$LABEL_EVENTS_JSON")"
            current_event="$(jq -r --arg label "$label" '.label_events[$label] // ""' <<< "$current")"
            if [[ "$current_event" != "$expected_event" ]]; then
              echo "Keeping ${label}: a newer label event superseded consumed event ${expected_event}."
              continue
            fi
            removed_label=false
            for attempt in 1 2 3; do
              if gh api -X DELETE "repos/${REPO}/issues/${PR}/labels/${label}" >/dev/null 2>&1; then
                removed_label=true
                break
              fi
              sleep "$attempt"
            done
            if [[ "$removed_label" != "true" ]]; then
              echo "::error::could not remove consumed label ${label} after three attempts"
              exit 1
            fi
            removed="$(jq -cn --argjson labels "$removed" --arg label "$label" '$labels + [$label]')"
          done
          echo "removed_labels=${removed}" >> "$GITHUB_OUTPUT"
          echo "Removed consumed labels: ${removed}"

      - name: Audit terminal outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
          ACTIVE: ${{ steps.request.outputs.active }}
          LABEL: ${{ steps.request.outputs.label }}
          CONSUMED_LABELS_JSON: ${{ steps.request.outputs.labels }}
          REMOVED_LABELS_JSON: ${{ steps.cleanup.outputs.removed_labels || '[]' }}
          ACTORS_JSON: ${{ steps.request.outputs.actors }}
          CANCEL: ${{ steps.policy.outputs.cancel_workflows }}
          PENDING_COUNT: ${{ steps.sweep.outputs.pending_count }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          AUTH_REASON: ${{ steps.auth.outputs.reason }}
          SWEEP_OUTCOME: ${{ steps.sweep.outcome }}
          CI_OUTCOME: ${{ steps.ci.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACTIVE" == "true" ]] || exit 0
          status=applied
          reason="Override completed successfully."
          retry_action=""
          if [[ "$AUTH_OUTCOME" == "failure" ]]; then
            status=refused
            reason="$AUTH_REASON"
            retry_action="An organization or repository admin must re-apply \`$LABEL\`."
          elif [[ "$PLAN_OUTCOME" == "failure" ]]; then
            status=refused
            reason="$PLAN_REASON"
            retry_action="Resolve the condition above, then re-apply \`$LABEL\`."
          elif [[ "$SWEEP_OUTCOME" == "failure" || "$CI_OUTCOME" == "failure" || \
                  "$PUBLISH_OUTCOME" == "failure" || "$APP_TOKEN_OUTCOME" == "failure" || \
                  "$MERGE_OUTCOME" == "failure" || "$CLEANUP_OUTCOME" == "failure" ]]; then
            status=errored
            reason="The override stopped because a workflow step failed; inspect this run for the named failing step."
            retry_action="After the failing service or step is healthy, re-apply \`$LABEL\`."
          fi
          actions=()
          if [[ "$CANCEL" == "true" && "$SWEEP_OUTCOME" == "success" ]]; then
            actions+=("cancelled ${PENDING_COUNT:-0} competing workflow run(s)")
          fi
          [[ "$PUBLISH_OUTCOME" == "success" ]] && actions+=("published a successful CI status check")
          [[ "$MERGE_OUTCOME" == "success" ]] && actions+=("squash-merged the pull request directly")
          action_text=""
          for action in "${actions[@]}"; do
            [[ -z "$action_text" ]] || action_text+="; "
            action_text+="$action"
          done
          payload="$(jq -cn \
            --arg status "$status" --arg label "$LABEL" \
            --argjson consumed_labels "$CONSUMED_LABELS_JSON" \
            --argjson removed_labels "$REMOVED_LABELS_JSON" \
            --argjson actors "$ACTORS_JSON" \
            --arg reason "$reason" --arg retry_action "$retry_action" \
            --arg actions "$action_text" \
            '{status: $status, label: $label, consumed_labels: $consumed_labels,
              removed_labels: $removed_labels, actors: $actors,
              reason: $reason, retry_action: $retry_action, actions: $actions}')"
          body="$(printf '%s' "$payload" | ruby scripts/merge_override.rb terminal-audit-body)"
          gh pr comment "$PR" --repo "$REPO" --body "$body"
