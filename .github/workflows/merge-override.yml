# Reusable privileged override for bypass-ci / bypass-merge-queue / force-merge.
#
# Labels are the UX; the label is an admin's decision and this workflow does
# not second-guess it. Before any side effect, `decide` (scripts/merge-override)
# refuses only what is unsafe whoever asks: an actor who is not an organization
# or repository admin (re-checked from the issue event that attached each
# label), a fork head, a head that moved after the label, a pull request that
# is not open, required approval missing (except force-merge), and
# bypass-merge-queue on a head whose `CI status` is not green. Everything else
# is recorded as a warning.
#
# Every attempt, applied, refused, or errored, leaves one audit record on the
# pull request, in the step summary, and in the org log
# (`log-repository`, one issue per quarter, one comment per attempt).

name: Merge override

on:
  workflow_call:
    inputs:
      label:
        description: Override label whose event dispatched this attempt.
        required: true
        type: string
      actor:
        description: GitHub login whose event dispatched this attempt.
        required: true
        type: string
      pr-number:
        description: Pull request number.
        required: true
        type: number
      head-sha:
        description: Pull request head commit SHA the label event saw.
        required: true
        type: string
      head-repository:
        description: owner/name of the head repository the label event saw. The decision re-reads it from the pull request.
        required: true
        type: string
      organization:
        description: Organization that must list each actor as an admin.
        required: false
        default: burin-labs
        type: string
      log-repository:
        description: Private repository, in `organization`, that holds the org override log.
        required: false
        default: override-log
        type: string
    secrets:
      RELEASE_APP_CLIENT_ID:
        description: GitHub App client id for privileged merges and the org log.
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: GitHub App private key for privileged merges and the org log.
        required: false

permissions:
  contents: read
  pull-requests: write
  # PR labels, comments, and their actor-bearing issue events use the Issues API.
  issues: write
  checks: write
  actions: write

# GitHub retains the active and newest pending member of a concurrency group.
# The active run snapshots every attached override label after acquiring this
# lock; the newest pending run therefore picks up any label events that replaced
# an older pending run. Never cancel the active privileged attempt.
concurrency:
  group: merge-override-${{ github.repository }}-${{ inputs.pr-number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OVERRIDE_REPOSITORY: ${{ github.repository }}
  OVERRIDE_ORGANIZATION: ${{ inputs.organization }}
  OVERRIDE_PR: ${{ inputs.pr-number }}
  OVERRIDE_HEAD_SHA: ${{ inputs.head-sha }}
  OVERRIDE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  apply:
    name: Apply merge override
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out override implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: burin-labs/.github
          ref: ${{ fromJSON(toJSON(job)).workflow_sha || github.sha }}

      - name: Set up exact Harn release
        uses: burin-labs/harn/.github/actions/setup-harn@68ab397be4c1b7eece1743e0f8824840e05c2fa2 # bounded release-asset retries
        with:
          version: 0.10.133

      # Measures every fact, then refuses or plans. Nothing has changed yet.
      - name: Decide override
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/merge-override/run.sh decide

      - name: Cancel competing workflow runs
        id: cancel
        if: steps.decide.outcome == 'success' && steps.decide.outputs.cancel_workflows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_RUN_ID: ${{ github.run_id }}
        run: bash scripts/merge-override/run.sh cancel

      - name: Publish successful CI status check
        id: publish
        if: >-
          steps.decide.outcome == 'success' && steps.decide.outputs.publish_ci_status == 'true' &&
          steps.cancel.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_RECORD: ${{ steps.decide.outputs.record }}
        run: bash scripts/merge-override/run.sh publish

      - name: Mint release-app token for privileged merge
        id: app-token
        if: >-
          steps.decide.outcome == 'success' && steps.decide.outputs.merge == 'true' &&
          steps.cancel.outcome != 'failure' && steps.publish.outcome != 'failure'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ inputs.organization }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
          permission-workflows: write

      - name: Squash-merge pull request
        id: merge
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OVERRIDE_RECORD: ${{ steps.decide.outputs.record }}
        run: bash scripts/merge-override/run.sh merge

      - name: Remove consumed override labels
        id: cleanup
        if: always() && steps.decide.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_LABEL_EVENTS: ${{ steps.decide.outputs.label_events }}
        run: bash scripts/merge-override/run.sh cleanup

      # The org log lives in another private repository, so it needs its own
      # token. A failed mint leaves the token empty and the record step red.
      - name: Mint release-app token for the org log
        id: log-token
        if: always() && steps.decide.outputs.active != 'false'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ inputs.organization }}
          repositories: ${{ inputs.log-repository }}
          permission-issues: write

      - name: Record override
        if: always() && steps.decide.outputs.active != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_LOG_TOKEN: ${{ steps.log-token.outputs.token }}
          OVERRIDE_LOG_REPOSITORY: ${{ inputs.organization }}/${{ inputs.log-repository }}
          OVERRIDE_LABEL: ${{ inputs.label }}
          OVERRIDE_ACTOR: ${{ inputs.actor }}
          OVERRIDE_RECORD: ${{ steps.decide.outputs.record }}
          OVERRIDE_CANCELLED: ${{ steps.cancel.outputs.cancelled }}
          OVERRIDE_MERGE_COMMIT: ${{ steps.merge.outputs.merge_commit }}
          OVERRIDE_REMOVED_LABELS: ${{ steps.cleanup.outputs.removed_labels }}
          OVERRIDE_STEPS: >-
            {"decide": "${{ steps.decide.outcome }}", "cancel": "${{ steps.cancel.outcome }}",
            "publish": "${{ steps.publish.outcome }}", "merge_token": "${{ steps.app-token.outcome }}",
            "merge": "${{ steps.merge.outcome }}", "cleanup": "${{ steps.cleanup.outcome }}"}
        run: bash scripts/merge-override/run.sh record
