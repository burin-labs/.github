name: CI latency observer

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-latency-observer
  cancel-in-progress: false

jobs:
  observe:
    name: Check end-to-end CI latency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint read-only release-app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |-
            .github
            harn
            burin-code
            harn-cloud
          permission-actions: read
          permission-contents: read

      - name: Check out the Harn measurement engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burin-labs/harn
          # Updated only after the owning Harn change is integrated on main.
          ref: 143608ec8fe14341464728ebdf5860b03cc1b9c7
          path: .harn/ci-latency-harn
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install Harn
        uses: burin-labs/harn/.github/actions/setup-harn@68a27ad73cd3269cd11757c68daeb81444580c7d # v0.10.75
        with:
          version: 0.10.64

      - name: Observe full CI runs
        id: observe
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/ci-latency-reports"
          # Harn's filesystem sandbox intentionally admits the checked-out
          # workspace, not arbitrary runner temp paths. Policies are inert
          # JSON, but keeping them under the excluded .harn/ tree preserves
          # that boundary instead of widening it.
          policies="$GITHUB_WORKSPACE/.harn/ci-latency-policies"
          mkdir -p "$reports" "$policies"
          failed=0

          for repository in .github harn burin-code harn-cloud; do
            # Strip the leading dot from the org repository name. Upload-artifact
            # excludes hidden files by default, so `.github.json` would silently
            # drop one of the four governed reports from the evidence bundle.
            report="$reports/${repository#.}.json"
            policy_ok=false
            for attempt in 1 2 3; do
              if gh api \
                  -H "Accept: application/vnd.github.raw+json" \
                  "/repos/burin-labs/${repository}/contents/.github/ci-latency.json?ref=main" \
                  > "$policies/${repository}.json"; then
                policy_ok=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
            done

            report_ok=false
            if [ "$policy_ok" = true ]; then
              for attempt in 1 2 3; do
                set +e
                # This trusted, SHA-pinned audit intentionally shells out to
                # gh for read-only Actions metadata. Harn's default sandbox
                # denies network/process authority, so the capability escape
                # is explicit at the one call site that needs it.
                harn run --no-sandbox .harn/ci-latency-harn/scripts/ci_walltime_report.harn -- \
                  --policy "$policies/${repository}.json" \
                  --limit 100 \
                  --json \
                  --check \
                  > "$report"
                set -e
                # A policy breach intentionally exits non-zero but still emits
                # its complete report. Retry only transport/tool failures that
                # did not produce a valid evaluation.
                if jq -e '.schema_version == 2 and (.evaluation.ok | type == "boolean")' \
                    "$report" >/dev/null 2>&1; then
                  report_ok=true
                  break
                fi
                if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
              done
            fi

            if [ "$report_ok" = true ]; then
              result="$(jq -r 'if .evaluation.ok then "pass" else "fail" end' "$report")"
            else
              result=fail
              jq -n --arg repository "burin-labs/${repository}" \
                '{schema_version: 2, policy: {repository: $repository}, evaluation: {status: "observer_error", ok: false}, wall: {count: 0, p50_ms: 0, p90_ms: 0, max_ms: 0}}' \
                > "$report"
            fi
            if [ "$result" = fail ]; then
              failed=1
            fi
            jq --arg result "$result" '. + {observer_result: $result}' \
              "$report" > "$report.tmp"
            mv "$report.tmp" "$report"
          done

          {
            echo "## End-to-end CI latency"
            echo
            echo "Only successful full-coverage runs after each repository's topology epoch are included."
            echo
            echo "| Repository | Result | Samples | p50 | p90 | Max |"
            echo "| --- | --- | ---: | ---: | ---: | ---: |"
            for report in "$reports"/*.json; do
              jq -r '
                def seconds: ((. / 1000 * 10 | round) / 10 | tostring) + "s";
                "| `" + .policy.repository + "` | " + .observer_result
                  + " (`" + .evaluation.status + "`) | " + (.wall.count | tostring)
                  + " | " + (.wall.p50_ms | seconds)
                  + " | " + (.wall.p90_ms | seconds)
                  + " | " + (.wall.max_ms | seconds) + " |"
              ' "$report"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "reports=$reports" >> "$GITHUB_OUTPUT"
          exit "$failed"

      - name: Upload compact reports
        if: always() && steps.observe.outputs.reports != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: ci-latency-reports
          path: ${{ steps.observe.outputs.reports }}/*.json
          if-no-files-found: error
          retention-days: 7
