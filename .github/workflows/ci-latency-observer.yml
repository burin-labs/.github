name: CI latency observer

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-latency-observer
  cancel-in-progress: false

jobs:
  observe:
    name: Check end-to-end CI latency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint read-only release-app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |-
            .github
            harn
            burin-code
            harn-cloud
          permission-actions: read
          permission-contents: read

      - name: Check out the Harn measurement engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burin-labs/harn
          # Updated only after the owning Harn change is integrated on main.
          ref: b5f92c0874e93fa9f0b35d241213b8e8efa619c0
          path: .harn/ci-latency-harn
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install Harn
        uses: burin-labs/harn/.github/actions/setup-harn@6e286870227a91f701d7f5ff05a3ec54a39ac478 # certified v0.10.159
        with:
          version: 0.10.159

      - name: Observe full CI runs
        id: observe
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/ci-latency-reports"
          # Harn's filesystem sandbox intentionally admits the checked-out
          # workspace, not arbitrary runner temp paths. Policies are inert
          # JSON, but keeping them under the excluded .harn/ tree preserves
          # that boundary instead of widening it.
          policies="$GITHUB_WORKSPACE/.harn/ci-latency-policies"
          mkdir -p "$reports" "$policies"
          set +e
          harn run --no-sandbox scripts/ci-latency/observer-cli.harn -- \
            --reports "$reports" \
            --policies "$policies" \
            --harn-script .harn/ci-latency-harn/scripts/ci_walltime_report.harn \
            --summary-path "$GITHUB_STEP_SUMMARY"
          observer_status=$?
          set -e
          echo "reports=$reports" >> "$GITHUB_OUTPUT"
          exit "$observer_status"

      - name: Upload compact reports
        if: always() && steps.observe.outputs.reports != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: ci-latency-reports
          path: ${{ steps.observe.outputs.reports }}/*.json
          if-no-files-found: error
          retention-days: 7
