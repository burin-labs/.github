# Promote the files one CI run built and tested into a GitHub release.
#
# A release publishes exactly the files that main CI built and tested at one
# commit; nothing is rebuilt after testing. The build run uploads each file as
# a run artifact, attests it, and records its SHA-256 in a candidate manifest
# (schemas/candidate-manifest.v1.json). This workflow requires a successful run
# or Harn's authenticated consumer recovery, and proves that the
# files are the ones the manifest names at the requested commit,
# then tags that commit and publishes those same files. It never builds and
# never writes release content: the release body is the manifest's notes file,
# and checksums or asset indexes are files the run built like any other.
#
# Call it from a workflow that starts after the release commit's CI run has
# finished, since the run must have concluded before it can be promoted:
#
#   on:
#     workflow_run:
#       workflows: [CI]
#       types: [completed]
#       branches: [main]
#   jobs:
#     promote:
#       if: github.event.workflow_run.conclusion == 'success'
#       uses: burin-labs/.github/.github/workflows/promote-release.yml@<sha>
#       permissions:
#         contents: read
#         actions: read
#         attestations: read
#       with:
#         sha: ${{ github.event.workflow_run.head_sha }}
#         run-id: ${{ github.event.workflow_run.id }}
#         tag: v1.2.3
#       secrets:
#         RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
#         RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#
# Publishing to package registries is the caller's next job, gated on this
# one. It reads the files from the release this workflow outputs.
# See docs/release-completion-authorization.md for the narrow recovery boundary.

name: Promote release

on:
  workflow_call:
    inputs:
      sha:
        description: Full commit SHA the run built and tested.
        required: true
        type: string
      run-id:
        description: Id of the calling repository's workflow run that built and tested the files.
        required: true
        type: string
      expected-attempt:
        description: Producer attempt bound to the caller's consumer qualification.
        required: false
        default: ''
        type: string
      expected-manifest-id:
        description: Candidate manifest artifact id bound to consumer qualification.
        required: false
        default: ''
        type: string
      expected-manifest-digest:
        description: SHA-256 digest of the bound manifest artifact.
        required: false
        default: ''
        type: string
      tag:
        description: Release tag as vX.Y.Z or package/vX.Y.Z. A version suffix marks a prerelease; namespaced tags never change repository latest.
        required: true
        type: string
      original-consumer-context:
        description: Optional issued context of the original candidate observer that reached its deadline.
        required: false
        default: ''
        type: string
      consumer-repair:
        description: Optional Harn-issued repair selector binding a fresh consumer measurement to the original candidate archives.
        required: false
        default: ''
        type: string
      standalone-harn:
        description: Qualify Harn's own source and immutable archives independently of downstream adoption.
        required: false
        default: false
        type: boolean
      inspect-only:
        description: Inspect an existing verified publication through the release App without publishing or uploading.
        required: false
        default: false
        type: boolean
    secrets:
      RELEASE_APP_CLIENT_ID:
        description: GitHub App client id with contents write on the calling repository.
        required: true
      RELEASE_APP_PRIVATE_KEY:
        description: GitHub App private key.
        required: true
      CONSUMER_CANARY_REPOSITORY:
        description: Registered consumer repository name, required for consumer recovery.
        required: false
    outputs:
      tag:
        description: The tag the release was published under.
        value: ${{ jobs.promote.outputs.tag }}
      release-url:
        description: URL of the published release.
        value: ${{ jobs.promote.outputs.release-url }}

permissions:
  contents: read

jobs:
  promote:
    name: Promote tested files
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish-tested-files-${{ github.repository }}-${{ inputs.tag }}
      cancel-in-progress: false
    # Reading the run, its artifacts, and its attestations uses the caller's
    # own token. Only publishing uses the app token, and only after every
    # check has passed.
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      release-url: ${{ steps.publish.outputs.release-url }}
    steps:
      - name: Require standalone inspection scope
        if: inputs.inspect-only && (!inputs.standalone-harn || github.repository != 'burin-labs/harn')
        shell: bash
        run: |
          echo "::error::Publication inspection requires standalone Harn qualification."
          exit 2

      - name: Require called-workflow identity
        if: ${{ fromJSON(toJSON(job)).workflow_repository == '' || fromJSON(toJSON(job)).workflow_sha == '' }}
        shell: bash
        run: |
          echo "::error::promote-release.yml requires GitHub.com job.workflow_repository and job.workflow_sha; GitHub Enterprise Server is not supported"
          exit 2

      - name: Check out workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # actionlint v1.7.12 predates these GitHub.com fields; the JSON
          # round-trip keeps this workflow lintable without changing runtime.
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .harn/promote-release/implementation
          persist-credentials: false

      - name: Set up exact Harn release
        uses: burin-labs/harn/.github/actions/setup-harn@924532350531f8cce9ae5d44b1a77dda76c6f44c # bounded release-asset retries
        with:
          version: 0.10.133

      - name: Check out the immutable consumer reader
        if: (inputs.original-consumer-context != '' || inputs.consumer-repair != '' || inputs.standalone-harn) && github.repository == 'burin-labs/harn'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burin-labs/harn
          ref: c4e6550c176ee06340cf58561612d05e622ecd05
          path: .harn/promote-release/consumer-reader
          persist-credentials: false

      - name: Set up the consumer reader runtime
        if: (inputs.original-consumer-context != '' || inputs.consumer-repair != '' || inputs.standalone-harn) && github.repository == 'burin-labs/harn'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Mint consumer read authority
        if: (inputs.original-consumer-context != '' || inputs.consumer-repair != '') && github.repository == 'burin-labs/harn'
        id: consumer-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            harn
            ${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - name: Verify the run and its files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_MODE: verify
          PROMOTE_REPOSITORY: ${{ github.repository }}
          PROMOTE_SHA: ${{ inputs.sha }}
          PROMOTE_RUN_ID: ${{ inputs.run-id }}
          PROMOTE_EXPECTED_ATTEMPT: ${{ inputs.expected-attempt }}
          PROMOTE_EXPECTED_MANIFEST_ID: ${{ inputs.expected-manifest-id }}
          PROMOTE_EXPECTED_MANIFEST_DIGEST: ${{ inputs.expected-manifest-digest }}
          PROMOTE_ORIGINAL_CONSUMER_CONTEXT: ${{ inputs.original-consumer-context }}
          PROMOTE_CONSUMER_REPAIR: ${{ inputs.consumer-repair }}
          PROMOTE_STANDALONE_HARN: ${{ inputs.standalone-harn && 'true' || 'false' }}
          PROMOTE_QUALIFICATION_TOKEN: ${{ github.token }}
          PROMOTE_HARN_READER_ROOT: ${{ github.workspace }}/.harn/promote-release/consumer-reader
          PROMOTE_CONSUMER_TOKEN: ${{ steps.consumer-token.outputs.token }}
          PROMOTE_CONSUMER_REPOSITORY: ${{ github.repository_owner }}/${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          PROMOTE_CONSUMER_WORKFLOW: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
          PROMOTE_CONSUMER_READER: ${{ github.workspace }}/.harn/promote-release/consumer-reader/scripts/ci/consumer-observer-read-decision.mjs
          PROMOTE_TAG: ${{ inputs.tag }}
          PROMOTE_DIRECTORY: ${{ github.workspace }}/.harn/promote-release/candidate
        run: bash .harn/promote-release/implementation/scripts/release-promotion/run.sh

      - name: Preserve the verified publication intent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-intent-${{ github.run_attempt }}-${{ hashFiles('.harn/promote-release/candidate/publication-intent.json') }}
          path: .harn/promote-release/candidate/publication-intent.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Mint the release token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Publishing re-reads the run immediately before it creates the
          # release (actions read), then creates the release and its tag
          # (contents write). A certified older target can differ from main's
          # workflow files, so GitHub also requires workflows write. The app
          # already grants it; publication does not edit workflow files.
          # A release made with the app token, unlike one
          # made with the workflow token, starts the workflows that listen
          # for it.
          permission-actions: read
          permission-contents: write
          permission-workflows: write

      - name: Inspect or publish the verified files
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PROMOTE_MODE: ${{ inputs.inspect-only && 'inspect' || 'publish' }}
          PROMOTE_REPOSITORY: ${{ github.repository }}
          PROMOTE_SHA: ${{ inputs.sha }}
          PROMOTE_RUN_ID: ${{ inputs.run-id }}
          PROMOTE_EXPECTED_ATTEMPT: ${{ inputs.expected-attempt }}
          PROMOTE_EXPECTED_MANIFEST_ID: ${{ inputs.expected-manifest-id }}
          PROMOTE_EXPECTED_MANIFEST_DIGEST: ${{ inputs.expected-manifest-digest }}
          PROMOTE_ORIGINAL_CONSUMER_CONTEXT: ${{ inputs.original-consumer-context }}
          PROMOTE_CONSUMER_REPAIR: ${{ inputs.consumer-repair }}
          PROMOTE_STANDALONE_HARN: ${{ inputs.standalone-harn && 'true' || 'false' }}
          PROMOTE_QUALIFICATION_TOKEN: ${{ github.token }}
          PROMOTE_HARN_READER_ROOT: ${{ github.workspace }}/.harn/promote-release/consumer-reader
          PROMOTE_CONSUMER_TOKEN: ${{ steps.consumer-token.outputs.token }}
          PROMOTE_CONSUMER_REPOSITORY: ${{ github.repository_owner }}/${{ secrets.CONSUMER_CANARY_REPOSITORY }}
          PROMOTE_CONSUMER_WORKFLOW: ${{ vars.CONSUMER_CANARY_WORKFLOW }}
          PROMOTE_CONSUMER_READER: ${{ github.workspace }}/.harn/promote-release/consumer-reader/scripts/ci/consumer-observer-read-decision.mjs
          PROMOTE_TAG: ${{ inputs.tag }}
          PROMOTE_DIRECTORY: ${{ github.workspace }}/.harn/promote-release/candidate
        run: bash .harn/promote-release/implementation/scripts/release-promotion/run.sh
