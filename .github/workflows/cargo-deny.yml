name: cargo-deny (reusable)

# Supply-chain gate for a Rust workspace. Policy lives in the caller's
# deny.toml; this workflow owns the pinned cargo-deny binary and how its
# verdicts are reported.
#
#   jobs:
#     cargo-deny:
#       permissions:
#         contents: read
#         issues: write    # the default-branch tracking issue
#       uses: burin-labs/.github/.github/workflows/cargo-deny.yml@<sha>
#       with:
#         working-directory: crates/my-workspace  # default "."
#         policy: false                          # default true
#
# Three checks, all blocking within the job:
#   * `check bans licenses sources` (skipped with `policy: false`) reads only
#     Cargo.lock, the manifests, and deny.toml, so its verdict changes only
#     when the caller's own files change.
#   * `check advisories` reads the RustSec database, which changes daily. Do
#     not make a job that runs it a required check.
#   * `cargo-audit` reads the whole Cargo.lock for vulnerabilities. cargo-deny
#     audits only the crates the resolved feature graph reaches, so a crate the
#     lockfile pins but no enabled feature builds (an optional `quinn-proto`
#     behind a TLS client's `http3` feature) passes it while cargo-audit,
#     Dependabot, and every SBOM still report it.
#
# Both read one ignore list, `advisories.ignore` in deny.toml. Every ignore
# must carry a reason that says `Review by YYYY-MM-DD`; an ignore without a
# date, past its date, or matching no advisory in Cargo.lock fails the run on
# every event, so a standing exception expires instead of becoming permanent.
# cargo-audit owns the stale check, because cargo-deny cannot see a
# lockfile-only crate and would call its ignore stale.
#
# Advisories split by event. On a pull request, only vulnerabilities, yanked
# crates, and stale ignores fail; `unmaintained` and `unsound` are warnings,
# because one published overnight against an unchanged crate turned every
# dependency PR red (RUSTSEC-2026-0370..0372, zbus). Every other event enforces
# them, and a run on the default branch opens, updates, or closes one tracking
# issue per workspace, so the finding has an owner instead of a red run nobody
# opens.
#
# A caller that must keep the deterministic checks in a required job passes
# `policy: false` here and runs `check bans licenses sources` in that job.
#
# Never add `continue-on-error`. It does not make a job non-blocking; it only
# makes a failing job report success. Copies of this gate that carried it
# showed green main runs over an unpatched h2 vulnerability (RUSTSEC-2026-0258)
# and an unmaintained-crate advisory (RUSTSEC-2024-0449).
#
# Callers trigger on their dependency files and on a daily schedule: without
# the schedule, an advisory published against an unchanged Cargo.lock is
# never looked for.

on:
  workflow_call:
    outputs:
      source-revision:
        description: "Source commit actually checked out for the advisory scan"
        value: ${{ jobs.cargo-deny.outputs.source_revision }}
      advisory-database-revision:
        description: "Fresh RustSec database commit used for the whole-lockfile scan"
        value: ${{ jobs.cargo-deny.outputs.advisory_database_revision }}
    inputs:
      source-revision:
        description: "Optional immutable source commit to audit without changing the default-branch tracking issue"
        type: string
        default: ""
        required: false
      working-directory:
        description: "Directory holding the workspace Cargo.lock and deny.toml"
        type: string
        default: "."
        required: false
      policy:
        description: "Also run the deterministic bans, licenses, and sources checks"
        type: boolean
        default: true
        required: false

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Admit immutable advisory source
        id: source
        env:
          SOURCE_REVISION: ${{ inputs.source-revision }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          revision="${SOURCE_REVISION:-$EVENT_SHA}"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Advisory source must be a full immutable commit.'
            exit 1
          fi
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - name: Verify advisory source checkout
        id: checked-source
        env:
          EXPECTED_SOURCE: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD)"
          if [[ "$actual" != "$EXPECTED_SOURCE" ]]; then
            echo '::error::Advisory checkout differs from its admitted source.'
            exit 1
          fi
          printf 'revision=%s\n' "$actual" >> "$GITHUB_OUTPUT"
          printf 'advisory_source_revision=%s\n' "$actual"
      # A pinned, checksum-verified prebuilt binary: no Rust toolchain, no
      # compile. Bump VERSION and SHA256 together.
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: "0.19.9"
          CARGO_DENY_SHA256: "f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af"
        run: |
          set -euo pipefail
          slug="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          archive="${RUNNER_TEMP}/${slug}.tar.gz"
          # --retry-all-errors because a truncated transfer exits 18, outside
          # curl's default retry set, and would surface as a checksum mismatch.
          # --max-time bounds a stalled connection that never errors.
          curl -fsSL --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -o "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${slug}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" "${slug}/cargo-deny"
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/${slug}/cargo-deny" "${HOME}/.local/bin/cargo-deny"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/cargo-deny" --version
      - name: Licenses, bans, and sources
        if: ${{ inputs.policy }}
        working-directory: ${{ inputs.working-directory }}
        run: cargo-deny --all-features check bans licenses sources
      # Pinned and checksum-verified like cargo-deny. Bump VERSION and SHA256
      # together; the digest is the release asset's published sha256.
      - name: Install cargo-audit
        env:
          CARGO_AUDIT_VERSION: "0.22.2"
          CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"
        run: |
          set -euo pipefail
          slug="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          archive="${RUNNER_TEMP}/${slug}.tgz"
          curl -fsSL --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -o "${archive}" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${slug}.tgz"
          echo "${CARGO_AUDIT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" "${slug}/cargo-audit"
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/${slug}/cargo-audit" "${HOME}/.local/bin/cargo-audit"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/cargo-audit" --version
      - name: Refresh lockfile advisory database
        id: advisory-db
        run: |
          set -euo pipefail
          database="$(mktemp -d "$RUNNER_TEMP/lockfile-advisories.XXXXXX")"
          git clone --quiet --depth=1 https://github.com/RustSec/advisory-db "$database"
          revision="$(git -C "$database" rev-parse --verify HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'path=%s\nrevision=%s\n' "$database" "$revision" >> "$GITHUB_OUTPUT"
          printf 'lockfile_advisory_database_revision=%s\n' "$revision"
      - name: Security advisories
        id: advisories
        working-directory: ${{ inputs.working-directory }}
        env:
          ADVISORY_LINTS: ${{ github.event_name == 'pull_request' && '--warn unmaintained --warn unsound' || '' }}
          LOCKFILE_ADVISORY_DATABASE: ${{ steps.advisory-db.outputs.path }}
        run: |
          set -uo pipefail
          # GitHub runs `bash -e`, and `set -uo` leaves -e on: the first failing
          # scan would exit here before any finding reached the log or the issue.
          set +e
          # shellcheck disable=SC2086 # ADVISORY_LINTS is a flag list
          cargo-deny --all-features check advisories ${ADVISORY_LINTS}
          status=$?
          findings=""
          if [ "${status}" -ne 0 ]; then
            # Re-read the fetched database as JSON so the tracking issue lists
            # each finding. An empty list means cargo-deny itself failed.
            # shellcheck disable=SC2086
            findings="$(cargo-deny --format json --all-features check --disable-fetch \
              advisories ${ADVISORY_LINTS} 2>&1 \
              | jq -r 'select(.type == "diagnostic" and .fields.severity == "error")
                  | .fields as $f | ($f.graphs[0].Krate // {}) as $k
                  | "- \($f.advisory.id // $f.code) `\($k.name // "")` \($k.version // ""): \($f.message) (\($f.code))"' \
              | sort -u || true)"
          fi

          # The same ignore list gates the whole lockfile, and owns the stale
          # check: cargo-deny cannot see a lockfile-only crate, so it would call
          # that crate's ignore stale. The script reads every advisory the
          # lockfile matches, ignored or not, so a stale ignore is one that
          # matches nothing there.
          cat > "${RUNNER_TEMP}/lockfile-advisories.py" <<'PY'
          import json
          import re
          import sys
          import tomllib

          today, report_path = sys.argv[1:3]
          with open("deny.toml", "rb") as handle:
              ignores = tomllib.load(handle).get("advisories", {}).get("ignore", [])
          try:
              with open(report_path, encoding="utf-8") as handle:
                  report = json.load(handle)
              advisory_count = report["database"]["advisory-count"]
              if type(advisory_count) is not int or advisory_count <= 0:
                  raise ValueError("advisory database census is missing or empty")
              vulnerabilities = report["vulnerabilities"]["list"]
              # Unmaintained, unsound, and yanked entries are warnings. They
              # never fail here, but an ignore for one is still in use.
              matched = {w["advisory"]["id"] for kind in report["warnings"].values()
                         for w in kind if w.get("advisory")}
          except (OSError, ValueError, KeyError, AttributeError) as error:
              print(f"cargo-audit report unreadable: {error!r}", file=sys.stderr)
              sys.exit(3)
          matched |= {v["advisory"]["id"] for v in vulnerabilities}

          active = set()
          findings = []
          for entry in ignores:
              name = entry.get("id") if isinstance(entry, dict) else entry
              reason = entry.get("reason", "") if isinstance(entry, dict) else ""
              found = re.search(r"Review by (\d{4}-\d{2}-\d{2})", reason)
              if not isinstance(entry, dict) or not entry.get("id"):
                  findings.append(f"- ignore {name!r} must be a table with an id and a reason")
              elif not found:
                  findings.append(f"- ignore {name} has no `Review by YYYY-MM-DD` in its reason")
              elif found.group(1) < today:
                  findings.append(f"- ignore {name} expired on {found.group(1)}")
              elif name not in matched:
                  findings.append(f"- ignore {name} matches nothing in Cargo.lock; delete it")
              else:
                  active.add(name)
          for v in vulnerabilities:
              if v["advisory"]["id"] not in active:
                  p = v["package"]
                  findings.append(
                      f"- {v['advisory']['id']} `{p['name']}` {p['version']}: "
                      f"{v['advisory']['title']} (Cargo.lock)"
                  )
          print("\n".join(sorted(set(findings))))
          sys.exit(1 if findings else 0)
          PY
          audit_json="${RUNNER_TEMP}/cargo-audit.json"
          cargo-audit audit --db "$LOCKFILE_ADVISORY_DATABASE" --no-fetch --json --file Cargo.lock > "${audit_json}"
          lockfile_findings="$(python3 -I "${RUNNER_TEMP}/lockfile-advisories.py" "$(date -u +%F)" "${audit_json}")"
          lockfile_status=$?
          if [ "${lockfile_status}" -ne 0 ]; then
            status="${lockfile_status}"
            findings="${findings}"$'\n'"${lockfile_findings}"
          fi

          if [ "${status}" -ne 0 ]; then
            findings="$(printf '%s' "${findings}" | sed '/^$/d')"
            # The run log is where a red pull request is read.
            printf '::error title=Advisory findings::%s\n' "${findings//$'\n'/%0A}"
            delimiter="findings-$(openssl rand -hex 8)"
            printf 'findings<<%s\n%s\n%s\n' "${delimiter}" "${findings}" "${delimiter}" >> "${GITHUB_OUTPUT}"
          fi
          exit "${status}"
    outputs:
      source_revision: ${{ steps.checked-source.outputs.revision }}
      advisory_database_revision: ${{ steps.advisory-db.outputs.revision }}
      advisories: ${{ steps.advisories.outcome }}
      findings: ${{ steps.advisories.outputs.findings }}

  tracking-issue:
    name: Advisory tracking issue
    needs: cargo-deny
    # Only the default branch owns the issue; the step checks the branch,
    # because a `schedule` payload carries no `repository` object. A run that
    # never reached the advisories step (install or policy failure) says
    # nothing about advisories, so it leaves the issue alone.
    if: >-
      ${{ always()
      && inputs.source-revision == ''
      && github.event_name != 'pull_request'
      && (needs.cargo-deny.outputs.advisories == 'success'
          || (needs.cargo-deny.outputs.advisories == 'failure' && needs.cargo-deny.outputs.findings != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ needs.cargo-deny.outputs.advisories }}
          FINDINGS: ${{ needs.cargo-deny.outputs.findings }}
          WORKSPACE: ${{ inputs.working-directory }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${GH_REPO}" --jq .default_branch)"
          if [ "${GITHUB_REF_NAME}" != "${default_branch}" ]; then
            echo "Ref ${GITHUB_REF_NAME} is not ${default_branch}; the tracking issue follows the default branch only."
            exit 0
          fi
          # The marker finds the issue without a label or a search index.
          marker="<!-- cargo-deny-advisories:${WORKSPACE} -->"
          issue="$(gh issue list --state open --limit 500 --json number,body \
            | jq -r --arg m "${marker}" 'map(select(.body | contains($m))) | .[0].number // empty')"
          if [ "${OUTCOME}" = "success" ]; then
            if [ -n "${issue}" ]; then
              gh issue close "${issue}" --comment "Advisories pass on the default branch as of ${RUN_URL}."
            fi
            exit 0
          fi
          # shellcheck disable=SC2016 # the backticks are Markdown
          body="$(printf '%s\n\ncargo-deny and cargo-audit report these RustSec advisories against the default branch in `%s`:\n\n%s\n\nUpgrade the crate, or add an ignore with the advisory ID and a reason that ends in `Review by YYYY-MM-DD` to `deny.toml`. Never ignore a vulnerability that has a fix. This issue closes itself when the scheduled run passes.\n' \
            "${marker}" "${WORKSPACE}" "${FINDINGS}")"
          if [ -z "${issue}" ]; then
            title="RustSec advisories on the default branch"
            [ "${WORKSPACE}" = "." ] || title="${title} (${WORKSPACE})"
            issue="$(gh issue create --title "${title}" --body "${body}" | sed 's#.*/##')"
            gh issue comment "${issue}" --body "Found by ${RUN_URL}."
          elif [ "$(gh issue view "${issue}" --json body --jq .body)" != "${body}" ]; then
            gh issue edit "${issue}" --body "${body}"
            gh issue comment "${issue}" --body "The advisory set changed in ${RUN_URL}."
          fi
