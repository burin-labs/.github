# Thin dispatcher for the organization .github repository itself.
# Product repositories copy this file and pin the reusable workflow SHA.

name: Merge override dispatch

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: write

jobs:
  override:
    name: Dispatch merge override
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["bypass-ci", "bypass-merge-queue", "force-merge"]'), github.event.label.name)
    uses: ./.github/workflows/merge-override.yml
    with:
      label: ${{ github.event.label.name }}
      actor: ${{ github.actor }}
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      head-repository: ${{ github.event.pull_request.head.repo.full_name }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
