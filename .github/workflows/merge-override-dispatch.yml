# Thin dispatcher for the organization .github repository itself.
# Product repositories copy this file and pin the reusable workflow SHA.
#
# pull_request_target runs main's copy of this file, never a pull request's or
# its base's (probed 2026-11-03), so
# a `CI status` aggregator can trust this workflow's runs as the override's
# authorization. The reusable workflow reads the pull request through the API
# and never checks out its code.

name: Merge override dispatch

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  override:
    name: Dispatch merge override
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["bypass-ci", "bypass-merge-queue", "force-merge"]'), github.event.label.name)
    uses: ./.github/workflows/merge-override.yml
    with:
      label: ${{ github.event.label.name }}
      actor: ${{ github.actor }}
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      head-repository: ${{ github.event.pull_request.head.repo.full_name }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
