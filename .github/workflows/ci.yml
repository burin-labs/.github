name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  # Supersede only older runs of the same pull request. Every main push,
  # merge group and manual run keeps its own slot and required verdict.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smart-ship-control-runtime:
    name: Pinned shipping control runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the immutable shipping control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burin-labs/.github
          ref: df9c75308b05be787532b0d2a827e0ae8a61c095
          path: .smart-ship-control
          persist-credentials: false
      - name: Install the shipping consumer runtime
        uses: burin-labs/harn/.github/actions/setup-harn@11681af676a5e4dc4200cfee683150cdec26763f
        with:
          version: "0.10.166"
      - name: Exercise the immutable control script
        run: >-
          harn test .smart-ship-control/scripts/smart-ship-label/policy_test.harn
          --json-out "${{ runner.temp }}/smart-ship-control-tests.json"
      - name: Exercise the candidate policy reader on the shipping runtime
        run: harn test scripts/smart-ship-policy

  local-check-contract:
    name: Local workflow check contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the shared action
        uses: ./.github/actions/local-workflow-checks
        with:
          harn-version: 0.10.133
          workflow: .github/fixtures/local-workflow-checks/workflow.yml
          policy: .github/fixtures/local-workflow-checks/policy.json
      - name: Check the Harn package and controls
        run: |
          harn package check .
          harn test scripts/local-checks
          harn test scripts/ci-runtime-evidence
          harn test scripts/release-promotion
          harn test scripts/release-repin
          harn test scripts/merge-override
          harn test scripts/smart-ship-label
          harn test scripts/smart-ship-policy
          harn test scripts/smart-ship-targets
          harn test scripts/workflow-policy
          harn test scripts/hosted-runner-labels
          harn test scripts/harn-required-review
          harn test scripts/review-dispatch
          bash .github/actions/local-workflow-checks/run_test.sh
      - name: Set up the CI job proof runtime
        uses: burin-labs/harn/.github/actions/setup-harn@11681af676a5e4dc4200cfee683150cdec26763f
        with:
          version: "0.10.159"
      - name: Test CI job proof reuse
        run: harn test scripts/ci-job-proof
      # Dogfooding: the same action product repositories call, on the Harn
      # release the shared action above already installed.
      - name: Check hosted runner labels
        uses: ./.github/actions/hosted-runner-labels
        with:
          skip-harn-setup: "true"
      - name: Measure registration smoke inputs
        id: proof-smoke-inputs
        run: >-
          harn run --grant output=env:GITHUB_OUTPUT,expose=GITHUB_OUTPUT
          --write-root "$RUNNER_TEMP" --read-only-root "$GITHUB_WORKSPACE"
          scripts/ci-job-proof/smoke.harn -- identity "$GITHUB_WORKSPACE"
      - name: Register actual CI checkout
        id: proof-source
        uses: ./.github/actions/ci-job-proof
        with:
          workflow-file: ci.yml
          job-identities: ${{ steps.proof-smoke-inputs.outputs.identities }}
          registrar-job: Local workflow check contract
          registrar-step: Register actual CI checkout
          event-name: ${{ github.event_name }}
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          github-token: ${{ github.token }}
      - name: Read back actual CI checkout registration
        env:
          REGISTRATION: ${{ steps.proof-source.outputs.registration }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          harn run --read-only-root "$GITHUB_WORKSPACE"
          scripts/ci-job-proof/smoke.harn -- verify "$GITHUB_WORKSPACE"
          "$REGISTRATION" "$RUN_HEAD" "$GITHUB_SHA"

  package-smoke:
    name: Reusable Harn package smoke (${{ matrix.strict && 'strict' || 'default' }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        strict: [false, true]
    uses: ./.github/workflows/harn-package.yml
    with:
      harn-version: 0.10.52
      package-path: .github/fixtures/harn-package
      strict: ${{ matrix.strict }}
      validate-command: >-
        test "$(harn --version)" = "harn 0.10.52" &&
        test -s .harn/receipts/package-verify.json
      artifact-name: harn-package-smoke-${{ matrix.strict && 'strict' || 'default' }}-receipts

  ci-status:
    name: CI status
    needs: [local-check-contract, package-smoke, smart-ship-control-runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # For check-commit-signatures below, which reads pulls/{n}/commits.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dogfooding: this repo is under the same org `required_signatures` rule
      # as every repo that consumes the action, so it has the same silent-block
      # exposure and should be the first place the gate is proven.
      - name: Check commit signatures
        uses: ./.github/actions/check-commit-signatures
        with:
          github-token: ${{ github.token }}
      - name: Check CI latency policy
        uses: ./.github/actions/ci-latency-policy
        with:
          baseline-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          github-token: ${{ github.token }}
      - name: Check out the Smart Ship target publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: burin-labs/.github
          ref: 91ad5a4b9c7fe58823e1433808eda60c5cd48cdb
          path: .smart-ship-targets
          sparse-checkout: scripts/smart-ship-targets
          persist-credentials: false
      - name: Record the selected pull requests
        env:
          NUMBERS: "7 8"
        run: >-
          harn run --no-sandbox
          .smart-ship-targets/scripts/smart-ship-targets/cli.harn --
          --output "$RUNNER_TEMP/ship-targets/targets.json"
      - name: Publish the selected pull requests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smart-ship-targets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ship-targets/targets.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/bin"
          mkdir -p "${bin_dir}"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${bin_dir}" actionlint
          echo "${bin_dir}" >> "$GITHUB_PATH"
      - name: GitHub Actions lint
        run: actionlint
      - name: Test graph-derived Rust impact planning
        run: node --test .github/actions/rust-test-impact/plan.test.mjs
      - name: Test immutable CI baseline bootstrap transport
        run: |
          node --version
          node --test .github/actions/ci-latency-policy/read-baseline.test.mjs .github/actions/ci-latency-policy/action.test.mjs
      - name: Test shell actions
        run: bash .github/actions/pr-title-check/check_test.sh
      - name: Require reusable package smoke
        env:
          LOCAL_CHECK_CONTRACT_RESULT: ${{ needs.local-check-contract.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          SMART_SHIP_CONTROL_RESULT: ${{ needs.smart-ship-control-runtime.result }}
        run: |
          test "$LOCAL_CHECK_CONTRACT_RESULT" = success
          test "$PACKAGE_SMOKE_RESULT" = success
          test "$SMART_SHIP_CONTROL_RESULT" = success
      - name: Check Dependabot config
        uses: ./.github/actions/check-dependabot-config
      - name: Test package workflow policy
        run: |
          ruby .github/actions/harn-repo-policy/check-workflow_test.rb
          ruby .github/actions/harn-repo-policy/check-release-integrity_test.rb
          ruby .github/actions/harn-package/run-contract_test.rb
          ruby .github/actions/local-workflow-checks/run_contract_test.rb
          ruby .github/actions/require-successful-needs/require-successful-needs_test.rb
          harn test scripts/ci-latency
          ruby .github/actions/check-commit-signatures/check_commit_signatures_test.rb
          ruby .github/workflows/harn-package_test.rb
          ruby .github/workflows/runner-availability_test.rb
          ruby scripts/dependabot_waivers_test.rb
          ruby scripts/reusable_pin_drift_test.rb
      - name: Set up checker test runtime
        uses: burin-labs/harn/.github/actions/setup-harn@11681af676a5e4dc4200cfee683150cdec26763f
        with:
          version: "0.10.170"
      - name: Test Dependabot configuration owner
        run: harn test scripts/dependabot-config
      - name: Test released guard publication adapter
        working-directory: scripts/guard-publication
        run: |
          harn install --locked
          harn check publish.harn publish_test.harn
          harn test publish_test.harn
      # Dogfooding: every repo that wires this action inherits whatever this
      # repo proves about it. Gated on the pull_request event because
      # merge_group and push carry no pull request number.
      - name: Check PR title and description
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/pr-title-check
        with:
          areas: "CI|Actions|Labels|Templates|Docs|Skills"
      - name: Shell syntax
        run: |
          # The drift checker is only ever executed by a scheduled run, so a
          # syntax error in it would otherwise surface a day later, in a job
          # nobody is watching, as the absence of a report.
          bash -n .github/actions/harn-package/run-contract.sh
          bash -n .github/actions/local-workflow-checks/run.sh
          bash -n .github/actions/local-workflow-checks/run_test.sh
          bash -n .github/actions/ci-runtime-evidence/run.sh
          bash -n .github/actions/ci-latency-policy/run.sh
          bash -n .github/actions/pr-title-check/check.sh
          bash -n .github/actions/check-dependabot-config/run.sh
          bash -n .github/actions/ci-job-proof/run.sh
          bash -n scripts/ci-routing.sh
          bash -n scripts/runner-fleet-health.sh
          bash -n scripts/reusable-pin-drift.sh
          bash -n scripts/release-promotion/run.sh
          bash -n .github/actions/validate-candidate-manifest/run.sh
          bash -n scripts/release-repin/run.sh
          bash -n scripts/merge-override/run.sh
          bash -n scripts/review-dispatch/run.sh
