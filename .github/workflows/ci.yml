name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

jobs:
  package-smoke:
    name: Reusable Harn package smoke (${{ matrix.strict && 'strict' || 'default' }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        strict: [false, true]
    uses: ./.github/workflows/harn-package.yml
    with:
      harn-version: 0.10.52
      package-path: .github/fixtures/harn-package
      strict: ${{ matrix.strict }}
      validate-command: >-
        test "$(harn --version)" = "harn 0.10.52" &&
        test -s .harn/receipts/package-verify.json
      artifact-name: harn-package-smoke-${{ matrix.strict && 'strict' || 'default' }}-receipts

  ci-status:
    name: CI status
    needs: [package-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For check-commit-signatures below, which reads pulls/{n}/commits.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dogfooding: this repo is under the same org `required_signatures` rule
      # as every repo that consumes the action, so it has the same silent-block
      # exposure and should be the first place the gate is proven.
      - name: Check commit signatures
        uses: ./.github/actions/check-commit-signatures
        with:
          github-token: ${{ github.token }}
      - name: Check CI latency policy
        uses: ./.github/actions/ci-latency-policy
        with:
          baseline-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          github-token: ${{ github.token }}
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/bin"
          mkdir -p "${bin_dir}"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL \
            -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${bin_dir}" actionlint
          echo "${bin_dir}" >> "$GITHUB_PATH"
      - name: GitHub Actions lint
        run: actionlint
      - name: Test graph-derived Rust impact planning
        run: node --test .github/actions/rust-test-impact/plan.test.mjs
      - name: Test exact-tree CI proof reuse
        run: bash .github/actions/exact-tree-ci-proof/run-tests.sh
      - name: Test shell actions
        run: bash .github/actions/pr-title-check/check_test.sh
      - name: Require reusable package smoke
        env:
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
        run: test "$PACKAGE_SMOKE_RESULT" = success
      - name: Test package workflow policy
        run: |
          ruby .github/actions/harn-repo-policy/check-workflow_test.rb
          ruby .github/actions/harn-repo-policy/check-release-integrity_test.rb
          ruby .github/actions/harn-package/run-contract_test.rb
          ruby .github/actions/require-successful-needs/require-successful-needs_test.rb
          ruby .github/actions/check-dependabot-config/check_dependabot_config_test.rb
          ruby .github/actions/ci-latency-policy/ci_latency_baseline_test.rb
          ruby .github/actions/ci-latency-policy/check_ci_latency_policy_test.rb
          ruby .github/actions/check-commit-signatures/check_commit_signatures_test.rb
          ruby .github/workflows/ci_test.rb
          ruby .github/workflows/harn-package_test.rb
          ruby .github/workflows/register-package-release_test.rb
          ruby .github/workflows/runner-availability_test.rb
          ruby .github/workflows/runner-fleet-health_test.rb
          ruby .github/workflows/dependabot-waiver-audit_test.rb
          ruby scripts/ci_latency_observer_test.rb
          ruby scripts/dependabot_waivers_test.rb
          ruby scripts/merge_override_test.rb
          ruby scripts/reusable_pin_drift_test.rb
      - name: Check Dependabot config
        uses: ./.github/actions/check-dependabot-config
      # Dogfooding: every repo that wires this action inherits whatever this
      # repo proves about it. Gated on the pull_request event because
      # merge_group and push carry no pull request number.
      - name: Check PR title and description
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/pr-title-check
        with:
          areas: "CI|Actions|Labels|Templates|Docs|Skills"
      - name: Shell syntax
        run: |
          # The drift checker is only ever executed by a scheduled run, so a
          # syntax error in it would otherwise surface a day later, in a job
          # nobody is watching, as the absence of a report.
          bash -n .github/actions/harn-package/run-contract.sh
          bash -n .github/actions/pr-title-check/check.sh
          bash -n .github/actions/exact-tree-ci-proof/gate.sh
          bash -n .github/actions/exact-tree-ci-proof/workflow-proof.sh
          bash -n .github/actions/exact-tree-ci-proof/merge-group-proof.sh
          bash -n .github/actions/exact-tree-ci-proof/pr-tree-proof.sh
          bash -n .github/actions/exact-tree-ci-proof/resolve.sh
          bash -n .github/actions/exact-tree-ci-proof/run-tests.sh
          bash -n scripts/ci-routing.sh
          bash -n scripts/runner-fleet-health.sh
          bash -n scripts/reusable-pin-drift.sh
