name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

jobs:
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Test package workflow policy
        run: |
          ruby .github/actions/harn-repo-policy/check-workflow_test.rb
          ruby .github/workflows/harn-package_test.rb
