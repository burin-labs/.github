version: 2

# This file is the source projected into repositories that use GitHub Actions.
# Cooldown gives a compromised release time to be yanked or flagged before an
# automated PR proposes it. Version updates run monthly so routine bumps arrive
# as one grouped pull request a month; security updates ignore the schedule and
# still arrive immediately.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    # harn-bump-fleet updates this reference together with orchestration-sha.
    # Dependabot changes only the reference and breaks their exact pairing.
    # Keep this list last so projections can append repository-owned ignores.
    ignore:
      - dependency-name: "burin-labs/harn/.github/workflows/bump-harn.yml"
