version: 2

# This file is the source projected into repositories that use GitHub Actions.
# Cooldown gives a compromised release time to be yanked or flagged before an
# automated PR proposes it.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    # harn-bump-fleet updates this reference together with orchestration-sha.
    # Dependabot changes only the reference and breaks their exact pairing.
    ignore:
      - dependency-name: "burin-labs/harn/.github/workflows/bump-harn.yml"
    groups:
      actions:
        patterns:
          - "*"
